function updateFireworks(dt){
  for(let i=rockets.length-1;i>=0;i--){ const r=rockets[i];
    r.v.y-=6*dt; r.p.addScaledVector(r.v,dt); r.fuse-=dt;
    const tc=r.trail, dick=r.dick||0;
    for(let k=0;k<2+dick*3;k++) psBig.emit(r.p.x,r.p.y,r.p.z,rand(-.5,.5)*(1+dick*0.4),rand(-2,0),rand(-.5,.5)*(1+dick*0.4),tc[0],tc[1]*rand(0.8,1),tc[2]*0.9,0.34+dick*0.16,1,4);
    /* Kugelbomben ziehen zusaetzlich glimmende Schlacke hinter sich her */
    if(dick) for(let k=0;k<dick;k++)
      psMid.emit(r.p.x,r.p.y,r.p.z,rand(-1.2,1.2),rand(-3.5,-0.5),rand(-1.2,1.2),1,.62,.2,rand(0.5,1.1),3.2,4);
    if(r.fuse<=0){ fwBurst(r); rockets.splice(i,1); } }
  for(let i=emitters.length-1;i>=0;i--){ const e=emitters[i]; e.t-=dt; const o=e.o||PAD;
    if(e.k==='fountain'||e.k==='volcano'||e.k==='wasserfall'){
      const big=e.k==='volcano', wf=e.k==='wasserfall', n=big?18:wf?22:10;
      const A=e.A||FW.gold, B=e.B||FW.weiss;
      e.fl=(e.fl||0)-dt; if(e.fl<=0){ e.fl=0.3; flash({x:o.x,y:o.y+1.4,z:o.z},A,big?1.8:1.2,0.34); }
      for(let k=0;k<n;k++){ const a=Math.random()*Math.PI*2, s=rand(0.3,wf?2.6:big?1.9:1.2), c=Math.random()<0.72?A:B;
        psMid.emit(o.x+(wf?rand(-1.6,1.6):0),o.y+0.2,o.z,Math.cos(a)*s,wf?rand(3,6):rand(4.5,big?10.5:6.8),Math.sin(a)*s,c[0],c[1],c[2],rand(0.8,wf?2.4:big?1.9:1.3),wf?7:5,4); } }
    else if(e.k==='furzfont'){
      /* brauner Schweif, waehrend die Rakete steigt */
      for(let k=0;k<9;k++){ const a=Math.random()*Math.PI*2, sp=rand(0.2,1.3);
        const c=k%4?FW.braun:FW.sumpf;
        psMid.emit(o.x,o.y+0.25,o.z,Math.cos(a)*sp,rand(2.5,5.5),Math.sin(a)*sp,c[0],c[1],c[2],rand(1.2,2.2),-0.2); } }
    else if(e.k==='stink'){
      for(let k=0;k<6;k++){ const a=Math.random()*Math.PI*2, sp=rand(0.2,1.6);
        const c=k%3?FW.sumpf:FW.braun;
        psMid.emit(o.x+rand(-.5,.5),0.18,o.z+rand(-.5,.5),Math.cos(a)*sp,rand(0.3,1.4),Math.sin(a)*sp,c[0],c[1],c[2],rand(2.0,3.4),-0.5); } }
    else if(e.k==='spark'){
      for(let k=0;k<7;k++){ const d=randDir(), s=rand(1,2.4);
        psSmall.emit(o.x,o.y+0.3,o.z,d[0]*s,d[1]*s+0.4,d[2]*s,1,rand(0.8,1),rand(0.45,0.85),rand(0.25,0.55),4,3); } }
    else { for(let k=0;k<2;k++){ const d=randDir();
        psSmall.emit(o.x,o.y+0.05,o.z,d[0],d[1]+0.4,d[2],1,0.9,0.5,rand(0.2,0.4),4,0); } }
    if(e.t<=0) emitters.splice(i,1); }
  psHuge.update(dt); psBig.update(dt); psMid.update(dt); psSmall.update(dt); updateFlash(dt);
}

/* =========================================================
   Choreografie: Batterien und Verbunde laufen als Show ab
   ========================================================= */
const FANDIR=Math.PI/2;                 // Fächer quer zum Blickfeld
function playShow(o,phases){
  let t=0;
  phases.forEach(ph=>{
    const n=ph.n||1, gap=ph.gap===undefined?0.45:ph.gap;
    const fixed=ph.sc===undefined?Math.floor(Math.random()*SCHEMES.length):ph.sc;
    if(ph.ground){ const st=t, A=K(ph.gA||'gold'), B=K(ph.gB||'weiss');
      later(st,()=>{ emitters.push({t:ph.gt||4,k:ph.ground,o,A,B}); sfx.fizz(distVol(o)); }); }
    for(let i=0;i<n;i++){
      const k=n>1?i/(n-1):0.5, tt=t+i*gap;
      let ang=0;
      if(ph.fan) ang=(-1+2*k)*(ph.ang||0.3);
      else if(ph.vfan) ang=(1-Math.abs(0.5-k)*2)*(ph.ang||0.3)*(i%2?1:-1);
      else if(ph.ang) ang=rand(-ph.ang,ph.ang);
      const eff=Array.isArray(ph.eff)?pick(ph.eff):(ph.eff||pick(EFF_GROSS));
      const sc=ph.sc==='each'?-1:fixed;
      const dir=ph.fan||ph.vfan?FANDIR:undefined;
      const opt={eff,sz:ph.sz||1,pw:ph.pw||0,ang,dir,sc,fuse:ph.fuse,dick:ph.dick};
      later(tt,()=>{
        if(ph.mine) mine(o,scheme(sc)[0],scheme(sc)[1],ph.mineSz||0.8);
        /* bomb: echte Kugelbombe mit Nachbruechen statt einer Rakete */
        if(ph.bomb){ const [A,B]=scheme(sc); kugelbombe(o,ph.bomb,{A,B,eff}); }
        else shot(o,opt);
      });
    }
    t+=n*gap+(ph.pause||0);
  });
  return t;
}

const pl={x:-2.5,z:1.5}; let yaw=Math.atan2(2.5,-3), pitch=-0.3, bobT=0;
/* Sanfte Blickfuehrung, z.B. beim Zuenden auf das Testfeld.
   Jede eigene Mausbewegung bricht sie sofort ab. */
let aim=null;
function aimAt(x,z,p2){
  const dx=x-pl.x, dz=z-pl.z;
  aim={yaw:Math.atan2(-dx,-dz),pitch:p2===undefined?0.2:p2,t:0.9};
}
function updateAim(dt){
  if(!aim) return;
  let d=aim.yaw-yaw;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  const k=Math.min(1,dt*7);
  yaw+=d*k; pitch+=(aim.pitch-pitch)*k;
  aim.t-=dt; if(aim.t<=0||Math.abs(d)<0.004) aim=null;
}
const keys={}; const joy={x:0,y:0,id:null,ox:0,oy:0};
let sprayOn=false, sprayCool=0, build=false, grabbed=null, grabRy=0, grabHome=null;
function collide(p,R){
  for(const c of colliders){
    const cx=clamp(p.x,c.minX,c.maxX), cz=clamp(p.z,c.minZ,c.maxZ), dx=p.x-cx, dz=p.z-cz, d2=dx*dx+dz*dz;
    if(d2<R*R){
      if(d2>1e-8){ const d=Math.sqrt(d2); p.x=cx+dx/d*R; p.z=cz+dz/d*R; }
      else { const a=p.x-c.minX, b=c.maxX-p.x, e=p.z-c.minZ, f=c.maxZ-p.z, m=Math.min(a,b,e,f);
        if(m===a) p.x=c.minX-R; else if(m===b) p.x=c.maxX+R; else if(m===e) p.z=c.minZ-R; else p.z=c.maxZ+R; }
    }
  }
  p.x=clamp(p.x,-26.3,11.6); p.z=clamp(p.z,-14.7,10.8);
}
function look(dx,dy,s){ aim=null; yaw-=dx*s; pitch=clamp(pitch-dy*s,-1.45,1.45); }
function updatePlayer(dt){
  let mx_=0,mz=0;
  if(keys.KeyW||keys.ArrowUp) mz-=1; if(keys.KeyS||keys.ArrowDown) mz+=1;
  if(keys.KeyA||keys.ArrowLeft) mx_-=1; if(keys.KeyD||keys.ArrowRight) mx_+=1;
  mx_+=joy.x; mz+=joy.y;
  const len=Math.hypot(mx_,mz); if(len>1){ mx_/=len; mz/=len; }
  const sp=(keys.ShiftLeft||keys.ShiftRight)?5.2:3.2, s=Math.sin(yaw), c=Math.cos(yaw);
  pl.x+=(mx_*c+mz*s)*sp*dt; pl.z+=(-mx_*s+mz*c)*sp*dt; collide(pl,0.32);
  if(len>0.1) bobT+=dt*sp*2.6;
  const sx=shake>0?rand(-shake,shake)*0.15:0; shake=Math.max(0,shake-dt*1.5);
  camera.position.set(pl.x+sx,1.65+Math.sin(bobT)*0.035+sx,pl.z);
  updateAim(dt);
  camera.rotation.set(pitch,yaw,0);
  if(sprayCool>0) sprayCool-=dt;
}

/* ---------- Umbaumodus ---------- */
function rectOf(m,x,z,ry){ const s=Math.abs(Math.sin(ry))>0.5, w=(s?m.fd:m.fw)/2, d=(s?m.fw:m.fd)/2; return {minX:x-w,maxX:x+w,minZ:z-d,maxZ:z+d}; }
/* Umgebaut werden darf in jedem Raum, der schon freigeschaltet ist.
   Ein Moebel muss ganz in einen Raum passen - so landet nichts in
   einem Durchgang oder halb in der Wand. */
const UMBAU_RAUM=[
  {r:LAY.basis},                        {r:LAY.lbasis},
  {r:LAY.ost1, z:'shop_gross'},         {r:LAY.ost2, z:'shop_ost'},
  {r:LAY.sued, z:'shop_sued'},          {r:LAY.lnord,z:'lager_gross'},
  {r:LAY.lsued,z:'lager_sued'},         {r:LAY.lwest,z:'lager_west'}
];
function imRaum(minX,maxX,minZ,maxZ){
  return UMBAU_RAUM.some(b=>(!b.z||zoneOffen(b.z))&&
    minX>=b.r.x0+0.08&&maxX<=b.r.x1-0.08&&minZ>=b.r.z0+0.08&&maxZ<=b.r.z1-0.08);
}
function spotFree(m,x,z,ry){
  if(!m.fw) return imRaum(x,x,z,z);
  const r=rectOf(m,x,z,ry);
  if(!imRaum(r.minX,r.maxX,r.minZ,r.maxZ)) return false;
  for(const c of colliders){ if(c.ref===m) continue;
    if(r.minX<c.maxX&&r.maxX>c.minX&&r.minZ<c.maxZ&&r.maxZ>c.minZ) return false; }
  return true;

const ray=new THREE.Raycaster(), center=new THREE.Vector2(0,0);

function movableOf(obj){ let o=obj; while(o){ const m=movables.find(m=>m.g===o); if(m) return m; o=o.parent; } return null; }
/* Der Strahl reicht hoechstens sechs Meter weit. Alles, was weiter
   weg steht, muss gar nicht erst geprueft werden - bei ueber fuenfzig
   Regalen und einem Lager voller Stellplaetze ist das der Unterschied
   zwischen tausend Tests pro Bild und ein paar Dutzend. */
function nahDran(p,r){ return Math.abs(p.x-pl.x)<r&&Math.abs(p.z-pl.z)<r; }
function nahBox(a,r){ return pl.x>a.x0-r&&pl.x<a.x1+r&&pl.z>a.z0-r&&pl.z<a.z1+r; }
function updateTarget(){
  ray.setFromCamera(center,camera); ray.far=build?6:3.3;
  target=null;
  if(build){
    if(grabbed){ target={kind:'placing'}; return; }
    const list=movables.filter(m=>nahDran(m.g.position,8)).map(m=>m.g);
    const hits=ray.intersectObjects(list,true);
    if(hits.length){ const m=movableOf(hits[0].object); if(m) target={kind:'movable',ref:m}; }
    return;
  }
  const R=5.5;
  const list=[];
  floorBoxes.forEach(b=>{ if(nahDran(b.mesh.position,R)) list.push(b.mesh); });
  shelves.forEach(sh=>{ if(nahDran(sh.g.position,R)) sh.levels.forEach(l=>list.push(l.hit)); });
  dirts.forEach(d=>{ if(nahDran(d.m.position,R)) list.push(d.hit); });
  racks.forEach(r=>{ if(nahDran(r.g.position,R)) r.slots.forEach(s=>list.push(s.hit)); });
  belt.forEach(b=>list.push(b.hit));
  for(const k in stations) if(nahDran(stations[k].g.position,R)) list.push(stations[k].hit);
  list.push(lapHit,doorSign,posHit,cardHit);
  if(pultHit) list.push(pultHit);
  if(gravHit) list.push(gravHit);
  if(packHit&&zoneOffen('packstation')) list.push(packHit);
  if(truck&&truck.state==='docked') truck.boxes.forEach(m=>list.push(m));
  list.push(...windowHits);
  for(const o of occluders) if(!o.userData.aabb||nahBox(o.userData.aabb,6.5)) list.push(o);
  const hits=ray.intersectObjects(list,false);
  if(hits.length){ const ud=hits[0].object.userData; if(ud&&ud.kind) target={kind:ud.kind,ref:ud.ref,obj:hits[0].object}; }
}

function doAction(){

  const k=target.kind, r=target.ref, reg=regCustomer();
  if(k==='placing') placeGrab();
  else if(k==='movable') grab(r);
  else if(k==='box'){ if(S.carrying){ toast('Du trägst schon einen Karton. Erst abstellen.','bad'); return; } pickUp(r); }
  else if(k==='level'){ if(S.carrying) stockOne(r); }
  else if(k==='dirt') cleanTick(r,true);
  else if(k==='window') cleanWindowTick(true);
  else if(k==='rslot'){
    if(S.carrying&&!r.box){ putInSlot(r,S.carrying.type,S.carrying.count); S.carrying=null; S.tut.lager=true; sfx.pop(); updateCarry(); }
    else if(!S.carrying&&r.box){ S.carrying={type:r.box.type,count:r.box.count}; r.rk.g.remove(r.box.mesh); r.box=null; drawRackSchild(r.rk); sfx.pop(); updateCarry(); }
  }
  else if(k==='belt') scanBelt(r);
  else if(k==='card'){ if(reg&&reg.state==='pay'){ if(reg.method==='card') reg.finishCard(); else toast('Der Kunde zahlt bar. Klick die Kasse an.'); } }
  else if(k==='pos'){ if(reg&&reg.state==='pay'){ if(reg.method==='cash') openCash(reg); else reg.finishCard(); } }
  else if(k==='pack'){ if((S.pakete|0)<PAKET_BAYS) packOne(false); }
  else if(k==='laptop') openLaptop();
  else if(k==='station'){ if(S.carrying) placeOnStation(r); }
  else if(k==='pult') firePult();
  else if(k==='gravur'){ if(S.carrying&&S.carrying.type==='blanko') refillGrav(); else if(!S.carrying) openGravInput(); }
  else if(k==='tbox') takeBox(r);
  else if(k==='sign'){ if(phase==='closed') openShop(); else if(phase==='after') endDay(); }
}
function cleanTick(d,first){

  const holding=mouseDown||keys.KeyE||touchAct; if(!holding||!target) return;

  const ok=(k==='level'&&canStock(target.ref))||k==='belt'||k==='dirt'||k==='window'||(k==='gravur'&&S.carrying&&S.carrying.type==='blanko'&&gravBlanks<GRAV_MAX)||(k==='station'&&S.carrying&&stationOf(S.carrying.type)===target.ref.id&&target.ref.items.length<target.ref.cap);

  for(let i=0;i<n;i++){
    const jackpot=Math.random()<0.12;

function buyPack(id){

/* Vorschaukarte: so wuerde das Etikett im Regal aussehen */
function rezVorschau(r){
  const et=etikettVon(r.etikett), b=BRUCH[r.eff]||BRUCH.kugel;
  const W=260,H=150,c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,et.bg1); gr.addColorStop(1,et.bg2);
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  /* die beiden Rezeptfarben als Strahlen */
  const fa=farbVon(r.A).hex, fb=farbVon(r.B).hex;
  g.save(); g.translate(W/2,H*0.52); g.globalAlpha=0.5;
  for(let i=0;i<26;i++){ const a=i/26*Math.PI*2;
    g.strokeStyle=i%3?fa:fb; g.lineWidth=2.6;
    g.beginPath(); g.moveTo(Math.cos(a)*16,Math.sin(a)*13); g.lineTo(Math.cos(a)*56,Math.sin(a)*46); g.stroke(); }
  g.restore(); g.globalAlpha=1;
  g.fillStyle=et.ac; g.fillRect(0,0,W,7); g.fillRect(0,H-7,W,7);
  g.textAlign='center'; g.textBaseline='middle';
  const nm=(r.name||'Ohne Namen').toUpperCase().slice(0,18);
  g.font='700 26px "Bungee","Barlow Condensed",sans-serif';
  g.lineWidth=6; g.strokeStyle='rgba(0,0,0,.6)'; g.strokeText(nm,W/2,H*0.36);
  g.fillStyle=et.ac; g.fillText(nm,W/2,H*0.36);
  g.font='600 15px "Barlow Condensed",sans-serif'; g.fillStyle='#f2f5ff';
  g.fillText(b.name+(r.eff2?' + '+(BRUCH[r.eff2]||BRUCH.kugel).name:''),W/2,H*0.76);
  g.font='600 13px "Barlow Condensed",sans-serif'; g.fillStyle=et.ac2||'#ffffff';
  g.fillText(traegerVon(r.traeger).name,W/2,H*0.89);
  return c.toDataURL('image/png');
}

/* Prototyp: geht sofort auf dem Testfeld hoch, kostet nichts */
function rezProto(){
  const r=entwurf; if(!rezeptGueltig(r)) return;
  const tr=traegerVon(r.traeger);
  const o=tr.shape==='shell'?V(STATION_POS.moerser.x,1.7,STATION_POS.moerser.z)
        :tr.shape==='rocketset'?V(STATION_POS.rampe.x,1.3,STATION_POS.rampe.z)
        :V(STATION_POS.tisch.x,0.95,STATION_POS.tisch.z);
  const A=K(r.A)||FW.gold, B=K(r.B)||FW.weiss;
  const st=r.eff2?[{t:0.55,eff:r.eff2,sz:tr.kal*0.6,streu:5,A:B,B:A}]:null;
  if(tr.shape==='shell') kugelbombe(o,r.traeger==='kugel100'?2:1,{A,B,eff:r.eff});
  else if(tr.shape==='battery'){ for(let i=0;i<tr.schuss;i++) later(i*0.32,()=>shot(o,{sz:tr.kal,eff:r.eff,A,B,stufen:i===tr.schuss-1?st:null})); }
  else if(tr.shape==='cylinder'){ emitters.push({t:2.4,k:'fountain',o,A:FW.gold,B:A});
    later(2.4,()=>shot(o,{pw:3,sz:tr.kal*1.2,eff:r.eff,A,B,fuse:1.3,dick:1,stufen:st})); }
  else for(let i=0;i<tr.schuss;i++) later(i*0.45,()=>shot(o,{pw:tr.kal>1.1?3:0,sz:tr.kal,eff:r.eff,A,B,stufen:i===tr.schuss-1?st:null}));
  toast('Prototyp steigt auf dem Testfeld.','xp');
  closeLaptop(true);
}

function tipText(){
  if(build) return compact?'Objekt anvisieren, greifen, absetzen.':'Umbaumodus: Objekt anvisieren, greifen, drehen, absetzen.';
  if(phase==='after') return compact?'Feierabend: Tag am Türschild beenden.':'Feierabend. Räum in Ruhe auf und beende den Tag am Türschild.';
  for(const [k,txt,short] of TUT){
    if(S.tut[k]) continue;
    if((k==='scan'||k==='pay')&&phase==='closed') continue;
    if(k==='pay'&&!regCustomer()) continue;
    if(k==='clean'&&!dirts.length) continue;
    if(k==='move'&&S.level<3) continue;
    if(k==='lager'&&S.level<3) continue;
    if(k==='pick'&&!floorBoxes.length) continue;
    if(k==='fenster'&&windowGrime()<0.35) continue;
    if((k==='launch'||k==='build')&&S.level<4) continue;
    if(k==='phone'&&!S.up.grosskunden) continue;
    if(k==='versand'&&!S.up.grosskunden) continue;
    return compact&&short?short:txt;
  }
  if(phase==='closed') return compact?'Bereit? Türschild umdrehen.':'Wenn du bereit bist: Schild an der Tür umdrehen.';
  return '';
}

const _c1=new THREE.Color(), _c2=new THREE.Color(), _c3=new THREE.Color();
let lastF=-1;
function mix3(arr,f,out){ if(f<0.5) return out.copy(arr[0]).lerp(arr[1],f*2); return out.copy(arr[1]).lerp(arr[2],(f-0.5)*2); }
function applyTOD(){
  const f=clamp((clock-960)/100,0,1);
  if(Math.abs(f-lastF)<0.002) return; lastF=f;
  mix3(SKY.top,f,_c1); mix3(SKY.hor,f,_c2);
  const pos=skyGeo.attributes.position, colA=skyGeo.attributes.color;
  for(let i=0;i<pos.count;i++){ const y=pos.getY(i)/760, k=y<0?0:Math.pow(y,0.55); _c3.copy(_c2).lerp(_c1,k); if(y<0) _c3.multiplyScalar(0.6); colA.setXYZ(i,_c3.r,_c3.g,_c3.b); }

function updateSnow(dt){
  const a=snowPts.geometry.attributes.position, arr=a.array, t=performance.now()*0.001;
  for(let i=0;i<arr.length;i+=3){
    arr[i+1]-=dt*(0.55+((i*13)%7)*0.05); arr[i]+=Math.sin(t+i)*dt*0.12;
    const x=arr[i], z=arr[i+2], y=arr[i+1];

    const inside=y<3.9&&((x>-8.3&&x<8.3&&z>-6.3&&z<6.3)||(x>-20.3&&x<-7.7&&z>-6.3&&z<2.3)||(x>-20.3&&x<-7.7&&z>1.9&&z<6.2));

   ========================================================= */
/* Das Logo bringt einen schwarzen Hintergrund mit. Den schneiden wir
   beim Laden weg, damit es frei auf der Maske steht. */
function logoFreistellen(src,cb){
  const img=new Image();
  img.onload=()=>{
    try{
      const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
      const g=c.getContext('2d'); g.drawImage(img,0,0);
      const d=g.getImageData(0,0,c.width,c.height), a=d.data;
      for(let i=0;i<a.length;i+=4){
        const m=Math.max(a[i],a[i+1],a[i+2]);
        if(m<58){ a[i+3]=0; }                       /* fast schwarz: weg */
        else if(m<108){ a[i+3]=Math.round(a[i+3]*(m-58)/50); }  /* Saum weich */
      }
      g.putImageData(d,0,0);
      cb(c.toDataURL('image/png'));
    }catch(e){ cb(src); }
  };
  img.onerror=()=>cb(src);
  img.src=src;
}
/* Feuerwerk hinter dem Logo, reine 2D-Animation */
let fxRaf=0;
function startFx(){
  const c=$('startFx'); if(!c||!c.getContext) return;
  const g=c.getContext('2d'); if(!g) return;
  let parts=[], t0=performance.now(), next=0;
  const FARBEN=[[255,210,63],[230,59,46],[143,214,255],[108,242,168],[214,138,255],[255,146,76]];
  const size=()=>{ const r=c.getBoundingClientRect();
    c.width=Math.max(320,Math.round(r.width*Math.min(2,devicePixelRatio||1)));
    c.height=Math.max(240,Math.round(r.height*Math.min(2,devicePixelRatio||1))); };
  size(); addEventListener('resize',size);
  const knall=()=>{
    const W=c.width, H=c.height;
    const x=rand(W*0.08,W*0.92), y=rand(H*0.08,H*0.62);
    const col=pick(FARBEN), n=COARSE?46:90, sp=rand(1.6,3.4)*(c.width/1200);
    const ring=Math.random()<0.4;
    for(let i=0;i<n;i++){
      const a=ring?(i/n)*Math.PI*2:Math.random()*Math.PI*2;
      const v=ring?sp:sp*Math.sqrt(Math.random());
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(0.9,1.7),t:0,c:col,s:rand(1.4,3)});
    }
  };
  const step2=(now)=>{
    const dt=Math.min(0.05,(now-t0)/1000); t0=now;
    g.globalCompositeOperation='source-over';
    g.fillStyle='rgba(5,7,15,.24)'; g.fillRect(0,0,c.width,c.height);
    g.globalCompositeOperation='lighter';
    next-=dt; if(next<=0){ next=rand(0.35,1.1); knall(); }
    for(let i=parts.length-1;i>=0;i--){
      const p2=parts[i]; p2.t+=dt;
      if(p2.t>=p2.l){ parts.splice(i,1); continue; }
      p2.x+=p2.vx; p2.y+=p2.vy;
      p2.vy+=0.022*(c.height/900); p2.vx*=0.985; p2.vy*=0.985;
      const f=1-p2.t/p2.l, al=f*f*0.95;
      g.fillStyle=`rgba(${p2.c[0]},${p2.c[1]},${p2.c[2]},${al})`;
      g.fillRect(p2.x-p2.s/2,p2.y-p2.s/2,p2.s,p2.s);
    }
    if(parts.length>4000) parts.splice(0,parts.length-4000);
    fxRaf=requestAnimationFrame(step2);
  };
  fxRaf=requestAnimationFrame(step2);
}
function stopFx(){ if(fxRaf) cancelAnimationFrame(fxRaf); fxRaf=0; }
