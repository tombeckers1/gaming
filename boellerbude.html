/* =========================================================
   Ausbau: Die Welt steht von Anfang an in voller Groesse.
   Noch nicht gekaufte Bereiche liegen hinter einer Bauwand und
   sind unsichtbar. Beim Kauf faellt die Wand und der Bereich
   wird freigegeben.
   ========================================================= */
const ZONEN={};
function zone(id){ return ZONEN[id]||(ZONEN[id]={obj:[],cols:[],wand:[],wandCols:[],offen:false}); }
/* Objekt gehoert zum noch gesperrten Bereich */
function zAdd(id,o){ if(o){ o.visible=false; zone(id).obj.push(o); } return o; }
/* Kollision, die erst nach dem Kauf gilt */
function zCol(id,c){ if(c){ dropCol(c); zone(id).cols.push(c); } return c; }
/* Teil der Bauwand: sichtbar, bis gekauft wird */
function zWand(id,o){ if(o) zone(id).wand.push(o); return o; }
function zWandCol(id,c){ if(c) zone(id).wandCols.push(c); return c; }

function zoneOffen(id){ return !!(S&&S.up&&S.up[id]); }
/* Bereich freigeben: Bauwand weg, Inhalt sichtbar, Kollisionen tauschen */
function oeffneZone(id,leise){
  const z=ZONEN[id]; if(!z||z.offen) return;
  z.offen=true;
  z.wand.forEach(o=>{ o.visible=false; });
  z.wandCols.forEach(c=>dropCol(c));
  z.obj.forEach(o=>{ o.visible=true; });
  z.cols.forEach(c=>{ if(colliders.indexOf(c)<0) colliders.push(c); });
  if(typeof navDirty==='function') navDirty();
  if(!leise) sfx.cash();
}
/* Nach dem Laden eines Spielstands alle gekauften Bereiche oeffnen */
function applyZonen(){
  for(const id in ZONEN){
    const z=ZONEN[id];
    if(zoneOffen(id)) oeffneZone(id,true);
    else { z.offen=false;
      z.wand.forEach(o=>{ o.visible=true; });
      z.obj.forEach(o=>{ o.visible=false; });
      z.cols.forEach(c=>dropCol(c));
      z.wandCols.forEach(c=>{ if(colliders.indexOf(c)<0) colliders.push(c); }); }
  }
  if(typeof navDirty==='function') navDirty();
}

/* --------------------------------------------------------
   Noch nicht gekaufte Bereiche liegen hinter einer ganz normalen
   Wand: gleiches Material, gleiche Fugen, gleiche Sockelleiste wie
   im uebrigen Raum. Wer den Laden betritt, sieht schlicht eine Wand.
   Beim Kauf faellt sie weg und der Laden ist einfach groesser.
   -------------------------------------------------------- */
let _sockelM=null;
function sockelM(){ if(!_sockelM) _sockelM=std(0x1a2038); return _sockelM; }
/* Eine Wand, die nicht den Blick auf Regale verstellen soll:
   sie liegt nicht in der Liste, die der Zielstrahl abfragt. */
function stilleWand(x0,x1,z0,z1,y0,y1,inFace,inMat,exMat){
  const m=wall(x0,x1,z0,z1,y0,y1,inFace,inMat,exMat);
  const i=occluders.indexOf(m); if(i>=0) occluders.splice(i,1);
  return m;
}
/* Scheuerleiste auf beiden Seiten einer Wandflucht */
function sockelLeiste(id,laengs,fest,a0,a1){
  for(const s of [-1,1]){
    const o=laengs
      ? bbox(a1-a0,0.1,0.02,sockelM(),(a0+a1)/2,0.05,fest+s*(LW/2+0.011),null,false)
      : bbox(0.02,0.1,a1-a0,sockelM(),fest+s*(LW/2+0.011),0.05,(a0+a1)/2,null,false);
    if(id) zWand(id,o);
  }
}
/* Fuellung einer vorbereiteten Oeffnung. laengs = die Wand laeuft in x. */
function trennwand(id,laengs,fest,a0,a1,h,innen,aussen){
  const m=laengs
    ? stilleWand(a0,a1,fest-LW/2,fest+LW/2,0,h,'-z',innen,aussen||innen)
    : stilleWand(fest-LW/2,fest+LW/2,a0,a1,0,h,'-x',innen,aussen||innen);
  zWand(id,m);
  if(innen===shopWall) sockelLeiste(id,laengs,fest,a0,a1);
  zWandCol(id,laengs?col(a0,a1,fest-LW/2,fest+LW/2):col(fest-LW/2,fest+LW/2,a0,a1));
  return m;
}

/* =========================================================
   Die drei Ausbaustufen
   ========================================================= */
/* =========================================================
   Die Ausbaustufen. Jede ist eine Halle: Boden, Decke, Dach,
   Aussenwaende, Sockelleisten, Beleuchtung und Bodenschatten.
   Alles liegt hinter einer Bauwand, bis es gekauft wird.
   ========================================================= */
const SHOP_X2=LAY.shop.x1, LAGER_Z2=LAY.lnord.z1;

let _panelM=null, _korpusM=null;
function leuchtenMat(){
  if(!_panelM){ _panelM=new THREE.MeshBasicMaterial({map:deckenDiffuse(),toneMapped:false});
    _korpusM=new THREE.MeshStandardMaterial({vertexColors:true,metalness:0,roughness:0.72}); }
  return _panelM;
}
/* Deckenleuchten im Raster. Eine grosse Halle bekommt schnell dreissig
   Leuchten - als Einzelmeshes waere das teuer, deshalb wird das ganze
   Raster zu zwei Meshes verschmolzen: Korpus und Leuchtflaeche. */
function leuchtenRaster(id,r,y,ax,az){
  leuchtenMat();
  const nx=Math.max(1,Math.round((r.x1-r.x0)/ax)), nz=Math.max(1,Math.round((r.z1-r.z0)/az));
  const gRev=new THREE.BoxGeometry(1.44,0.03,0.42), gFix=new THREE.BoxGeometry(1.36,0.028,0.36);
  const gDif=new THREE.PlaneGeometry(1.26,0.28);
  const korpus=[], diff=[];
  for(let i=0;i<nx;i++) for(let k=0;k<nz;k++){
    const x=r.x0+(i+0.5)*(r.x1-r.x0)/nx, z=r.z0+(k+0.5)*(r.z1-r.z0)/nz;
    korpus.push({geo:gRev,m:tm(x,y-0.008,z),color:0x252932});
    korpus.push({geo:gFix,m:tm(x,y-0.026,z),color:0xdfe3e9});
    diff.push({geo:gDif,m:tm(x,y-0.043,z,Math.PI/2,0,0)});
  }
  const mk=new THREE.Mesh(merge(korpus),_korpusM); scene.add(mk); zAdd(id,mk);
  const md=new THREE.Mesh(merge(diff),_panelM); scene.add(md); zAdd(id,md);
  gRev.dispose(); gFix.dispose(); gDif.dispose();
}
/* Eine ganze Halle in einem Rutsch.
   aussen sagt, welche Seiten eine echte Aussenwand bekommen;
   die uebrigen grenzen an einen Nachbarbereich. */
function halle(id,r,opt){
  opt=opt||{};
  const H=opt.h||WH;
  const lager=opt.art==='lager';
  const innen=lager?lagerWall:shopWall;
  const ceil=std(0xe6e8ee,{roughness:1});
  const au=opt.aussen||{};
  const ex=opt.ex||undefined;
  /* Boden */
  let bodenMat;
  if(lager){ const lc=concreteTex(); lc.repeat.set((r.x1-r.x0)/2,(r.z1-r.z0)/2); bodenMat=new THREE.MeshStandardMaterial({map:lc,roughness:0.85}); }
  else bodenMat=floorMat;
  const bo=new THREE.Mesh(new THREE.PlaneGeometry(r.x1-r.x0,r.z1-r.z0),bodenMat);
  bo.rotation.x=-Math.PI/2; bo.position.set((r.x0+r.x1)/2,0.015,(r.z0+r.z1)/2); scene.add(bo); zAdd(id,bo);
  /* Decke und Dach */
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(r.x1-r.x0+0.3,r.z1-r.z0+0.3),ceil);
  ce.rotation.x=Math.PI/2; ce.position.set((r.x0+r.x1)/2,H-0.01,(r.z0+r.z1)/2); scene.add(ce); zAdd(id,ce);
  if(!opt.keinDach) bbox(r.x1-r.x0+LW*3,0.25,r.z1-r.z0+LW*3,std(0x2b2f3a),(r.x0+r.x1)/2,H+0.13,(r.z0+r.z1)/2,null,true);
  /* Aussenwaende: stehen immer, auch solange der Bereich gesperrt ist.
     Von der Strasse aus sieht man sonst ein Loch im Gebaeude. */
  if(au.w) wall(r.x0-LW,r.x0,r.z0,r.z1,0,H,'+x',innen,ex);
  if(au.e) wall(r.x1,r.x1+LW,r.z0,r.z1,0,H,'-x',innen,ex);
  if(au.n) wall(r.x0-LW,r.x1+LW,r.z1,r.z1+LW,0,H,'-z',innen,ex);
  if(au.s) wall(r.x0-LW,r.x1+LW,r.z0-LW,r.z0,0,H,'+z',innen,ex);
  if(au.w) col(r.x0-LW,r.x0,r.z0,r.z1);
  if(au.e) col(r.x1,r.x1+LW,r.z0,r.z1);
  if(au.n) col(r.x0-LW,r.x1+LW,r.z1,r.z1+LW);
  if(au.s) col(r.x0-LW,r.x1+LW,r.z0-LW,r.z0);
  /* Sockelleisten nur im Laden */
  if(!lager){
    const base=std(0x1a2038);
    if(au.n) zAdd(id,bbox(r.x1-r.x0,0.1,0.02,base,(r.x0+r.x1)/2,0.05,r.z1-0.01,null,false));
    if(au.s) zAdd(id,bbox(r.x1-r.x0,0.1,0.02,base,(r.x0+r.x1)/2,0.05,r.z0+0.01,null,false));
    if(au.w) zAdd(id,bbox(0.02,0.1,r.z1-r.z0,base,r.x0+0.01,0.05,(r.z0+r.z1)/2,null,false));
    if(au.e) zAdd(id,bbox(0.02,0.1,r.z1-r.z0,base,r.x1-0.01,0.05,(r.z0+r.z1)/2,null,false));
  }
  leuchtenRaster(id,r,H,lager?3.6:3.4,lager?4.2:3.6);
  roomAO(r.x0+0.02,r.x1-0.02,r.z0+0.02,r.z1-0.02,id);
}

/* Eine Wand mit vorbereiteten Durchbruechen. Pfeiler und Sturz
   bleiben stehen, die Fuellungen fallen beim Kauf des Bereichs.
   Solange sie stehen, sieht man ihnen nichts an - es ist dieselbe
   Wand wie daneben, nur eben durchgehend.
   laengs = die Wand laeuft in x-Richtung. */
function durchbruchWand(id,laengs,fest,von,bis,oeffnungen,mat,exMat,sturzY,hoehe){
  const H=hoehe||WH, sy=sturzY||2.7;
  const w=(a2,b2,y0,y1)=>laengs
    ? wall(a2,b2,fest-LW/2,fest+LW/2,y0,y1,'-z',mat,exMat)
    : wall(fest-LW/2,fest+LW/2,a2,b2,y0,y1,'-x',mat,exMat);
  const c=(a2,b2)=>laengs?col(a2,b2,fest-LW/2,fest+LW/2):col(fest-LW/2,fest+LW/2,a2,b2);
  const zc=(a2,b2)=>zWandCol(id,c(a2,b2));
  let x=von;
  for(const [oa,ob] of oeffnungen){
    if(oa>x){ w(x,oa,0,H); c(x,oa); if(mat===shopWall) sockelLeiste(null,laengs,fest,x,oa); }
    w(oa,ob,sy,H);                       /* Sturz ueber der Oeffnung */
    zc(oa,ob);                           /* sperrt, solange die Fuellung steht */
    trennwand(id,laengs,fest,oa,ob,sy,mat,exMat);
    x=ob;
  }
  if(bis>x){ w(x,bis,0,H); c(x,bis); if(mat===shopWall) sockelLeiste(null,laengs,fest,x,bis); }
}

function buildAusbau(){
  /* ---------- Verkaufsflaeche ----------
     Die Front uebernimmt die Nachbarfassade (05e), deshalb bekommen
     Ost I und Ost II von der Halle keine Nordwand. */
  halle('shop_gross',LAY.ost1,{aussen:{}});
  halle('shop_ost',  LAY.ost2,{aussen:{e:true}});
  halle('shop_sued', LAY.sued,{aussen:{s:true,e:true,w:true}});
  /* Innenwaende zwischen zwei Verkaufsraeumen: auf beiden Seiten
     Ladentapete, sonst schaut man von drinnen auf Backstein. */
  durchbruchWand('shop_ost',false,LAY.ost1.x1,LAY.ost1.z0,LAY.ost1.z1,[[-4.2,4.2]],shopWall,shopWall);
  durchbruchWand('shop_sued',true,LAY.sued.z1,LAY.sued.x0,LAY.sued.x1,[[10.0,17.0],[24.0,32.0]],shopWall,shopWall);
  /* Die beiden ersten Durchbrueche stehen schon in 05c beziehungsweise
     im Dock - hier kommt nur die Fuellung in die Oeffnung. */
  trennwand('shop_gross',false,8.0,-4.4,4.4,2.7,shopWall,shopWall);

  /* ---------- Lager ---------- */
  halle('lager_gross',LAY.lnord,{art:'lager',aussen:{n:true,w:true},h:ANBAU_H-0.06,keinDach:true});
  /* Sued und West sind echte Hallen mit 6,4 m lichter Hoehe -
     nur so haben Hochregale und Schwerlastregale ueberhaupt Platz. */
  halle('lager_sued', LAY.lsued,{art:'lager',aussen:{e:true,s:true},h:HALLE_H});
  halle('lager_west', LAY.lwest,{art:'lager',aussen:{s:true,n:true},h:HALLE_H,ex:blechMat()});
  /* Basislager nach Sueden */
  durchbruchWand('lager_sued',true,LAY.lbasis.z0,LAY.lbasis.x0,LAY.lbasis.x1,[[-17.5,-10.5]],lagerWall,lagerWall,null,HALLE_H);
  /* Sued nach West. Die Wand laeuft bis an die Suedwand des Basislagers
     durch - sonst bleibt zwischen Halle West und Hof ein Loch. */
  durchbruchWand('lager_west',false,LAY.lwest.x1,LAY.lwest.z0,LAY.lsued.z1,[[-26.0,-13.0]],lagerWall,lagerWall,3.4,HALLE_H);
  trennwand('lager_gross',true,2.0,-19.0,-9.0,2.6,lagerWall,lagerWall);

  /* ---------- Packstation, Rampen, Logistikzentrum ---------- */
  buildPackstation();
  buildWestrampen();
  buildLogistik();
}

  /* Packtisch mit Untergestell und Rollenbahn */

/* =========================================================

   Packtisch zu Paketen und warten auf der Rampe auf DDL.
   ========================================================= */
const PAKET_BAYS=6;
let versandT=0, paketTex=null;
/* Kartonoberflaeche mit Klebeband, Aufdruck und Adressaufkleber */
function paketMaterial(){
  if(paketTex) return paketTex;

function paketPose(i){ return {x:3.9+(i%3)*0.62,z:-0.3+Math.floor(i/3)*0.6}; }
function syncPakete(){
  if(!packTisch) return;
  const soll=Math.min(PAKET_BAYS,S?(S.pakete|0):0);
  while(pakete.length<soll){
    const i=pakete.length, p=paketPose(i), h=rand(0.3,0.42);
    const m=rbox(0.46,h,0.46,0.012,paketMaterial(),p.x,h/2+0.02,p.z,packTisch);
    m.rotation.y=rand(-0.16,0.16);
    pakete.push(m);
  }
  while(pakete.length>soll){ const m=pakete.pop(); if(m.parent) m.parent.remove(m); }
}
/* Ein Paket packen: eine offene Bestellung wird zur Ware auf der Rampe */
function paketWert(){ return r2(5+S.rep*0.06+S.level*0.25); }
function bestellungenProTag(){
  if(!packBereit()) return 0;
  return Math.max(4,Math.min(20,Math.round((40+S.rep*1.6+S.level*4)/Math.max(6,paketWert()))));
}
/* Sechs Stellplaetze auf der Rampe waren die Obergrenze fuer einen
   ganzen Tag - bei zwanzig Bestellungen taeglich staute sich der
   Versand endlos auf und kostete jeden Abend Ruf. Ist die Rampe voll,
   faehrt DDL eben zwischendurch vor. */
function packOne(auto){
  if(!packBereit()||(S.offen|0)<=0) return false;
  if((S.pakete|0)>=PAKET_BAYS){
    ddlAbholung();
    if(!auto) toast('Die Rampe war voll - DDL hat zwischendurch abgeholt.');
  }
  S.offen--; S.pakete=(S.pakete|0)+1;
  const w=paketWert();
  S.money=r2(S.money+w); DS.revenue=r2(DS.revenue+w); DS.versand=r2((DS.versand||0)+w);
  goalAdd('rev',w);
  syncPakete(); drawPackSchild();
  statAdd('pakete',1);
  if(!auto){ addXP(3); sfx.beep(); toast('Paket fertig: +'+eur(w),'money'); }
  return true;
}
function updateVersand(dt){
  if(!packBereit()){ versandT=0; return; }
  if(phase==='open'){
    const n=bestellungenProTag(); if(n>0){
      versandT-=dt;
      if(versandT<=0){ versandT=330/n; S.offen=(S.offen|0)+1; drawPackSchild(); }
    }
  }
  if(staff.packer&&(S.offen|0)>0){
    S.packT=(S.packT||0)-dt;
    if(S.packT<=0){ S.packT=3.4/(staff.packer.wf||1); packOne(true); }
  }
}
/* Tagesende: DDL holt ab, offene Bestellungen bleiben liegen */
function ddlAbholung(){
  const n=S.pakete|0; if(n<=0) return 0;
  statAdd('ddl',n);
  S.pakete=0; syncPakete(); drawPackSchild();
  return n;
}

/* Ein Ladetor in der Westwand, von aussen gesehen. Das Tor bleibt zu. */

  bbox(0.3,0.22,WTOR.w+0.36,steel,-0.24,WTOR.h+0.13,0,g,false);
  /* Anfahrpuffer aus Gummi */
  for(const s of [-1,1]){
    bbox(0.22,0.52,0.28,rub,-0.33,1.05,s*(WTOR.w/2+0.28),g,true);

/* Die Westwand der Halle: massive Abschnitte, drei Tore, Sturz darueber. */

  const x0=LAY.lwest.x0, z0=LAY.lwest.z0, z1=LAY.lwest.z1, H=HALLE_H, ex=blechMat();

    col(x0-LW,x0,a,b);                     /* die Tore bleiben zu */
    z=b;

  if(z1>z){ wall(x0-LW,x0,z,z1,0,H,'+x',lagerWall,ex); col(x0-LW,x0,z,z1); }

}

function logiGlas(len,rows){
  const cols=Math.max(4,Math.round(len/1.8));
  return tex(1024,256,(g,W,H)=>{
    g.fillStyle='#2b3348'; g.fillRect(0,0,W,H);
    const cw=W/cols, rh=H/rows;
    for(let c=0;c<cols;c++) for(let r=0;r<rows;r++){
      const x=c*cw+3, y=r*rh+4, w=cw-6, h=rh-8;
      const gg=g.createLinearGradient(x,y,x+w,y+h);
      if(Math.random()<0.42){ gg.addColorStop(0,'#f6e6bd'); gg.addColorStop(1,'#d8c294'); }
      else { gg.addColorStop(0,'#9fb4cc'); gg.addColorStop(0.55,'#6d8299'); gg.addColorStop(1,'#b6c8dc'); }
      g.fillStyle=gg; g.fillRect(x,y,w,h);

      g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(x,y+h-4,w,4);
    }
    g.fillStyle='#c9ced6';
    for(let c=0;c<=cols;c++) g.fillRect(c*cw-2,0,5,H);
    for(let r=0;r<=rows;r++) g.fillRect(0,r*rh-2,W,5);

  /* Abgestellte Auflieger laengs auf dem Vorplatz - quer wuerden sie

/* Normal-Map aus einer Höhenzeichnung (Sobel) */
function normalMapFrom(w,h,draw,strength){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  let src;
  try{ src=g.getImageData(0,0,w,h).data; }catch(e){ return null; }
  const out=g.createImageData(w,h), d=out.data, st=strength===undefined?2:strength;
  const at=(x,y)=>{ x=(x+w)%w; y=(y+h)%h; const i=(y*w+x)*4; return (src[i]+src[i+1]+src[i+2])/765; };
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dx=(at(x+1,y)-at(x-1,y))*st, dy=(at(x,y+1)-at(x,y-1))*st;
    const nx=-dx, ny=-dy, nz=1, l=Math.sqrt(nx*nx+ny*ny+1);
    const i=(y*w+x)*4;
    d[i]=(nx/l*0.5+0.5)*255; d[i+1]=(ny/l*0.5+0.5)*255; d[i+2]=(nz/l*0.5+0.5)*255; d[i+3]=255;
  }
  g.putImageData(out,0,0);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function noiseHeight(scale,lines){
  return (g,W,H)=>{
    g.fillStyle='#808080'; g.fillRect(0,0,W,H);
    for(let i=0;i<W*H*0.5;i++){ const v=128+(Math.random()-0.5)*scale;
      g.fillStyle=`rgb(${v|0},${v|0},${v|0})`; g.fillRect(Math.random()*W,Math.random()*H,2,2); }
    for(let i=0;i<24;i++){ g.strokeStyle=`rgba(${Math.random()<0.5?90:180},${Math.random()<0.5?90:180},${Math.random()<0.5?90:180},.5)`;
      g.lineWidth=rand(1,3); let x=Math.random()*W, y=Math.random()*H;
      g.beginPath(); g.moveTo(x,y);
      for(let k=0;k<5;k++){ x+=rand(-40,40); y+=rand(-40,40); g.lineTo(x,y); } g.stroke(); }
    if(lines){ for(let y=0;y<H;y+=H/lines){ g.fillStyle='#5a5a5a'; g.fillRect(0,y,W,2); g.fillStyle='#a0a0a0'; g.fillRect(0,y+2,W,1); } }
  };
}

/* =========================================================
   Stadt hinter dem Laden.
   Gebaut in Ringen, wie es Spiele mit grosser Sichtweite machen:
   was nah ist, hat Fenster, Balkone und Dachaufbauten; was fern
   ist, wird zur Silhouette und laeuft farblich in den Himmel.
   Jeder Ring ist zu wenigen Meshes verschmolzen, damit die
   Bildrate nicht einbricht.
   ========================================================= */

/* Der Spielbereich bleibt frei: hier steht schon etwas */
const STADT_FREI=[
  {x0:-88,x1:42,z0:-44,z1:38},       /* Laden, Lager, beide Hoefe, Testfeld  */
  {x0:42, x1:96,z0:-20,z1:18},       /* Logistikzentrum mit Vorplatz         */
  {x0:-260,x1:260,z0:8,z1:23}        /* die Fahrbahn bleibt frei             */
];
function stadtFrei(x,z,r){
  for(const f of STADT_FREI)
    if(x+r>f.x0&&x-r<f.x1&&z+r>f.z0&&z-r<f.z1) return false;
  return true;
}

/* --------------------------------------------------------
   Fassadentexturen fuer die Ferne: einmal am Tag, einmal die
   Fensterlichter fuer die Nacht. Die Fenster sitzen in einem
   Raster, ein Teil davon brennt.
   -------------------------------------------------------- */
function fernFassade(cols,rows,px,py,nacht,stil){
  return tex(px,py,(g,W,H)=>{
    const dunkel=stil==='glas';
    if(nacht){ g.fillStyle='#000000'; g.fillRect(0,0,W,H); }
    else {
      const gr=g.createLinearGradient(0,0,0,H);
      if(dunkel){ gr.addColorStop(0,'#5d6a7c'); gr.addColorStop(1,'#3e4a5a'); }
      else { gr.addColorStop(0,'#b6b0a4'); gr.addColorStop(1,'#8e887c'); }
      g.fillStyle=gr; g.fillRect(0,0,W,H);
      /* Betonstruktur und Verschmutzung */
      for(let i=0;i<220;i++){ g.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`;
        g.fillRect(Math.random()*W,Math.random()*H,rand(2,9),rand(2,9)); }
      for(let i=0;i<14;i++){ const x=Math.random()*W;
        const s=g.createLinearGradient(x,0,x,H); s.addColorStop(0,'rgba(40,40,46,.16)'); s.addColorStop(1,'rgba(40,40,46,0)');
        g.fillStyle=s; g.fillRect(x,rand(0,H*0.5),rand(4,16),H); }
    }
    const cw=W/cols, ch=H/rows;
    const fw=cw*(dunkel?0.82:0.56), fh=ch*(dunkel?0.7:0.6);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=c*cw+(cw-fw)/2, y=r*ch+(ch-fh)/2;
      /* Erdgeschoss ist breiter verglast */
      const eg=r===rows-1;
      const ww=eg?cw*0.86:fw, wx=eg?c*cw+(cw-cw*0.86)/2:x;
      const an=((r*7+c*13+((r*c)%5))%10)<(nacht?5:10);
      if(nacht){
        if(!an) continue;
        const warm=['#ffd79a','#ffc478','#f4e3c0','#ffb96b','#cfe0ff','#e8d7ff'][(r*3+c*5)%6];
        g.fillStyle=warm; g.globalAlpha=rand(0.55,1);
        g.fillRect(wx,y,ww,fh);
        /* etwas Streulicht um das Fenster */
        g.globalAlpha=0.16; g.fillRect(wx-ww*0.12,y-fh*0.12,ww*1.24,fh*1.24);
        g.globalAlpha=1;
      } else {
        g.fillStyle=dunkel?'#2b3442':'#3a4250';
        g.fillRect(wx,y,ww,fh);
        /* Glasreflex */
        g.fillStyle='rgba(180,205,230,.20)';
        g.fillRect(wx,y,ww,fh*0.32);
        /* Fensterbank */
        if(!dunkel){ g.fillStyle='rgba(235,232,222,.55)'; g.fillRect(wx-1,y+fh,ww+2,Math.max(1,ch*0.05)); }
      }
    }
    if(!nacht){
      /* Gesimse zwischen den Geschossen */
      g.fillStyle='rgba(0,0,0,.10)';
      for(let r=1;r<rows;r++) g.fillRect(0,r*ch-1,W,2);
      /* Dachkante */
      g.fillStyle='rgba(0,0,0,.22)'; g.fillRect(0,0,W,Math.max(2,H*0.012));
    }
  },false);
}
/* Ein Materialsatz je Rasterdichte, damit wenige Zeichenaufrufe reichen */
const STADT_MATS=[];
function fernMaterial(cols,rows,stil,fern){
  const key=cols+'x'+rows+stil+(fern?'f':'n');
  let m=STADT_MATS[key];
  if(m) return m;
  const q=COARSE?0.55:1;
  const px=Math.round(clamp(cols*22,128,512)*q), py=Math.round(clamp(rows*20,128,512)*q);
  m=new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:fern?1:0.9, metalness:stil==='glas'?0.18:0,
    map:fernFassade(cols,rows,px,py,false,stil),
    emissive:LIN(0xffffff),
    emissiveMap:fernFassade(cols,rows,px,py,true,stil),
    emissiveIntensity:0
  });
  houseMats.push(m);
  STADT_MATS[key]=m;
  return m;
}

/* --------------------------------------------------------
   Ein Ring voller Haeuser. Die Haeuser stehen auf einem Raster
   mit Luecken, damit Strassenzuege erkennbar bleiben.
   -------------------------------------------------------- */
function stadtRing(opt){
  const eimer={};     /* Rasterdichte -> Liste von Boxen */
  const deko=[];      /* Dachaufbauten, alles in einer Farbe */
  const kanten=[];    /* Attika und Gesims */
  const schritt=opt.raster, halb=schritt/2;
  const n=Math.ceil(opt.r1/schritt);
  for(let ix=-n;ix<=n;ix++) for(let iz=-n;iz<=n;iz++){
    const cx=ix*schritt+rand(-opt.jitter,opt.jitter);
    const cz=iz*schritt+rand(-opt.jitter,opt.jitter);
    const r=Math.hypot(cx,cz);
    if(r<opt.r0||r>opt.r1) continue;
    if(Math.random()>opt.dichte) continue;
    const w=rand(opt.breite[0],opt.breite[1]);
    const d=rand(opt.breite[0],opt.breite[1]);
    if(!stadtFrei(cx,cz,Math.max(w,d)/2+2)) continue;
    /* Hoehe nimmt zur Stadtmitte hin zu, das gibt der Skyline Form */
    const zentral=1-clamp((r-opt.r0)/(opt.r1-opt.r0),0,1);
    let h=rand(opt.hoehe[0],opt.hoehe[1])*(0.72+zentral*0.55);
    if(Math.random()<(opt.turmChance||0)) h*=rand(1.5,2.3);
    const stil=Math.random()<(opt.glas||0)?'glas':'putz';
    const cols=Math.max(2,Math.round(w/(stil==='glas'?2.6:3.4)));
    const rows=Math.max(3,Math.round(h/(stil==='glas'?3.4:3.0)));
    /* Rasterdichten auf wenige Stufen runden */
    const cg=[2,3,4,6,8,10][Math.min(5,Math.max(0,Math.round(Math.log2(cols))))]||4;
    const rg=[4,6,9,14,20,28][Math.min(5,Math.max(0,Math.round(Math.log2(rows/1.4))))]||9;
    const key=cg+'|'+rg+'|'+stil;
    (eimer[key]||(eimer[key]=[])).push({cx,cz,w,d,h,stil});
    /* atmosphaerische Perspektive: je ferner, desto heller und blauer */
    const t=clamp((r-40)/300,0,1);
    const basis=opt.farben[Math.floor(Math.random()*opt.farben.length)];
    const c=new THREE.Color(basis).lerp(new THREE.Color(0xb9cbdd),t*0.62);
    const hex=c.getHex();
    /* Attika */
    kanten.push({geo:new THREE.BoxGeometry(w+0.8,Math.min(1.2,h*0.04)+0.4,d+0.8),
                 m:tm(cx,h+0.2,cz),color:hex});
    if(opt.dach&&Math.random()<0.8){
      /* Dachaufbauten: Technikhaus, Wassertank, Lueftung, Antenne */
      const k=Math.random();
      if(k<0.4) deko.push({geo:new THREE.BoxGeometry(w*0.3,rand(1.4,3),d*0.3),m:tm(cx+rand(-w*0.2,w*0.2),h+rand(0.7,1.5),cz+rand(-d*0.2,d*0.2)),color:0x6e7684});
      else if(k<0.65) deko.push({geo:new THREE.CylinderGeometry(rand(0.8,1.6),rand(0.8,1.6),rand(1.6,3),10),m:tm(cx+rand(-w*0.2,w*0.2),h+rand(0.8,1.6),cz+rand(-d*0.2,d*0.2)),color:0x8a7a62});
      else if(k<0.85) for(let a=0;a<3;a++) deko.push({geo:new THREE.BoxGeometry(1.3,0.9,1.3),m:tm(cx+rand(-w*0.3,w*0.3),h+0.45,cz+rand(-d*0.3,d*0.3)),color:0x9aa2ac});
      else deko.push({geo:new THREE.CylinderGeometry(0.08,0.12,rand(4,8),5),m:tm(cx+rand(-w*0.3,w*0.3),h+rand(2,4),cz),color:0x4a505a});
    }
    /* die Box selbst bekommt ihre Farbe ueber die Vertexfarbe */
    eimer[key][eimer[key].length-1].hex=hex;
  }
  /* pro Rasterdichte ein Mesh */
  let boxen=0;
  for(const key in eimer){
    const [cg,rg,stil]=key.split('|');
    const parts=eimer[key].map(b=>{ boxen++;
      return {geo:new THREE.BoxGeometry(b.w,b.h,b.d),m:tm(b.cx,b.h/2,b.cz),color:b.hex}; });
    if(!parts.length) continue;
    const mesh=new THREE.Mesh(merge(parts),fernMaterial(+cg,+rg,stil,opt.r0>150));
    mesh.frustumCulled=true; stadtAdd(mesh);
  }
  if(kanten.length) stadtAdd(new THREE.Mesh(merge(kanten),new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));
  if(deko.length) stadtAdd(new THREE.Mesh(merge(deko),new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9})));
  return boxen;
}

/* --------------------------------------------------------
   Eine geschlossene Haeuserzeile entlang der Strasse, aber
   verschmolzen statt einzeln: dort schaut niemand auf Balkone,
   und jedes Einzelmesh kostet einen Zeichenaufruf.
   -------------------------------------------------------- */
function stadtZeile(x0,x1,z,tiefe,hoehe,farben,frontZ){
  const eimer={}, kanten=[], deko=[];
  let x=x0;
  while(x<x1-5){
    const w=rand(7,13), h=rand(hoehe[0],hoehe[1]), d=tiefe*rand(0.85,1.15);
    const cx=x+w/2, cz=z+(frontZ>0?d/2:-d/2);
    if(stadtFrei(cx,cz,Math.max(w,d)/2)){
      const stil=Math.random()<0.18?'glas':'putz';
      const cols=Math.max(2,Math.round(w/3.2)), rows=Math.max(3,Math.round(h/3.0));
      const cg=[2,3,4,6,8,10][Math.min(5,Math.max(0,Math.round(Math.log2(cols))))]||4;
      const rg=[4,6,9,14,20,28][Math.min(5,Math.max(0,Math.round(Math.log2(rows/1.4))))]||9;
      const t=clamp((Math.hypot(cx,cz)-40)/300,0,1);
      const c=new THREE.Color(farben[Math.floor(Math.random()*farben.length)]).lerp(new THREE.Color(0xb9cbdd),t*0.5);
      const hex=c.getHex();
      const key=cg+'|'+rg+'|'+stil;
      (eimer[key]||(eimer[key]=[])).push({geo:new THREE.BoxGeometry(w,h,d),m:tm(cx,h/2,cz),color:hex});
      kanten.push({geo:new THREE.BoxGeometry(w+0.6,0.7,d+0.6),m:tm(cx,h+0.2,cz),color:hex});
      /* Schornstein und Antenne, damit die Dachlinie nicht kahl ist */
      if(Math.random()<0.7) deko.push({geo:new THREE.BoxGeometry(0.6,rand(0.8,1.6),0.6),m:tm(cx+rand(-w*0.3,w*0.3),h+1,cz+rand(-d*0.2,d*0.2)),color:0x7a4a3c});
      if(Math.random()<0.35) deko.push({geo:new THREE.CylinderGeometry(0.05,0.07,rand(1.4,2.8),5),m:tm(cx+rand(-w*0.3,w*0.3),h+1.6,cz),color:0x3a3f48});
    }
    x+=w+rand(0.3,1.1);
  }
  for(const key in eimer){
    const [cg,rg,stil]=key.split('|');
    stadtAdd(new THREE.Mesh(merge(eimer[key]),fernMaterial(+cg,+rg,stil,false)));
  }
  if(kanten.length) stadtAdd(new THREE.Mesh(merge(kanten),new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));
  if(deko.length) stadtAdd(new THREE.Mesh(merge(deko),new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95})));
}

/* --------------------------------------------------------

function buildKran(x,z,h,ry){

    gitter.push({geo:new THREE.BoxGeometry(1.5,0.22,0.22),m:tm(0,i*3,-0.7),color:0xe0a520});
  }
  for(const sx of [-0.7,0.7]) for(const sz of [-0.7,0.7])
    gitter.push({geo:new THREE.BoxGeometry(0.24,h,0.24),m:tm(sx,h/2,sz),color:0xe0a520});
  /* Ausleger und Gegengewicht */
  gitter.push({geo:new THREE.BoxGeometry(34,0.9,1.1),m:tm(11,h+1.4,0),color:0xe0a520});

  gitter.push({geo:new THREE.BoxGeometry(2.2,2,2),m:tm(0,h+2.8,0),color:0xe0a520});

function buildKirche(x,z,ry){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);

        c.fillStyle='#2a2620'; c.fillRect(-2,-W*0.42,4,W*0.08); c.restore(); }
      c.strokeStyle='#2a2620'; c.lineWidth=5; c.beginPath(); c.moveTo(W/2,H/2); c.lineTo(W/2+W*0.2,H/2-W*0.18); c.stroke();
      c.lineWidth=3; c.beginPath(); c.moveTo(W/2,H/2); c.lineTo(W/2-W*0.08,H/2-W*0.3); c.stroke(); })});
  houseMats.push(zb);

/* --------------------------------------------------------
   Ganz aussen: gemalte Silhouetten auf Tafeln. Sie schliessen
   den Horizont, kosten aber fast nichts.
   -------------------------------------------------------- */
function silhouetteTex(seed,hoehe){
  return tex(1024,256,(g,W,H)=>{
    g.clearRect(0,0,W,H);
    let x=0, i=0;
    while(x<W){
      const bw=rand(26,86), bh=rand(H*0.22,H*hoehe);
      const dunkel=40+((seed*13+i*29)%26);
      g.fillStyle=`rgba(${dunkel},${dunkel+6},${dunkel+16},0.92)`;
      g.fillRect(x,H-bh,bw,bh);
      /* ein paar Fenster als Lichtpunkte */
      const cols=Math.max(1,Math.round(bw/12)), rows=Math.max(1,Math.round(bh/14));
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        if(((r*7+c*11+i*5)%9)>2) continue;
        g.fillStyle='rgba(255,214,150,.5)';
        g.fillRect(x+4+c*12,H-bh+5+r*14,4,5);
      }
      /* gelegentlich ein Dachaufbau */
      if(Math.random()<0.3){ g.fillRect(x+bw*0.3,H-bh-rand(6,16),bw*0.22,rand(6,16)); }
      x+=bw+rand(2,12); i++;
    }
    /* Dunst nach unten, damit die Tafel im Nebel verschwindet */
    const gr=g.createLinearGradient(0,H*0.45,0,H);
    gr.addColorStop(0,'rgba(190,208,224,0)'); gr.addColorStop(1,'rgba(190,208,224,.85)');
    g.fillStyle=gr; g.fillRect(0,H*0.45,W,H*0.55);
  },false);
}
const silhouetten=[];
function buildSilhouetten(){
  const RING=[{r:290,h:54,f:0.55,seed:3},{r:420,h:80,f:0.38,seed:7}];
  RING.forEach(({r,h,f,seed})=>{
    const n=COARSE?6:10;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2;
      const t=silhouetteTex(seed+i,f);
      const m=new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,fog:true,opacity:0.94});
      const b=r*2*Math.PI/n*1.06;
      const q=new THREE.Mesh(new THREE.PlaneGeometry(b,h),m);
      q.position.set(Math.cos(a)*r,h/2-2,Math.sin(a)*r);
      q.rotation.y=-a+Math.PI/2;
      q.renderOrder=-1;
      scene.add(q);
      silhouetten.push(m);
    }
  });
}

/* --------------------------------------------------------
   Grün in der Stadt: Baumreihen an den Strassen und ein paar
   Parks in den Luecken zwischen den Bloecken. Alles verschmolzen,
   ein Baum ist aus der Ferne nur Stamm und Krone.
   -------------------------------------------------------- */
function buildFernbaeume(){
  const staemme=[], kronen=[];
  const gruen=[0x3c5a32,0x44603a,0x35502c,0x4a6a3e,0x2f4a28,0x546f42];
  const setzen=(x,z,skal)=>{
    if(!stadtFrei(x,z,1.5)) return false;
    const h=rand(5,9)*skal, r=rand(1.9,3.2)*skal;
    staemme.push({geo:new THREE.CylinderGeometry(0.16*skal,0.26*skal,h*0.55,6),m:tm(x,h*0.28,z),color:0x4a3a2c});
    const c=gruen[Math.floor(Math.random()*gruen.length)];
    /* zwei versetzte Kugeln geben der Krone Form, ohne teuer zu sein */
    kronen.push({geo:new THREE.SphereGeometry(r,7,5),m:tm(x,h*0.62,z),color:c});
    kronen.push({geo:new THREE.SphereGeometry(r*0.72,6,5),m:tm(x+rand(-0.6,0.6)*skal,h*0.86,z+rand(-0.6,0.6)*skal),color:c});
    return true;
  };
  /* Alleen entlang der eigenen Strasse, weit links und rechts */
  for(const [von,bis] of [[-230,-56],[34,230]])
    for(let x=von;x<bis;x+=rand(9,15)){
      setzen(x,rand(6.5,7.5),rand(0.85,1.25));
      setzen(x+rand(2,6),rand(23.5,24.5),rand(0.85,1.25));
    }
  /* Parks: Baumgruppen in den Luecken des Quartiers */
  const parks=COARSE?4:8;
  for(let i=0;i<parks;i++){
    const a=Math.random()*Math.PI*2, r=rand(58,170);
    const px=Math.cos(a)*r, pz=Math.sin(a)*r;
    if(!stadtFrei(px,pz,16)) continue;
    const n=COARSE?7:14;
    for(let k=0;k<n;k++)
      setzen(px+rand(-13,13),pz+rand(-13,13),rand(0.9,1.5));
    /* Rasenflaeche darunter */
    const w=rand(22,34), d=rand(20,30);
    const gras=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
      new THREE.MeshStandardMaterial({color:LIN(0x4e6640),roughness:1}));
    gras.rotation.x=-Math.PI/2; gras.position.set(px,0.02,pz);
    stadtAdd(gras);
  }
  /* Ein Gruenzug ganz aussen, damit die Skyline nicht nackt endet */
  for(let i=0;i<(COARSE?24:54);i++){
    const a=Math.random()*Math.PI*2, r=rand(190,330);
    setzen(Math.cos(a)*r,Math.sin(a)*r,rand(1.2,2.2));
  }
  if(staemme.length) stadtAdd(new THREE.Mesh(merge(staemme),new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95})));
  if(kronen.length) stadtAdd(new THREE.Mesh(merge(kronen),new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.92,flatShading:true})));
  return kronen.length/2;
}

/* =========================================================
   Leben in der Ferne. Eine Stadt ohne Bewegung sieht aus wie
   eine Kulisse, deshalb: Vogelschwaerme, Verkehr auf der
   Ausfallstrasse, ein Flugzeug und Rauch aus Schornsteinen.
   ========================================================= */

/* --- Vogelschwaerme --- */
const schwaerme=[];
function vogelGeo(){
  /* ein flacher Keil, der von unten wie ein Vogel aussieht */
  const g=new THREE.BufferGeometry();
  const v=new Float32Array([ 0,0,-0.55,  -0.7,0.06,0.35,  0,0,0.1,
                             0,0,-0.55,   0,0,0.1,   0.7,0.06,0.35 ]);
  g.setAttribute('position',new THREE.BufferAttribute(v,3));
  g.computeVertexNormals();
  return g;
}
function buildVoegel(){
  const geo=vogelGeo();
  const mat=new THREE.MeshBasicMaterial({color:LIN(0x2b3038),side:THREE.DoubleSide,fog:true});
  const nS=COARSE?2:3;
  for(let s=0;s<nS;s++){
    const g=new THREE.Group(); scene.add(g);
    const n=COARSE?8:14, voegel=[];
    for(let i=0;i<n;i++){
      const m=new THREE.Mesh(geo,mat);
      const r=rand(4,16), a=Math.random()*Math.PI*2;
      m.position.set(Math.cos(a)*r,rand(-3,3),Math.sin(a)*r);
      m.scale.setScalar(rand(0.55,1.0));
      g.add(m);
      voegel.push({m,ph:Math.random()*6.28,sp:rand(7,11)});
    }
    schwaerme.push({g,voegel,
      mx:rand(-90,90), mz:rand(-90,90), my:rand(26,48),
      r:rand(38,70), a:Math.random()*Math.PI*2, sp:rand(0.035,0.075)*(Math.random()<0.5?-1:1)});
  }
}
/* --- Hochstrassen mit Verkehr ---
   Sie laufen quer zur eigenen Strasse und kreuzen sie weit draussen.
   Genau dort ist der Blick frei: schaut man die Strasse hinunter,
   sieht man in der Ferne eine Brueckenfahrbahn mit Verkehr darauf.
   Haetten sie hinter dem Quartier gestanden, waeren sie von den
   Daechern der Haeuserzeile komplett verdeckt. */
const VIA={y:15.5, len:340, x:[-212,218]};
function buildHochstrasse(){
  const teile=[], pfeiler=[], lampen=[];
  const lm=new THREE.MeshStandardMaterial({color:LIN(0x2a2a2e),emissive:LIN(0xffd9a0),emissiveIntensity:0,fog:true});
  lampMats.push(lm);
  VIA.x.forEach((vx,k)=>{
    const n=Math.round(VIA.len/20);
    for(let i=0;i<n;i++){
      const z=-VIA.len/2+i*20+10;
      const dy=Math.sin(i*0.35+k)*0.9;         /* leichte Kuppe in der Fahrbahn */
      teile.push({geo:new THREE.BoxGeometry(13,1.2,20.2),m:tm(vx,VIA.y+dy,z),color:0x8b9099});
      /* Leitplanken links und rechts */
      for(const sx of [-6.2,6.2])
        teile.push({geo:new THREE.BoxGeometry(0.4,0.8,20.2),m:tm(vx+sx,VIA.y+dy+0.95,z),color:0xb4bac4});
      /* Pfeilerpaare */
      if(i%2===0) for(const sx of [-3.4,3.4]){
        pfeiler.push({geo:new THREE.CylinderGeometry(1.2,1.7,VIA.y+dy,10),m:tm(vx+sx,(VIA.y+dy)/2,z),color:0x9aa1ab});
        pfeiler.push({geo:new THREE.BoxGeometry(3.6,0.8,3.6),m:tm(vx+sx,0.4,z),color:0x868d97});
      }
      /* Beleuchtungsmasten mit Ausleger */
      if(i%3===0){
        pfeiler.push({geo:new THREE.CylinderGeometry(0.15,0.22,10,6),m:tm(vx+6.4,VIA.y+dy+6.2,z),color:0x6f767f});
        pfeiler.push({geo:new THREE.BoxGeometry(2.4,0.24,0.5),m:tm(vx+5.2,VIA.y+dy+11.1,z),color:0x6f767f});
        lampen.push({geo:new THREE.BoxGeometry(1.6,0.32,0.8),m:tm(vx+4.4,VIA.y+dy+10.8,z)});
      }
    }
  });
  stadtAdd(new THREE.Mesh(merge(teile),new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.92})));
  stadtAdd(new THREE.Mesh(merge(pfeiler),new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95})));
  if(lampen.length){ const m=new THREE.Mesh(merge(lampen),lm); m.userData.stadt=true; scene.add(m); }
}
/* --- Verkehr: auf der Hochstrasse und die eigene Strasse hinunter --- */
let verkehrPts=null, verkehrDat=[];
function buildFernverkehr(){
  const n=COARSE?40:84;
  const pos=new Float32Array(n*3), col=new Float32Array(n*3);
  verkehrDat=[];
  for(let i=0;i<n;i++){
    /* Zwei Drittel fahren oben auf dem Viadukt, ein Drittel unten
       die eigene Strasse entlang - dort aber nur weit weg. */
    const oben=i%3!==2;
    const dir=i%2?1:-1;
    verkehrDat.push({oben,dir,t:Math.random(),sp:rand(0.020,0.042),
      bruecke:i%2, spur:dir>0?-2.6:2.6, jit:rand(-0.6,0.6)});
    /* Scheinwerfer weiss, Rueckleuchten rot - je nach Fahrtrichtung */
    const c=dir>0?[1,0.95,0.82]:[1,0.24,0.13];
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
    pos[i*3+1]=-999;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  verkehrPts=new THREE.Points(g,new THREE.PointsMaterial({
    size:2.1,map:dotTex,vertexColors:true,transparent:true,opacity:0,
    depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
  verkehrPts.frustumCulled=false; scene.add(verkehrPts);
}
/* --- Flugzeug, das gelegentlich vorbeizieht --- */

/* --- Rauch aus den Schornsteinen der Stadt --- */
let rauchPts=null, rauchDat=[];
function buildRauch(){
  const quellen=[];
  for(let i=0;i<(COARSE?3:6);i++){
    const a=Math.random()*Math.PI*2, r=rand(70,150);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!stadtFrei(x,z,10)) continue;
    quellen.push({x,y:rand(18,34),z});
  }
  if(!quellen.length) return;
  const proQuelle=COARSE?10:18, n=quellen.length*proQuelle;
  const pos=new Float32Array(n*3);
  rauchDat=[];
  for(let q=0;q<quellen.length;q++) for(let i=0;i<proQuelle;i++){
    rauchDat.push({q:quellen[q],t:i/proQuelle,sp:rand(0.055,0.1),dr:rand(0.6,1.8)});
  }
  const g=new THREE.BufferGeometry();

  rauchPts=new THREE.Points(g,new THREE.PointsMaterial({
    size:7,map:dotTex,color:0xc8ceda,transparent:true,opacity:0.16,
    depthWrite:false,fog:true}));
  rauchPts.frustumCulled=false; scene.add(rauchPts);
}

/* --------------------------------------------------------
   Alles zusammenbauen
   -------------------------------------------------------- */
let stadtBoxen=0, stadtBaeume=0;
function buildStadt(){
  const ZEILE=[0xb0a695,0x9aa3ad,0xa88f7c,0x8d9a8c,0xbfae8e,0x9c8792,0x84909e,0xaa8272];
  /* Die Strasse laeuft nach beiden Seiten weiter, gesaeumt von Haeusern.
     Vorne die Zeile gegenueber, dahinter zwei Reihen zur Tiefe. */
  stadtZeile(-150,-44,23,8.5,[10,18],ZEILE,1);
  stadtZeile(44,150,23,8.5,[10,18],ZEILE,1);
  stadtZeile(-160,160,36,9,[12,22],ZEILE,1);
  /* und unsere Strassenseite jenseits von Hof und Testfeld */
  stadtZeile(-150,-50,7,9,[9,17],ZEILE,-1);
  stadtZeile(28,150,7,9,[9,17],ZEILE,-1);
  stadtZeile(-170,-56,-14,10,[10,20],ZEILE,-1);
  stadtZeile(34,170,-14,10,[10,20],ZEILE,-1);
  /* Ring B: das Quartier gleich hinter der Haeuserzeile */
  stadtBoxen+=stadtRing({
    r0:40, r1:150, raster:COARSE?34:26, jitter:5, dichte:COARSE?0.5:0.72,
    breite:[9,20], hoehe:[11,26], dach:true, glas:0.12, turmChance:0.08,

  stadtBoxen+=stadtRing({
    r0:165, r1:330, raster:COARSE?58:44, jitter:9, dichte:COARSE?0.45:0.62,
    breite:[14,30], hoehe:[34,86], dach:false, glas:0.55, turmChance:0.22,
    farben:[0x9fb0c2,0x93a4b6,0xa7b4c0,0x8fa2b4,0xb0bcc8]
  });
  /* Wahrzeichen */
  buildFernsehturm(-118,206);
  buildKran(96,148,44,0.7);
  buildKran(-64,176,38,-1.2);
  buildKirche(74,86,-0.5);
  buildSilhouetten();
  /* Leben */
  buildHochstrasse();
  stadtBaeume=buildFernbaeume();
  buildVoegel(); buildFernverkehr(); buildFlieger(); buildRauch();
}
/* --------------------------------------------------------
   Bewegung
   -------------------------------------------------------- */
const _vTmp=new THREE.Vector3();
let stadtT=0;
function updateStadt(dt){
  stadtT+=dt;
  const t=stadtT;
  const nacht=clamp((clock-960)/100,0,1);
  /* Vogelschwaerme ziehen ihre Kreise und schlagen mit den Fluegeln */
  for(const s of schwaerme){
    s.a+=s.sp*dt;
    s.g.position.set(s.mx+Math.cos(s.a)*s.r, s.my+Math.sin(s.a*2.3)*4, s.mz+Math.sin(s.a)*s.r);
    s.g.rotation.y=-s.a+Math.PI/2;
    for(const v of s.voegel){
      const f=Math.sin(t*v.sp+v.ph);
      v.m.rotation.z=f*0.55;
      v.m.position.y+=f*dt*0.35;
      if(v.m.position.y>4) v.m.position.y=4; if(v.m.position.y<-4) v.m.position.y=-4;
    }
    /* nachts sind weniger Voegel unterwegs */
    s.g.visible=nacht<0.75;
  }
  /* Verkehr: nachts sieht man nur die Lichter, tags gar nichts */
  if(verkehrPts){
    verkehrPts.material.opacity=nacht*0.95;
    if(nacht>0.02){
      const a=verkehrPts.geometry.attributes.position, arr=a.array;
      for(let i=0;i<verkehrDat.length;i++){
        const d=verkehrDat[i];
        d.t+=d.sp*dt*d.dir;
        if(d.t>1) d.t-=1; if(d.t<0) d.t+=1;
        if(d.oben){
          const z=-VIA.len/2+d.t*VIA.len;
          const i20=(z+VIA.len/2-10)/20;
          const dy=Math.sin(i20*0.35+d.bruecke)*0.9;
          arr[i*3]=VIA.x[d.bruecke]+d.spur+d.jit; arr[i*3+1]=VIA.y+dy+1.3; arr[i*3+2]=z;
        } else {
          /* die eigene Strasse: nur in der Ferne, sonst waere der
             Lichtpunkt direkt vor der Nase zu sehen */
          const x=-230+d.t*460;
          if(Math.abs(x)<52){ arr[i*3+1]=-999; }
          else { arr[i*3]=x; arr[i*3+1]=0.8; arr[i*3+2]=15.3+d.spur*0.6+d.jit; }
        }
      }
      a.needsUpdate=true;
    }
  }
  /* Blinklichter auf Turm und Kraenen */
  for(const b of beacons)
    b.m.emissiveIntensity=(((t*b.sp+b.ph)%2)<0.35)?2.6:0.12;
  /* Flugzeug */
  if(flieger){
    fliegerT-=dt;
    if(fliegerT<=0&&!flieger.visible){
      flieger.visible=true;
      const seite=Math.random()<0.5?1:-1;
      flieger.userData={x:-260*seite,z:rand(-120,180),y:rand(72,110),vx:seite*rand(13,20)};
      flieger.rotation.y=seite>0?Math.PI/2:-Math.PI/2;
    }
    if(flieger.visible){
      const u=flieger.userData;
      u.x+=u.vx*dt;
      flieger.position.set(u.x,u.y,u.z);
      if(Math.abs(u.x)>270){ flieger.visible=false; fliegerT=rand(45,130); }
      fliegerLicht.visible=((t*1.4)%1)<0.2;
    }
  }
  /* Rauchfahnen */
  if(rauchPts){
    const a=rauchPts.geometry.attributes.position, arr=a.array;
    for(let i=0;i<rauchDat.length;i++){
      const d=rauchDat[i];
      d.t+=d.sp*dt*0.28;
      if(d.t>1) d.t-=1;
      const h=d.t*26;
      arr[i*3]=d.q.x+Math.sin(d.t*4+i)*d.dr*(0.4+d.t*2.4);
      arr[i*3+1]=d.q.y+h;

function createRack(i,data){

      }
    }

    K.sp.forEach((x,si)=>{
      const hit=bbox(sw,0.74,2*ZO,hitM,x,y+0.37,0,g,false);

/* --- Ladung als einzeln aufhebbare Pakete --- */

function fillCargo(){
  if(!truck) return;

    if(i>=32) return;
    const s=cargoSlot(i);

    m.position.set(s.x,s.y,s.z); m.rotation.y=rand(-0.07,0.07);

function spawnTruck(cargo,supId,supName){

/* Klappenstellung: 0 liegt flach als Bruecke, 1 steht senkrecht am Heck */
function setFlap(){
  if(truck&&truck.bruecke) truck.bruecke.rotation.z=truck.flap*FLAP_MAX;
}
function dockTruck(){
  truck.g.position.x=LR.rear;
  truck.state='docked';
  statAdd('lkw',1);          /* eine Lieferung ist angekommen */
  /* Der geschlossene Kasten des Aussenmodells steht sonst genau im Tor
     und verdeckt den begehbaren Laderaum. */
  truck.g.visible=false;
  truck.raum=makeLaderaum(truck.name||'Lieferung',truck.col);
  truck.flap=0; truck.bruecke=makeBruecke();
  fillCargo();
  /* Der Laderaum wird begehbar: Seitenwände und Stirnwand begrenzen */
  truck.cols=[
    col(lrFront()-0.3,LR.rear+0.2,LR.z-LR.w/2-0.2,LR.z-LR.w/2+0.02),
    col(lrFront()-0.3,LR.rear+0.2,LR.z+LR.w/2-0.02,LR.z+LR.w/2+0.2),
    col(lrFront()-0.25,lrFront()-0.02,LR.z-LR.w/2,LR.z+LR.w/2)
  ];
  S.tut.lkw=true;
  toast('Tor fährt hoch. Geh in den Laderaum und hol die Kartons.',COARSE?'':'xp');
  if(!truckDriver){
    truckDriver=makePerson({jacket:0xf2a01c,cap:0xf2a01c});
    truckDriver.position.set(lrFront()-2.2,0,LR.z+2.2);
    truckDriver.rotation.y=-1.1; scene.add(truckDriver);
  }
}
/* Steht noch jemand im Laderaum? */
function trailerOccupied(){
  const inside=(x,z)=>x<LR.rear-0.1&&x>lrFront()-0.4&&Math.abs(z-LR.z)<LR.w/2+0.3;
  if(inside(pl.x,pl.z)) return true;
  for(const k in staff){ const w=staff[k]; if(w&&inside(w.pos.x,w.pos.z)) return true; }
  return false;
}
function clearRaum(){
  if(!truck) return;
  truck.boxes.forEach(m=>scene.remove(m)); truck.boxes=[];
  if(truck.raum){ scene.remove(truck.raum); truck.raum=null; }
  if(truck.bruecke){ scene.remove(truck.bruecke); truck.bruecke=null; }
  if(truck.flapCol){ dropCol(truck.flapCol); truck.flapCol=null; }
  truck.cols.forEach(c=>dropCol(c)); truck.cols=[];
}
function leaveTruck(){
  if(!truck||truck.state!=='docked') return;
  /* Reihenfolge: Ladebordwand hoch, dann faehrt der LKW heraus, und
     erst wenn er ganz draussen ist, geht das Tor zu. */
  truck.state='flap'; truck.t=0;
  if(truckDriver){ scene.remove(truckDriver); truckDriver=null; }
}
function removeTruck(){
  if(!truck) return;
  clearRaum();
  scene.remove(truck.g); truck=null;
  if(truckDriver){ scene.remove(truckDriver); truckDriver=null; }
}
function truckLeft(){ return truck&&truck.state==='docked'?truck.cargo.length:0; }
/* Jeder vom LKW genommene Karton zaehlt als Lieferungsteil */
function takeBox(item){ statAdd('kartons',1);

  if(!truck||truck.state!=='docked') return;
  if(S.carrying){ toast('Du hast schon einen Karton auf dem Arm.'); return; }
  const i=truck.cargo.indexOf(item); if(i<0) return;
  truck.cargo.splice(i,1);
  S.carrying={type:item.type,count:P[item.type].box,q:item.q||1};
  S.tut.pick=true; sfx.pop(); fillCargo(); updateCarry();
  if(!truck.cargo.length) toast('Laderaum leer. Geh raus, dann fährt er los.');
}
function takeFromTruck(){ if(truck&&truck.cargo.length) takeBox(truck.cargo[0]); }
function pullFromTruck(){
  if(!truck||truck.state!=='docked'||!truck.cargo.length) return null;
  const c=truck.cargo.shift(); fillCargo();
  return {type:c.type,count:P[c.type].box,q:c.q||1};
}
function dumpTruck(){
  if(!truck) return;
  const n=truck.cargo.length;
  truck.cargo.forEach(c=>spawnFloorBox(c.type,P[c.type].box,null,c.q||1));
  truck.cargo.length=0;
  if(n) toast(`Der Fahrer hat ${n} Karton${n>1?'s':''} im Lager abgestellt.`);
  if(truck.state==='docked') leaveTruck(); else removeTruck();
}
function updateTruck(dt){
  updateDoor(dt);
  if(!truck) return;
  const g=truck.g;
  if(truck.state==='torauf'){
    /* Der LKW wartet vor dem Hof, bis das Tor ganz oben ist. */
    if(doorIsOpen()) truck.state='reverse';
  } else if(truck.state==='reverse'){
    const d=LR.rear-g.position.x, sp=clamp(d*0.9,0.5,2.6);
    g.position.x+=sp*dt;
    if(d<=0.03) dockTruck();
  } else if(truck.state==='opening'){
    if(doorIsOpen()) truck.state='docked';
  } else if(truck.state==='docked'){
    if(!truck.cargo.length&&!trailerOccupied()){ truck.t+=dt; if(truck.t>1.2) leaveTruck(); }
    else truck.t=0;
  } else if(truck.state==='flap'){
    /* Steht doch wieder jemand im Laderaum, klappt sie zurueck herunter. */
    if(trailerOccupied()){
      truck.flap=Math.max(0,truck.flap-dt/FLAP_T); setFlap();
      if(truck.flapCol&&truck.flap<0.6){ dropCol(truck.flapCol); truck.flapCol=null; }
      if(truck.flap<=0) truck.state='docked';

const A=V(2.9,0,0.3), B=V(2.9,0,-4.4);

/* =========================================================
   Wegenetz. Solange der Laden aus zwei Raeumen bestand, reichten
   zwei feste Wegpunkte. Auf ueber tausend Quadratmetern mit
   Gondelgassen und Eckregalen geht das nicht mehr: es gibt ein
   Raster ueber die ganze Verkaufsflaeche, darin wird gesucht.
   Das Raster wird nur neu gebaut, wenn sich etwas veraendert
   hat - nach einem Umbau oder wenn ein Bereich aufgeht.
   ========================================================= */
const NAV={x0:-42.6,z0:-30.6,x1:38.6,z1:8.6,s:0.5,w:0,h:0,g:null,dist:null,dirty:true};
function navDirty(){ NAV.dirty=true; }
function navBuild(){
  NAV.w=Math.ceil((NAV.x1-NAV.x0)/NAV.s); NAV.h=Math.ceil((NAV.z1-NAV.z0)/NAV.s);
  const n=NAV.w*NAV.h;
  if(!NAV.g||NAV.g.length!==n){ NAV.g=new Uint8Array(n); NAV.dist=new Int32Array(n); }
  NAV.g.fill(0);
  const R=0.3;                                    /* halbe Schulterbreite */
  for(const c of colliders){
    if(c.maxX<NAV.x0||c.minX>NAV.x1||c.maxZ<NAV.z0||c.minZ>NAV.z1) continue;
    const i0=Math.max(0,Math.floor((c.minX-R-NAV.x0)/NAV.s)), i1=Math.min(NAV.w-1,Math.floor((c.maxX+R-NAV.x0)/NAV.s));
    const k0=Math.max(0,Math.floor((c.minZ-R-NAV.z0)/NAV.s)), k1=Math.min(NAV.h-1,Math.floor((c.maxZ+R-NAV.z0)/NAV.s));
    for(let i=i0;i<=i1;i++) for(let k=k0;k<=k1;k++) NAV.g[k*NAV.w+i]=1;
  }
  NAV.dirty=false;
}
function navIdx(x,z){
  const i=Math.floor((x-NAV.x0)/NAV.s), k=Math.floor((z-NAV.z0)/NAV.s);
  if(i<0||k<0||i>=NAV.w||k>=NAV.h) return -1;
  return k*NAV.w+i;
}
function navPos(id){ return V(NAV.x0+(id%NAV.w+0.5)*NAV.s,0,NAV.z0+(Math.floor(id/NAV.w)+0.5)*NAV.s); }
function navFrei(id){ return id>=0&&!NAV.g[id]; }
/* Naechste begehbare Zelle, falls ein Ziel direkt an einem Regal liegt */
function navNah(x,z){
  const id=navIdx(x,z); if(navFrei(id)) return id;
  for(let r=1;r<=6;r++){
    let best=-1,bd=1e9;
    for(let dx=-r;dx<=r;dx++) for(let dz=-r;dz<=r;dz++){
      if(Math.max(Math.abs(dx),Math.abs(dz))!==r) continue;
      const c=navIdx(x+dx*NAV.s,z+dz*NAV.s);
      if(navFrei(c)){ const d=dx*dx+dz*dz; if(d<bd){ bd=d; best=c; } }
    }
    if(best>=0) return best;
  }
  return -1;
}
/* Sichtlinie zwischen zwei Punkten, in Rasterschritten geprueft */
function navSicht(ax,az,bx,bz){
  const d=Math.hypot(bx-ax,bz-az), n=Math.ceil(d/(NAV.s*0.6));
  for(let i=1;i<n;i++){ const t=i/n;
    if(!navFrei(navIdx(ax+(bx-ax)*t,az+(bz-az)*t))) return false; }
  return true;
}
const _navQ=[];
/* Breitensuche vom Ziel aus, danach die Kette glaetten */
function navPfad(from,to){
  const start=navNah(from.x,from.z), ziel=navNah(to.x,to.z);
  if(start<0||ziel<0) return null;
  if(start===ziel||navSicht(from.x,from.z,to.x,to.z)) return [to.clone?to.clone():V(to.x,0,to.z)];
  const D=NAV.dist; D.fill(-1); D[ziel]=0;
  let head=0; _navQ.length=0; _navQ.push(ziel);
  const W=NAV.w, H=NAV.h;
  while(head<_navQ.length){
    const c=_navQ[head++]; if(c===start) break;
    const i=c%W, k=(c-i)/W, d=D[c]+1;
    if(i>0)   { const n2=c-1; if(!NAV.g[n2]&&D[n2]<0){ D[n2]=d; _navQ.push(n2); } }
    if(i<W-1) { const n2=c+1; if(!NAV.g[n2]&&D[n2]<0){ D[n2]=d; _navQ.push(n2); } }
    if(k>0)   { const n2=c-W; if(!NAV.g[n2]&&D[n2]<0){ D[n2]=d; _navQ.push(n2); } }
    if(k<H-1) { const n2=c+W; if(!NAV.g[n2]&&D[n2]<0){ D[n2]=d; _navQ.push(n2); } }
  }
  if(D[start]<0) return null;
  /* absteigend zum Ziel laufen */
  const roh=[]; let c=start;
  while(c!==ziel&&roh.length<4000){
    const i=c%W, k=(c-i)/W; let best=-1,bd=D[c];
    const nb=[i>0?c-1:-1,i<W-1?c+1:-1,k>0?c-W:-1,k<H-1?c+W:-1];
    for(const n2 of nb) if(n2>=0&&D[n2]>=0&&D[n2]<bd){ bd=D[n2]; best=n2; }
    if(best<0) break;
    c=best; roh.push(c);
  }
  /* glaetten: immer zum entferntesten noch sichtbaren Punkt springen */
  const out=[]; let px=from.x, pz=from.z, i2=0;
  while(i2<roh.length){
    let j=roh.length-1;
    while(j>i2){ const p=navPos(roh[j]); if(navSicht(px,pz,p.x,p.z)) break; j--; }
    const p=navPos(roh[j]); out.push(p); px=p.x; pz=p.z; i2=j+1;
  }
  out.push(to.clone?to.clone():V(to.x,0,to.z));
  return out;
}
function route(from,to){
  if(NAV.dirty) navBuild();

    const a=V(-20.8,0,-2), b=V(-19.2,0,-2), mid=from.x<-20?b:a;
    return (from.x<-20?[a,b]:[b,a]).concat(route(mid,to));
  }
  if(from.x<-20&&to.x<-20) return [to];
  if((from.x<-8)!==(to.x<-8)){
    const a=V(-8.9,0,-2.5), b=V(-7.1,0,-2.5), mid=from.x<-8?b:a;
    return (from.x<-8?[a,b]:[b,a]).concat(route(mid,to));

function buyChance(t,price,q,cold,ct){ const r=price/marketOf(t), lo=priceTol()*(ct?ct.tol:1)+((q||1)-1)*0.18+(cold?0.16:0); if(r<=lo) return 1; if(r>=lo+0.5) return 0; return 1-(r-lo)/0.5; }

/* Was im Regal steht, fragen die Leute deutlich haeufiger nach.
   Ohne das wuerde jedes neue Lizenzpaket den Umsatz einbrechen lassen:
   die Kundschaft wuenscht sich sofort Ware, die noch gar nicht da ist,

function nachfrageFaktor(t){
  if(shelfStockOf(t)>0) return 1;

function makeWishes(ct){
  const avail=ORDER.filter(t=>isUnlocked(t)&&canWish(t)), list=[], used=new Set();
  const late=silvesterNah(S.day);
  let n=Math.random()<0.38?1:(Math.random()<0.6?2:(Math.random()<0.8?3:4));
  if(ct) n=Math.max(1,Math.round(n*ct.items));
  n=Math.max(1,Math.round(n*korbGroesse()));
  for(let k=0;k<n;k++){
    const pool=avail.filter(a=>!used.has(a)); if(!pool.length) break;
    const wt=pool.map(t=>{ let w=P[t].weight;
      if(late&&P[t].cat===2) w*=1.9;
      if(hype>40&&P[t].cat===2) w*=1.3;
      if(P[t].cat===0) w*=1.1*evv('cat0');
      if(P[t].cat===2) w*=evv('cat2');
      if(ct&&ct.f1&&P[t].cat===2) w*=0.12;
      if(ct&&ct.f2&&P[t].cat===2) w*=2.6;
      return w*nachfrageFaktor(t); });
    let r=Math.random()*wt.reduce((a,b)=>a+b,0), t=pool[0];
    for(let j=0;j<pool.length;j++){ r-=wt[j]; if(r<=0){ t=pool[j]; break; } }
    used.add(t);
    const mp=marketOf(t), big=mp>20;

}

  stolenValue(){ return this.items.reduce((a,b)=>a+costOf(b.type),0); }
  caughtBy(what){

  escaped(){

  joinQueue(){

    if(S.up.kasse2&&sbLanes.length&&this.items.length<=3&&(queue.length>=1||Math.random()<0.45)){
      const i=sbFrei();
      if(i>=0){ this.sb=i; sbLanes[i].busy=this; sbLampe(sbLanes[i],false);
        this.state='sbGo'; this.path=[...route(this.pos,sbPos(i))]; DS.sb=(DS.sb||0)+1; return; }

  }
  sbStart(){

  sbFree(){

  atRegister(){ this.state='unload'; this.ui=0; this.unT=0.5; this.scanned=0; this.sum=0; posReset(); posStatus='Kunde legt Ware aufs Band'; drawPOS(); }
  startPay(){

    if(this.method==='card'){ this.say('Mit Karte, bitte.'); const w=ck(0.62,0.42); this.prop=box(0.085,0.054,0.004,std(0x2f5d9e,{metalness:0.3}),w.x,1.1,w.z,null,false); this.prop.rotation.x=-0.4; posStatus='Kartenzahlung: Terminal anklicken'; }
    else { this.given=cashAmount(this.total); this.say(`Bar: ${eur(this.given)}`); const w=ck(0.35,0.28); this.prop=box(0.14,0.004,0.07,std(this.given>=50?0xf2a25a:this.given>=20?0x7aa9df:0xe58c85),w.x,0.957,w.z,null,false); posStatus=`Bar erhalten: ${eur(this.given)}. Kasse anklicken`; }

  }
  finishCard(){ if(this.state!=='pay') return; sfx.beep(); later(0.12,()=>sfx.beep()); this.complete(this.total,0); }
  finishCash(back){ if(this.state!=='pay') return; const due=r2(this.given-this.total), over=r2(back-due); this.complete(r2(this.given-back),over>0?over:0); }
  complete(net,over){
    S.money=r2(S.money+net); S.seasonRevenue=r2(S.seasonRevenue+this.total); DS.revenue=r2(DS.revenue+this.total);
    DS.changeLoss=r2(DS.changeLoss+over); DS.sold+=this.items.length; DS.customers++;
    const nf2=this.items.filter(i2=>P[i2.type].cat===2).length; DS.f2+=nf2;
    goalAdd('rev',this.total); goalAdd('cust',1); goalAdd('sold',this.items.length); goalAdd('f2',nf2);
    this.items.forEach(it=>statVerkauf(it.type,1));
    statAdd('kunden',1);
    let gain=Math.round(this.total*0.5)+4; if(over<=0.001&&this.method==='cash') gain+=3;

    if(over>0) toast(`${eur(over)} zu viel Rückgeld gegeben.`,'bad');
    this.say(this.missed?'Wenigstens etwas.':pick(['Guten Rutsch!','Danke!','Frohes Neues!','Bis nächstes Jahr!']));

  cleanupRegister(){

  giveUp(){

  leave(){

    this.state='leave'; this.path=[...route(this.pos,V(0,0,4.9)),V(0,0,7.6),V(rand(-5,5),0,14)];
    if(Math.random()<(hasDeko('muell')?0.1:0.22)) addDirt(this.pos.x+rand(-1,1),this.pos.z+rand(-1,1));
  }
  update(dt){
    if(this.bub){ this.bubT-=dt; if(this.bubT<=0) this.clearBub(); }
    this.moving=false;
    switch(this.state){
      case 'enter': if(this.walk(dt)) this.nextWish(); break;
      case 'toShelf': if(this.walk(dt)){ this.state='browse'; this.wait=rand(0.8,1.6); this.face(this.lv?shelfFace(this.lv.sh):Math.PI); } break;
      case 'toGrav': if(this.walk(dt)){ this.state='graving'; this.wait=rand(3.5,6); if(gravG) this.face(gravG.rotation.y+Math.PI); this.say('Mal sehen …'); } break;
      case 'graving': this.wait-=dt; if(this.wait<=0){ this.gravDone=true;
          if(customerEngraves(this)) this.say('Sehr schön!'); else this.say('Kein Rohling drin?',true);
          this.nextWish(); } break;
      case 'browse': this.wait-=dt; if(this.wait<=0) this.take(); break;
      case 'steal':
        if(this.walk(dt)){
          if(S.up.alarm&&Math.random()<0.7){ this.caughtBy('alarm'); }
          else { this.escaped(); this.state='leave'; this.path=[V(rand(-5,5),0,15)]; if(this.mark){ this.g.remove(this.mark); this.mark=null; } }
        } break;
      case 'queue': {
        const i=queue.indexOf(this), spot=spotPos(i);
        if(this.path.length){ this.path[this.path.length-1]=spot; this.walk(dt); }
        else if(Math.hypot(spot.x-this.pos.x,spot.z-this.pos.z)>0.08) this.path=[spot];
        else { this.face(ckYaw()+(i===0?Math.PI:Math.PI/2)); if(i===0) this.atRegister(); }
        this.patience-=dt; if(this.patience<=0) this.giveUp();
        break; }
      case 'unload':
        this.patience-=dt*0.4; this.unT-=dt;
        if(this.unT<=0){
          if(this.ui<this.items.length){ const it=this.items[this.ui]; if(beltRoom(P[it.type].dims[0])){ beltAdd(it,this); this.ui++; this.unT=0.45; } else this.unT=0.25; }
          else this.state='scan';
        }
        if(this.patience<=0) this.giveUp(); break;
      case 'scan': this.patience-=dt*0.4; if(this.scanned>=this.items.length) this.startPay(); else if(this.patience<=0) this.giveUp(); break;
      case 'pay':
        this.patience-=dt*0.3;
        if(staff.kassierer){ this.autoT-=dt; if(this.autoT<=0){ if(this.method==='card') this.finishCard(); else this.finishCash(r2(this.given-this.total)); } }
        if(this.state==='pay'&&this.patience<=0) this.giveUp(); break;
      case 'sbGo':
        if(this.walk(dt)){ this.face(Math.PI); this.sbStart(); }
        this.patience-=dt; if(this.patience<=0) this.giveUp();
        break;
      case 'sbPay':
        this.sbT-=dt; this.patience-=dt*0.3;
        if(this.sbT<=0){ sfx.beep(); this.complete(this.total,0); }
        else if(this.patience<=0) this.giveUp();
        break;
      case 'leave': if(this.walk(dt)) this.remove(); break;
    }
    animPerson(this.g,this.moving,dt,this.speed);
  }
  remove(){ this.clearBub(); scene.remove(this.g); const i=customers.indexOf(this); if(i>=0) customers.splice(i,1); }
}
function shelfFace(sh){ return sh.g.rotation.y+Math.PI; }
function regCustomer(){ const c=queue[0]; return c&&['unload','scan','pay'].includes(c.state)?c:null; }
function cashAmount(t){
  const c=[Math.ceil(t-1e-9),Math.ceil(t/5-1e-9)*5,Math.ceil(t/10-1e-9)*10,Math.ceil(t/20-1e-9)*20,Math.ceil(t/50-1e-9)*50].filter((v,i,a)=>v>=t-1e-9&&a.indexOf(v)===i);
  if(Math.random()<0.12) return r2(t);
  return pick(c);
}
function sprayHit(){
  const dir=V(-Math.sin(yaw),0,-Math.cos(yaw)), from=V(pl.x,0,pl.z);
  let best=null,bd=4.2;
  for(const c of customers){ if(c.state!=='steal'||c.caught) continue;
    const to=V(c.pos.x-from.x,0,c.pos.z-from.z), d=to.length(); if(d>bd) continue;
    to.normalize(); if(to.dot(dir)<0.55) continue; bd=d; best=c; }
  return best;
}

/* =========================================================
   Großkunden: Anruf, Verhandlung, Abholung

let phone={state:null,t:0,cd:120,call:null}, order=null;
function pyroUnlocked(){ return S&&S.up&&S.up.grosskunden; }
function orderScale(){ return S.level>=15?[4,9]:S.level>=10?[3,6]:[2,4]; }
function makeCall(){
  const avail=ORDER.filter(t=>isUnlocked(t)&&P[t].cat&&canShelf(t));
  if(!avail.length) return null;
  const [lo,hi]=orderScale(), total=Math.round(rand(lo,hi+0.99));
  const n=Math.min(avail.length,total<=3?1:(Math.random()<0.5?2:3));
  const picks=[], pool=avail.slice();
  for(let i=0;i<n&&pool.length;i++){ const k=Math.floor(Math.random()*pool.length); picks.push(pool.splice(k,1)[0]); }
  const items=[]; let left=total;
  picks.forEach((t,i)=>{ const c=i===picks.length-1?Math.max(1,left):Math.max(1,Math.round(left/(picks.length-i)));
    items.push({type:t,cartons:c,loaded:0}); left-=c; });
  const type=pick(PYROTYPES);
  const value=items.reduce((a,it)=>a+it.cartons*P[it.type].box*S.prices[it.type],0);
  const stamm=(S.stamm||{})[type.id]||0;
  return {name:pick(PYRONAMES),type,items,value:r2(value),mult:type.open+Math.min(0.08,stamm*0.02),round:0,rounds:type.rounds,stamm};
}
function updatePhone(dt){
  if(!pyroUnlocked()||phase!=='open') return;
  if(order||phone.state){ if(phone.state==='ringing'){ phone.t-=dt; if(phone.t<=0){ phone.state=null; $('phone').textContent=''; phone.cd=rand(60,110); toast('Anruf verpasst.','bad'); } } return; }
  /* In der Nebensaison ist im Laden wenig los, dafuer melden sich mehr
     Veranstalter. Das haelt Januar bis September lebendig. */
  const flau=clamp(1.9-dayMult(S.day)*0.9,0.8,1.9);
  phone.cd-=dt*flau/evv('pyro');
  if(phone.cd<=0){
    const c=makeCall();
    if(!c){ phone.cd=90; return; }
    phone.call=c; phone.state='ringing'; phone.t=26; S.tut.phone=true; sfx.ring();
    toast('Das Handy klingelt.',COARSE?'':'xp');
  }
}
function answerPhone(){
  if(phone.state!=='ringing') return;
  phone.state='talking'; $('phone').textContent=''; openDeal();
}
function dealRows(c){
  return c.items.map(it=>`<div class="sumrow"><span>${P[it.type].name}</span><span>${it.cartons} Karton${it.cartons>1?'e':''} · ${it.cartons*P[it.type].box} Stück</span></div>`).join('');
}
function openDeal(){
  const c=phone.call; if(!c) return;
  dealOpen=true; paused=true; if(locked) document.exitPointerLock();
  renderDeal(c.round===0?c.type.line:null);
  $('deal').classList.add('show');
}
function renderDeal(line){
  const c=phone.call; if(!c) return;
  const price=r2(c.value*c.mult);
  $('dTitle').textContent=c.name;
  $('dLine').textContent=line||'Was sagen Sie?';
  $('dRows').innerHTML=dealRows(c)+
    `<div class="sumrow"><span>Ladenwert der Ware</span><span>${eur(c.value)}</span></div>`+
    `<div class="sumrow big"><span>Aktuelles Angebot</span><span>${eur(price)}</span></div>`+
    `<div class="sumrow"><span>Das sind</span><span>${Math.round(c.mult*100)} % vom Ladenpreis</span></div>`+
    (c.stamm?`<div class="sumrow"><span>Stammkunde</span><span>${c.stamm}. Auftrag</span></div>`:'');
  $('dRounds').textContent=c.rounds>0?`Noch ${c.rounds} Versuch${c.rounds>1?'e':''} zu handeln`:'Kein Spielraum mehr';
  document.querySelectorAll('#dHaggle button').forEach(b=>b.disabled=c.rounds<=0);
  $('dAccept').disabled=false;
  $('dAccept').textContent=`Für ${eur(price)} abschließen`;

function haggle(step){
  const c=phone.call; if(!c||c.rounds<=0) return;
  const want=r2(c.mult*(1+step));
  if(want<=c.type.ceil){
    c.mult=want; sfx.beep();
    renderDeal(pick(['Na gut, einverstanden.','Geht klar, machen wir so.','Meinetwegen, abgemacht.']));
    return;
  }
  c.rounds--;
  const over=want/c.type.ceil;
  let line;
  if(over>1.25) line='Sie sind ja verrückt. Das zahlt Ihnen keiner.';
  else if(over>1.1) line='Das ist deutlich zu viel. Da bin ich raus.';
  else line='Ganz knapp zu teuer. Kommen Sie mir noch etwas entgegen.';
  if(c.rounds<=0){
    sfx.alarm(); renderDeal(line+' Dann eben nicht.');
    document.querySelectorAll('#dHaggle button').forEach(b=>b.disabled=true);
    $('dAccept').disabled=true;
    setTimeout(()=>{ if(!dealOpen) return; closeDeal(); toast('Der Auftrag ist geplatzt.','bad'); phone.state=null; phone.call=null; phone.cd=rand(70,130); },1400);
    return;
  }
  c.mult=r2(Math.min(c.type.ceil,c.mult+step*0.35));
  renderDeal(line);
}
function acceptDeal(){
  const c=phone.call; if(!c) return;

  order={name:c.name,typeId:c.type.id,items:c.items,pay,arrive:rand(18,30),t:0,done:false};
  S.stamm=S.stamm||{}; S.stamm[c.type.id]=(S.stamm[c.type.id]||0)+1;
  closeDeal(); phone.state=null; phone.call=null; phone.cd=rand(150,260);
  sfx.cash(); toast(`Auftrag über ${eur(pay)} angenommen. Die Ware geht aus dem Lager raus.`,'money');
  addXP(20,'Auftrag an Land gezogen');
}
function declineDeal(){ closeDeal(); phone.state=null; phone.call=null; phone.cd=rand(70,130); toast('Abgelehnt.'); }
function closeDeal(){ $('deal').classList.remove('show'); dealOpen=false; paused=false; requestLock(); }
/* --- Versand aus dem Lager --- */
function orderNeed(t){ if(!order) return 0; const it=order.items.find(x=>x.type===t); return it?it.cartons-it.loaded:0; }
function orderLeft(){ return order?order.items.reduce((a,it)=>a+(it.cartons-it.loaded),0):0; }
/* Ware, die für einen laufenden Auftrag reserviert ist, fasst das Personal nicht an */
function reservedType(t){ return !!order&&order.arrive<=0&&orderNeed(t)>0; }
function fullBox(t){ return Math.ceil(P[t].box*0.9); }
/* Zählt, wie viele volle Kartons im Lager abholbereit stehen */
function orderReady(){
  if(!order) return 0;
  let n=0;
  order.items.forEach(it=>{
    let have=0;
    racks.forEach(r=>r.slots.forEach(sl=>{ if(sl.box&&sl.box.type===it.type&&sl.box.count>=fullBox(it.type)) have++; }));
    floorBoxes.forEach(b=>{ if(b.type===it.type&&b.count>=fullBox(it.type)&&b.mesh.position.x<-8) have++; });
    n+=Math.min(have,it.cartons-it.loaded);
  });
  return n;
}
function shipOne(){
  if(!order) return null;
  for(const it of order.items){
    if(it.loaded>=it.cartons) continue;
    for(const r of racks) for(const sl of r.slots){
      if(sl.box&&sl.box.type===it.type&&sl.box.count>=fullBox(it.type)){
        sl.rk.g.remove(sl.box.mesh); sl.box=null; drawRackSchild(sl.rk); it.loaded++; return it;
      }
    }
    for(const b of floorBoxes.slice()){
      if(b.type===it.type&&b.count>=fullBox(it.type)&&b.mesh.position.x<-8){ removeFloorBox(b); it.loaded++; return it; }
    }
  }
  return null;
}
function finishOrder(){
  const o=order; order=null;
  S.money=r2(S.money+o.pay); DS.revenue=r2(DS.revenue+o.pay); S.seasonRevenue=r2(S.seasonRevenue+o.pay);
  DS.orders=(DS.orders||0)+1; goalAdd('orders',1); statAdd('auftraege',1);
  rep(2.5); addXP(Math.round(o.pay*0.4)+40,'Großauftrag erfüllt'); sfx.cash();
  toast(`${o.name}: Ware ist raus, ${eur(o.pay)} gutgeschrieben.`,'money');
  save();
}
function failOrder(){
  if(!order) return; const o=order; order=null;
  const fehlt=o.items.reduce((a,it)=>a+(it.cartons-it.loaded),0);
  rep(-4); toast(`${o.name} hat ${fehlt} Karton${fehlt>1?'s':''} nicht bekommen. Das kostet Ruf.`,'bad');
}
function updateOrder(dt){
  if(!order) return;
  if(order.arrive>0){
    order.arrive-=dt;
    if(order.arrive<=0){ toast(`Die Spedition für ${order.name} ist unterwegs. Volle Kartons müssen im Lager stehen.`); sfx.beep(); S.tut.versand=true; }
    return;
  }
  order.t=(order.t||0)-dt;
  if(order.t>0) return;
  order.t=1.8;
  const it=shipOne();
  if(!it) return;
  sfx.pop();
  if(orderLeft()<=0) finishOrder();
  else if(orderLeft()%3===0) toast(`Abgeholt. Noch ${orderLeft()} Karton${orderLeft()>1?'e':''}.`);
}

/* =========================================================
   Personal
   ========================================================= */
const staff={reinigung:null,auffueller:null,auffueller2:null,kassierer:null,security:null,packer:null};
const IDLE={reinigung:V(-6.6,0,4.2),auffueller:V(-7.0,0,1.0),auffueller2:V(-7.0,0,-0.4),kassierer:V(0,0,0),security:V(1.4,0,4.6),packer:V(-16.3,0,3.4)};
const PRIO={lkw:'LKW zuerst',regal:'Regale zuerst'};
/* Lohnstufen: mehr Geld heißt schneller, gründlicher und freundlicher */
const WAGES=[
  {f:0.75,name:'Mindestlohn',desc:'billig, aber lustlos'},
  {f:1.00,name:'Normal',desc:'macht seinen Job'},
  {f:1.30,name:'Gut bezahlt',desc:'flott und aufmerksam'},
  {f:1.65,name:'Top',desc:'schnell, gründlich, freundlich'}
];
function wageOf(id){ const v=(S&&S.wage&&S.wage[id]); return WAGES.some(w=>w.f===v)?v:1.0; }
/* Saisonpause: von Januar bis Herbst braucht kein Laden volle Besetzung.
   Statt zu kuendigen und spaeter wieder Einstellungskosten zu zahlen,
   geht das Personal in Kurzarbeit: 30 Prozent Lohn, dafuer keine Arbeit. */
function inPause(id){ return !!(S&&S.pause&&S.pause[id]); }
function setPause(id,an){
  if(!S.staff||!S.staff[id]) return;
  S.pause=S.pause||{};
  if(an){ S.pause[id]=true; fireStaff(id); }
  else { delete S.pause[id]; hireStaff(id); }
  save();
}
function wageName(id){ const f=wageOf(id), w=WAGES.find(x=>x.f===f); return w?w.name:'Normal'; }
function setWage(id,f){ S.wage=S.wage||{}; S.wage[id]=f; if(staff[id]) staff[id].applyWage(); save(); }
/* Freundlichkeit: Mittel aller Lohnfaktoren, wirkt auf Geduld und Kauflaune */
function friendliness(){
  let n=0,sum=0;
  STAFF.forEach(st=>{ if(S&&S.staff&&S.staff[st.id]){ n++; sum+=wageOf(st.id); } });
  return n?sum/n:1;
}
function prioOf(id){ const p=(S&&S.prio)||{}; return p[id]||(id==='auffueller'?'lkw':'regal'); }
function setPrio(id,v){ S.prio=S.prio||{}; S.prio[id]=v; save(); }
function freeRackSlot(){ for(const r of racks) for(const sl of r.slots) if(!sl.box) return sl; return null; }
class Worker{
  constructor(id){
    const look=STAFFLOOK[id];
    this.id=id; this.kind=id==='auffueller2'?'auffueller':id; this.g=makePerson({jacket:look.jacket,cap:look.cap});
    const st=IDLE[id]; this.g.position.copy(id==='kassierer'?ck(-0.25,-0.85):st); scene.add(this.g);
    this.path=[]; this.base=id==='security'?1.9:1.45; this.speed=this.base; this.state='idle'; this.t=0; this.carry=null; this.chase=null; this.moving=false; this.applyWage();
  }
  get pos(){ return this.g.position; }
  applyWage(){ const f=wageOf(this.id); this.speed=this.base*(0.55+0.48*f); this.wf=f; }
  walk(dt){
    if(!this.path.length){ this.moving=false; return true; }
    const t=this.path[0], dx=t.x-this.pos.x, dz=t.z-this.pos.z, d=Math.hypot(dx,dz), st=this.speed*dt;

  goTo(v){ this.path=route(this.pos,v.clone()); }

  cleanLoop(dt){

  pickShelf(){

  cashLoop(dt){

  }
  remove(){ scene.remove(this.g); if(this.carry&&this.carry.count>0) spawnFloorBox(this.carry.type,this.carry.count,null,this.carry.q||1); }
}

class PS{
  constructor(max,size){
    this.max=max; this.pos=new Float32Array(max*3); this.col=new Float32Array(max*3); this.vel=new Float32Array(max*3);
    this.base=new Float32Array(max*3); this.c2=new Float32Array(max*3);
    this.life=new Float32Array(max); this.maxl=new Float32Array(max); this.grav=new Float32Array(max);
    this.md=new Uint8Array(max); this.ph=new Float32Array(max);

    this.pos[j]=x; this.pos[j+1]=y; this.pos[j+2]=z; this.vel[j]=vx; this.vel[j+1]=vy; this.vel[j+2]=vz;
    this.base[j]=r; this.base[j+1]=g; this.base[j+2]=b;
    this.c2[j]=r2===undefined?r:r2; this.c2[j+1]=g2===undefined?g:g2; this.c2[j+2]=b2===undefined?b:b2;
    this.life[i]=life; this.maxl[i]=life; this.grav[i]=grav; this.md[i]=mode||0; this.ph[i]=Math.random()*9;
  }

      if(this.life[i]<=0) continue; any=true; const j=i*3;

      this.vel[j]*=drag; this.vel[j+1]=this.vel[j+1]*drag-this.grav[i]*dt; this.vel[j+2]*=drag;

      else if(m===1){ k*=((this.life[i]*11+this.ph[i])%1)<0.42?1.9:0.05; }
      else if(m===2){ const u=1-f; r+=(this.c2[j]-r)*u; g+=(this.c2[j+1]-g)*u; b+=(this.c2[j+2]-b)*u; k*=0.9+Math.random()*0.1; }
      else if(m===3){ if(Math.random()<0.26){ k=2.4; r=g=b=1; } else k*=0.06; }
      else k*=0.45+Math.random()*1.05;
      this.col[j]=r*k; this.col[j+1]=g*k; this.col[j+2]=b*k;
    }
    if(any||this.dirty){ this.geo.attributes.position.needsUpdate=true; this.geo.attributes.color.needsUpdate=true; }
    this.dirty=any;
  }
}

function scheme(i){ const s=(typeof i==='number'&&i>=0)?SCHEMES[i%SCHEMES.length]:pick(SCHEMES); return [K(s[0]),K(s[1])]; }
function randDir(){ let x,y,z,d; do{ x=rand(-1,1); y=rand(-1,1); z=rand(-1,1); d=x*x+y*y+z*z; }while(d>1||d<0.01); d=Math.sqrt(d); return [x/d,y/d,z/d]; }
function basis(){
  const n=randDir(), a=Math.abs(n[1])<0.86?[0,1,0]:[1,0,0];
  let u=[n[1]*a[2]-n[2]*a[1],n[2]*a[0]-n[0]*a[2],n[0]*a[1]-n[1]*a[0]];
  const l=Math.hypot(u[0],u[1],u[2])||1; u=[u[0]/l,u[1]/l,u[2]/l];
  const v=[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]];

const FLASH=[];
function initFlash(){
  for(let i=0;i<(COARSE?2:4);i++){ const l=new THREE.PointLight(0xffffff,0,95,1); l.visible=false; scene.add(l); FLASH.push({l,t:0,d:0.6,max:0}); }
}
function flash(p,c,power,dur){
  if(!FLASH.length) return;
  let f=FLASH[0]; for(const x of FLASH){ if(x.t<=0){ f=x; break; } if(x.t<f.t) f=x; }
  f.l.position.set(p.x,p.y,p.z);
  f.l.color.setRGB(clamp(c[0]+0.15,0,1),clamp(c[1]+0.15,0,1),clamp(c[2]+0.15,0,1));
  f.max=power; f.d=dur||0.6; f.t=f.d; f.l.visible=true; f.l.intensity=power;
}
function updateFlash(dt){
  for(const f of FLASH){ if(f.t<=0) continue;
    f.t-=dt; const k=Math.max(0,f.t/f.d);
    f.l.intensity=f.max*k*k*(0.85+Math.random()*0.3);
    if(f.t<=0){ f.t=0; f.l.intensity=0; f.l.visible=false; } }
}

/* Zeitregen: grosse, traege Sterne, die ihren Glitzer nach und nach abwerfen */
EFF.zeitregen=function(p,A,B,s){
  const traeger=[];
  const n=Math.round(40*s*QUAL());
  for(let i=0;i<n;i++){ const d=randDir(), v=rand(5,7.5)*s;
    traeger.push([d[0]*v,d[1]*v,d[2]*v]);
    psHuge.emit(p.x,p.y,p.z,d[0]*v,d[1]*v,d[2]*v,A[0],A[1],A[2],rand(4.0,5.4),2.4,4); }
  /* der Glitzer faellt in Wellen nach, nicht auf einmal */
  for(let w=1;w<=5;w++) later(w*0.42,()=>{
    const f=1-Math.exp(-1.1*w*0.42), fall=0.5*2.4*Math.pow(w*0.42,2);
    for(const t of traeger){
      if(Math.random()>0.75) continue;
      const q={x:p.x+t[0]*f*0.9,y:p.y+t[1]*f*0.9-fall,z:p.z+t[2]*f*0.9};
      for(let i=0;i<Math.round(5*QUAL());i++){ const d=randDir(), sp=rand(0.4,1.8);
        psMid.emit(q.x,q.y,q.z,d[0]*sp,d[1]*sp,d[2]*sp,1,.92,.62,rand(0.9,1.6),3.2,4); }
    }
    if(w===2) sfx.crackle(distVol(p)*0.5);
  });
};

/* =========================================================
   Raketen
   ========================================================= */
function shot(o,opt){
  opt=opt||{}; o=o||PAD;
  const ang=opt.ang||0, dir=opt.dir===undefined?rand(0,Math.PI*2):opt.dir;
  const up=(opt.pw||0)+rand(19,23);
  const sc=opt.A?[opt.A,opt.B||opt.A]:scheme(opt.sc);
  rockets.push({
    p:V(o.x+rand(-.35,.35),o.y!==undefined?o.y+0.4:1,o.z+rand(-.35,.35)),
    v:V(Math.sin(dir)*Math.sin(ang)*up,Math.cos(ang)*up,Math.cos(dir)*Math.sin(ang)*up),
    fuse:opt.fuse||rand(1.05,1.35),
    A:sc[0],B:sc[1],eff:opt.eff||pick(EFF_GROSS),size:opt.sz||1,
    trail:opt.trail||(Math.random()<0.25?FW.silber:FW.gold),
    /* Nachbrueche: Tochterbomben, die nach dem Hauptbruch aufgehen */
    stufen:opt.stufen||null, dick:opt.dick||0
  });
  sfx.thump(distVol(o)*(1+(opt.dick||0)*0.5));
  if(Math.random()<0.45) sfx.whistle(distVol(o)*0.7);
}
/* =========================================================
   Kugelbombe: schwerer Aufstieg aus dem Moerser, oben ein
   grosser Hauptbruch und danach mehrere Tochterbrueche.
   kal ist der Kaliber-Faktor: 1 = 75 mm, 2 = 100 mm, 3 = 150 mm.
   ========================================================= */
function kugelbombe(o,kal,opt){
  opt=opt||{};
  const K3=Math.max(1,Math.min(3,kal|0));
  const [A,B]=opt.A?[opt.A,opt.B||opt.A]:scheme();
  const groesse=[1.25,1.6,2.15][K3-1];
  const steig=[4,7,10][K3-1];
  const zuend=[1.55,1.85,2.15][K3-1];
  /* Abschussknall und Muendungsfeuer im Rohr */
  const v0=distVol(o);
  sfx.boom(Math.min(1.3,v0*(0.55+0.2*K3)));
  shake=Math.max(shake,Math.min(1.0,0.22*K3)*v0);
  flash({x:o.x,y:o.y+0.4,z:o.z},FW.bernstein,2.4+K3,0.28);
  for(let i=0;i<Math.round(60*K3*QUAL());i++){
    const a=Math.random()*Math.PI*2, w=rand(0.4,2.4);
    psMid.emit(o.x,o.y+0.3,o.z,Math.cos(a)*w,rand(5,13),Math.sin(a)*w,1,.78,.34,rand(0.5,1.2),7,4);
  }
  /* Hauptbruch und die Nachbrueche als Stufen */
  const haupt=opt.eff||pick(EFF_PRO);
  const stufen=[];
  if(K3>=2){
    /* Tochterbomben: mehrere kleinere Brueche rund um den Hauptbruch */
    const n=K3===2?3:6;
    for(let i=0;i<n;i++) stufen.push({
      t:0.45+i*rand(0.12,0.26),
      eff:pick(K3===2?['kugel','pistill','knister','spinne']:['kugel','pistill','knister','spinne','strobe','fische','crossette']),
      sz:groesse*rand(0.34,0.5),
      streu:5+K3*2.2,
      A:i%2?B:A, B:i%2?A:B
    });
  }
  if(K3===3){
    /* und ganz zum Schluss noch einmal richtig gross */
    stufen.push({t:1.55,eff:pick(['kamuro','brokat','zeitregen']),sz:groesse*0.95,streu:3,A,B});
    stufen.push({t:1.62,eff:'salut',sz:0.9,streu:6,A:FW.weiss,B:FW.weiss});
  }
  shot(o,{pw:steig,sz:groesse,eff:haupt,fuse:zuend,A,B,
          trail:K3===3?FW.weiss:FW.gold,dick:K3,stufen});
}
/* Bodeneffekt: Mine, die beim Start eine Fontäne wirft */
function mine(o,A,B,s){
  const n=Math.round(90*(s||1)*QUAL());
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, w=rand(0.5,3.2), c=i%3?A:B;
    psMid.emit(o.x+rand(-.2,.2),0.3,o.z+rand(-.2,.2),Math.cos(a)*w,rand(9,16),Math.sin(a)*w,c[0],c[1],c[2],rand(1.1,1.9),6.5,4); }
  flash({x:o.x,y:1.6,z:o.z},A,2.0,0.5);
  sfx.thump(distVol(o)*1.2);
}
function fwBurst(r){
  const p=r.p, fn=EFF[r.eff]||EFF.kugel;
  fn(p,r.A,r.B,r.size);
  /* Wer ein Bruchbild einmal gesehen hat, darf es spaeter selbst verbauen */
  if(typeof bruchGesehen==='function') bruchGesehen(r.eff);
  const mix=[(r.A[0]+r.B[0])/2,(r.A[1]+r.B[1])/2,(r.A[2]+r.B[2])/2];
  const lang=r.eff==='weide'||r.eff==='brokat'||r.eff==='kamuro'||r.eff==='zeitregen';
  flash(p,mix,2.2+3.4*r.size,lang?1.2:0.6);
  if(r.eff!=='salut') shellSound(p,r.size);
  /* Nachbrueche der Kugelbombe */
  if(r.stufen) for(const st of r.stufen){
    const q={x:p.x+rand(-st.streu,st.streu),y:p.y+rand(-st.streu*0.55,st.streu*0.55),z:p.z+rand(-st.streu,st.streu)};
    later(st.t,()=>{
      (EFF[st.eff]||EFF.kugel)(q,st.A||r.A,st.B||r.B,st.sz);
      if(st.eff!=='salut'){
        flash(q,st.A||mix,1.6+2.2*st.sz,0.5);
        shellSound(q,st.sz);
      }
    });
  }
}
