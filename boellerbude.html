<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Böllerladen Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#121a33; --ink:#0e1226; --signal:#ffd23f; --fire:#e63b2e; --snow:#f2f5ff; --spark:#7fd1ff; --mint:#8ef0a8;
  --panel:rgba(14,18,38,.84); --panel-strong:rgba(14,18,38,.95); --line:rgba(242,245,255,.16); --muted:rgba(242,245,255,.68);
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:rgba(6,8,20,.86); --panel-strong:rgba(6,8,20,.96); } }
:root[data-theme="dark"]{ --panel:rgba(6,8,20,.86); --panel-strong:rgba(6,8,20,.96); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--snow);font-family:var(--ui);font-size:18px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.tl{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:12px;align-items:flex-start}
#clock{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:158px;display:flex;flex-direction:column}
#hDate{order:-1}
#hDate{font-weight:700;font-size:18px;line-height:1.1}
#hTime{font-family:var(--display);font-size:26px;line-height:1.15}
#hStatus{font-size:15px;color:var(--muted);line-height:1.2}
#hStatus.on{color:var(--mint)}
.meter{margin-top:8px;width:158px}
.meter span{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.meter span i{font-style:normal}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--fire));transition:width .3s}
.bar.xp i{background:linear-gradient(90deg,var(--spark),var(--mint))}
.bar.clean i{background:linear-gradient(90deg,#8ad6ff,#cdeaff)}
.tag{position:relative;background:var(--signal);color:var(--ink);border-radius:6px 18px 18px 6px;padding:8px 16px 8px 28px;transform:rotate(-2.5deg);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.tag::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--night)}
#hMoney{font-family:var(--display);font-size:24px;line-height:1.05}
#hXpWrap{margin-top:3px}
.xpbar{height:7px;border-radius:4px;background:rgba(14,18,38,.28);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1b2340,#3f5aa8);transition:width .3s}
#hXpTxt{display:block;font-size:12px;font-weight:700;color:rgba(14,18,38,.72);line-height:1.2;margin-top:1px}
#hLoan{font-size:14px;font-weight:700}
#hLoan:empty{display:none}
#hLevel{position:absolute;right:6px;bottom:-12px;background:var(--ink);color:var(--signal);font-family:var(--display);font-size:13px;padding:2px 8px;border-radius:5px;transform:rotate(1deg)}
#tip{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));max-width:min(320px,42vw);background:var(--panel);border-left:4px solid var(--signal);border-radius:8px;padding:9px 12px;font-size:17px;line-height:1.25;font-weight:600}
#tip:empty{display:none}
#tip{transition:opacity .4s}
#tip.dim{opacity:0}
#staff{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 84px);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:15px;font-weight:600;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--snow);box-shadow:0 0 0 2px rgba(0,0,0,.45);opacity:.85}
#cross.hot{background:var(--signal);width:12px;height:12px;margin:-6px 0 0 -6px;opacity:1}
#cross.move{background:var(--spark)}
#prompt{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);background:var(--panel-strong);padding:6px 12px;border-radius:8px;font-size:18px;font-weight:600;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#prompt:empty{display:none}
kbd{font-family:var(--display);font-size:13px;background:var(--signal);color:var(--ink);border-radius:4px;padding:1px 6px;margin-right:7px;vertical-align:1px}
#carry{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600;font-size:17px;white-space:nowrap}
#carry:empty{display:none}
#tool{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;font-size:16px}
#tool.on{background:var(--fire);border-color:var(--fire);color:#fff}
#tool:empty{display:none}
#mode{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 92px);transform:translateX(-50%);background:var(--spark);color:var(--ink);border-radius:8px;padding:6px 14px;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#mode:empty{display:none}
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--panel-strong);border-radius:8px;padding:6px 12px;font-weight:600;font-size:17px;animation:tin .25s ease-out;text-align:center}
.toast.money{color:var(--signal);font-family:var(--display);font-size:18px}
.toast.bad{color:#ffab9f}
.toast.xp{color:var(--spark)}
.toast.lvl{background:var(--signal);color:var(--ink);font-family:var(--display);font-size:19px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#touch{position:fixed;inset:0;z-index:5;display:none}
body:has(.ov.show) #touch{display:none}
.coarse #touch{display:block}
#look{position:absolute;inset:0}
#joy{position:absolute;left:0;bottom:0;width:45%;height:55%}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);display:none;transform:translate(-50%,-50%);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,210,63,.85)}
.tbtn{position:absolute;border-radius:50%;border:0;padding:0;font-family:var(--ui);font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
#btnAct{right:calc(22px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:88px;height:88px;background:var(--signal);font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#btnDrop{right:calc(124px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:64px;height:64px;background:rgba(242,245,255,.88);font-size:15px}
#btnTool{right:calc(24px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom));width:60px;height:60px;background:#ff8f7f;font-size:14px}
#btnMove{right:calc(112px + env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom));width:56px;height:56px;background:#9fdcff;font-size:14px}
#btnPda{right:calc(24px + env(safe-area-inset-right));bottom:calc(214px + env(safe-area-inset-bottom));width:60px;height:60px;background:#8ef0a8;font-size:14px}
#btnPda.on{background:var(--mint);box-shadow:0 0 0 3px rgba(142,240,168,.4)}
.tbtn.down{transform:translateY(3px);box-shadow:none}
#btnTool.on{background:var(--fire);color:#fff}
#btnMove.on{background:var(--spark)}
.coarse #carry{bottom:calc(210px + env(safe-area-inset-bottom))}
.coarse #tool{bottom:calc(210px + env(safe-area-inset-bottom));right:auto;left:14px}
.coarse #toasts{bottom:258px}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,10,24,.55)}
.ov.show{display:flex}
.card{background:var(--panel-strong);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:520px;width:100%;max-height:calc(100% - 16px);overflow:auto;touch-action:pan-y}

/* --- Startmaske: bildschirmfuellend, ohne Blick aufs Spiel --- */
#start{background:#05070f;padding:0;z-index:40;overflow:auto;align-items:flex-start;justify-content:center}
#startFx{position:absolute;inset:0;width:100%;height:100%;display:block}
.startInner{position:relative;z-index:1;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 16px;text-align:center;min-height:100%}
#start .logo{width:min(620px,78vw);max-height:42vh;object-fit:contain;margin:0;filter:drop-shadow(0 10px 34px rgba(0,0,0,.75))}
#start.naming .logo{max-height:26vh}
#startBtns{justify-content:center}
#startBtns button{font-size:22px;padding:15px 34px;min-width:230px;border-radius:12px}
.namebox{display:none;flex-direction:column;gap:8px;align-items:center;width:min(420px,86vw)}
.namebox.show{display:flex}
.namebox label{font-size:17px;color:var(--muted)}
.namebox input{width:100%;font-family:var(--ui);font-size:20px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--snow);text-align:center}
.namebox input:focus{outline:2px solid var(--signal);outline-offset:1px}
.namebox .btns{margin-top:8px}
body.compact #start .logo{width:min(420px,84vw);max-height:30vh}
body.compact #startBtns button{font-size:19px;padding:12px 24px;min-width:0}
.logo{display:block;width:min(340px,58vw);max-width:100%;margin:0 auto 10px;border-radius:14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.logo-fallback{font-family:var(--display);font-weight:400;color:var(--signal);font-size:clamp(34px,9vw,54px);line-height:.95;margin:0 0 6px;text-align:center;text-shadow:3px 3px 0 var(--fire)}
.lead{font-size:20px;line-height:1.3;margin:8px 0 14px;max-width:46ch}
.ctrl{font-size:17px;line-height:1.4;color:var(--muted);margin:0 0 18px;max-width:56ch}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--ui);font-weight:700;font-size:18px;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:var(--signal);color:var(--ink)}
button.ghost{background:transparent;color:var(--snow);border:1px solid var(--line)}
button.red{background:var(--fire);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
#laptop .card{max-width:min(1180px,96vw);padding:0;overflow:hidden;display:flex;flex-direction:column;background:#0f1530}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--ink);border-bottom:1px solid var(--line)}
.lhead b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--signal)}
.lhead span{font-family:var(--display);font-size:18px}
.lhead em{font-style:normal;font-size:15px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.tabs button{background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:8px 10px;white-space:nowrap;font-size:16px}
.tabs button.on{background:var(--signal);color:var(--ink)}
.lbody{padding:4px 16px 12px;overflow:auto;touch-action:pan-y;flex:1;min-height:180px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rm{flex:1;min-width:0}
.rm b{display:block;font-size:20px}
.rm small{display:block;color:var(--muted);font-size:16px;line-height:1.3}
.row.locked{opacity:.55}
.price{font-family:var(--display);font-size:20px;min-width:92px;text-align:right}
.steps{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.steps button{padding:8px 9px;font-size:16px;background:rgba(242,245,255,.12);color:var(--snow)}
.pill{display:inline-block;background:rgba(127,209,255,.18);color:var(--spark);border-radius:999px;padding:1px 9px;font-size:14px;font-weight:700;margin-left:6px}
.pill.f2{background:rgba(230,59,46,.2);color:#ff9d92}
.pill.f1{background:rgba(142,240,168,.16);color:var(--mint)}
.pill.zub{background:rgba(255,210,63,.18);color:var(--signal)}
.pill.up{background:rgba(255,120,100,.2);color:#ff9d92}
.pill.dn{background:rgba(108,242,168,.16);color:var(--mint)}
.pill.fl{background:rgba(242,245,255,.12);color:var(--muted)}
.spark{display:block;width:104px;height:30px;flex-shrink:0;opacity:.95}
.mkcol{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:104px}
.mkcol small{font-size:13px;color:var(--muted);line-height:1.1}
.lizrow{align-items:flex-start}
.lizitems{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.lizitems span{background:rgba(242,245,255,.10);border-radius:5px;padding:2px 7px;font-size:14px;color:var(--snow)}
/* Herausforderungen */
.erfbar{height:9px;border-radius:5px;background:rgba(242,245,255,.13);overflow:hidden;margin-top:6px;max-width:320px}
.erfbar i{display:block;height:100%;background:linear-gradient(90deg,var(--spark),var(--mint));transition:width .3s}
.erfstufen{display:flex;gap:4px;margin-top:5px}
.erfstufen b{width:20px;height:20px;border-radius:5px;background:rgba(242,245,255,.12);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.erfstufen b.on{background:var(--mint);color:var(--ink)}
.kathead{margin:16px 0 2px;font-family:var(--display);font-size:17px;color:var(--signal)}
.kathead:first-child{margin-top:4px}
/* Rezeptur */
.rez{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.rezl{flex:1;min-width:340px}
.rezr{width:290px;flex-shrink:0;background:rgba(242,245,255,.05);border:1px solid var(--line);border-radius:12px;padding:14px}
.rezfeld{margin-bottom:12px}
.rezfeld>label{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:4px}
.rezwahl{display:flex;gap:5px;flex-wrap:wrap}
.rezwahl button{background:rgba(242,245,255,.10);color:var(--snow);font-size:15px;padding:7px 11px;border-radius:8px;text-align:left}
.rezwahl button.on{background:var(--signal);color:var(--ink)}
.rezwahl button:disabled{opacity:.3}
.farbw{display:flex;gap:5px;flex-wrap:wrap}
.farbw button{width:30px;height:30px;border-radius:7px;padding:0;border:2px solid transparent}
.farbw button.on{border-color:var(--snow);box-shadow:0 0 0 2px rgba(255,210,63,.5)}
.rezwert{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:16px}
.rezwert b{font-variant-numeric:tabular-nums}
.rezwert.gross{font-size:19px;border-bottom:2px solid var(--signal)}
.rezwert.gross b{font-family:var(--display);color:var(--signal)}
.rezinfo{font-size:14px;color:var(--muted);line-height:1.35;margin:8px 0 12px}
#rezName{width:100%;font-family:var(--ui);font-size:18px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--snow)}
#rezName:focus{outline:2px solid var(--signal)}
body.compact .rezr{width:100%}
body.compact .rezl{min-width:0}
body.compact .spark{width:74px;height:24px}
body.compact .mkcol{min-width:74px}
.ok{color:var(--mint)!important}.warn{color:var(--signal)!important}.no{color:#ffab9f!important}
.lfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
.lfoot-r{justify-content:flex-end}
#korbOv{z-index:24}
#korbOv .card{max-width:min(860px,94vw);padding:0;overflow:hidden;display:flex;flex-direction:column;background:#0f1530}
.ksum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ksum b{font-size:17px}.ksum small{display:block;color:var(--muted);font-size:14px}
.ksum .price{font-size:19px}
.ksum.total .price{font-size:26px;color:var(--signal)}
.lfoot small{color:var(--muted);font-size:15px}
.lfoot button{white-space:nowrap}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:19px}
.sumrow span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.sumrow.big{font-size:22px;border-bottom:2px solid var(--signal)}
.sumrow.big span:last-child{font-family:var(--display);font-weight:400}
.sumhead{margin:14px 0 2px;color:var(--muted);font-size:16px;font-weight:700}
h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px;color:var(--signal);line-height:1.1}
#cash .card{max-width:500px}
.cashtop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.cashtop div{background:rgba(242,245,255,.07);border-radius:10px;padding:8px 12px}
.cashtop small{display:block;color:var(--muted);font-size:15px}
.cashtop b{font-family:var(--display);font-weight:400;font-size:22px}
.cashtop .due{background:rgba(255,210,63,.14)}
.cashtop .due b{color:var(--signal)}
.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.denoms button{padding:12px 4px;font-size:19px;color:var(--ink)}
.n50{background:#f2a25a}.n20{background:#7aa9df}.n10{background:#e58c85}.n5{background:#b9bec8}
.c2,.c1{background:#e3cf8a;border-radius:999px}.c50,.c20,.c10{background:#e8c65a;border-radius:999px}.c5,.c2c,.c1c{background:#d08a5a;border-radius:999px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;max-width:420px;justify-content:flex-end}
/* Katalogzeile mit Bild */
.pic{width:112px;height:76px;border-radius:9px;flex-shrink:0;border:1px solid var(--line);background:#0b1020;display:block}
.row .pic{margin-right:4px}
body.compact .pic{width:78px;height:54px}
.dekorow{align-items:flex-start}
.dekorow .rm{max-width:300px}
.sw{width:42px;height:42px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--signal);box-shadow:0 0 0 2px rgba(255,210,63,.35)}
.sw:disabled{opacity:.28}
#levelup .card{max-width:460px;text-align:center}
#deal .card{max-width:520px}
#dLine{font-size:19px;line-height:1.3;margin:6px 0 12px;color:var(--spark);min-height:24px}
#dRounds{font-size:15px;color:var(--muted);margin:10px 0 6px}
#dHaggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#dHaggle button{background:rgba(242,245,255,.12);color:var(--snow);font-size:16px;padding:8px 12px}
#grav .card{max-width:420px;text-align:center}
#gravIn{width:100%;font-family:var(--display);font-size:24px;text-align:center;padding:12px;border-radius:10px;border:2px solid var(--line);background:rgba(242,245,255,.08);color:var(--snow);margin:6px 0 4px}
#gravIn:focus{outline:none;border-color:var(--signal)}
#gravHint{font-size:15px;color:var(--muted);margin-bottom:14px}
#phone{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 92px);background:var(--mint);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:700;font-size:17px;animation:ring .7s ease-in-out infinite}
#phone:empty{display:none}
@keyframes ring{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
#order{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--spark);border-radius:10px;padding:7px 12px;font-size:16px;font-weight:600;line-height:1.3;max-width:280px}
#order:empty{display:none}
body.compact #phone{font-size:14px;padding:6px 11px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 132px)}
body.compact #order{font-size:13px;padding:5px 9px;max-width:210px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 4px)}
body.compact #deal .card,body.compact #grav .card{padding:14px}
body.compact #dLine{font-size:16px;margin:4px 0 8px}
body.compact #gravIn{font-size:19px;padding:9px}
#luList{text-align:left;margin:10px 0 0}
@media (max-width:600px){
  #clock{min-width:128px;padding:6px 10px} #hTime{font-size:21px} #hDate{font-size:16px} #hMoney{font-size:19px}
  .tag{padding:6px 12px 6px 24px} #tip{font-size:15px;max-width:44vw} #prompt{font-size:16px} .meter{width:128px}
  .steps button{padding:7px 7px;font-size:15px} .price{min-width:74px;font-size:17px} .row{flex-wrap:wrap}
  .denoms button{font-size:17px;padding:11px 2px} .tabs button{font-size:15px;padding:7px 10px}
}

/* ---- Kompaktmodus: flaches HUD auf niedrigen Bildschirmen ---- */
body.compact .tl{gap:6px;align-items:center;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top))}
body.compact .tlcol{display:flex;flex-direction:row;align-items:center;gap:6px}
body.compact #clock{flex-direction:row;align-items:baseline;gap:7px;padding:3px 9px;min-width:0;border-radius:8px}
body.compact #hDate{order:0}
body.compact #hTime{font-size:16px;line-height:1.1}
body.compact #hDate{font-size:12px;font-weight:600}
body.compact #hStatus{font-size:11px}
body.compact .meter{margin-top:0;width:62px}
body.compact .meter span{font-size:10px;line-height:1.1}
body.compact #mHype span{display:none}
body.compact .bar{height:5px;margin-top:1px}
body.compact .tag{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 18px;border-radius:5px 14px 14px 5px;transform:rotate(-1.5deg);box-shadow:0 2px 0 rgba(0,0,0,.35)}
body.compact .tag::before{left:6px;width:6px;height:6px;margin-top:-3px}
body.compact #hMoney{font-size:16px}
body.compact #hXpTxt{font-size:10px}
body.compact .xpbar{height:5px}
body.compact #hLoan{font-size:11px}
body.compact #hLevel{position:static;transform:none;order:-1;font-size:10px;padding:1px 6px;border-radius:4px}
body.compact #tip{font-size:12px;line-height:1.25;padding:5px 8px;max-width:min(210px,31vw);border-left-width:3px;overflow:hidden;max-height:calc(3.75em + 10px)}
body.compact #staff{display:none}
body.compact .tl{max-width:calc(100% - 215px)}
body.compact #staff{top:calc(max(8px,env(safe-area-inset-top)) + 46px);gap:3px}
body.compact .chip{font-size:11px;padding:1px 8px}
body.compact #prompt{font-size:14px;padding:4px 9px;top:calc(50% + 16px)}
body.compact #mode{font-size:12px;padding:3px 10px;top:calc(max(8px,env(safe-area-inset-top)) + 42px)}
body.compact #carry{font-size:13px;padding:4px 10px}
body.compact #tool{display:none}
body.compact .toast{font-size:13px;padding:4px 10px}
body.compact .toast.money,body.compact .toast.lvl{font-size:14px}
body.compact #btnAct{width:64px;height:64px;font-size:15px;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));box-shadow:0 3px 0 rgba(0,0,0,.35)}
body.compact #btnDrop{width:50px;height:50px;font-size:11px;right:calc(84px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom))}
body.compact #btnTool{width:42px;height:42px;font-size:11px;right:calc(14px + env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom))}
body.compact #btnMove{width:42px;height:42px;font-size:11px;right:calc(80px + env(safe-area-inset-right));bottom:calc(66px + env(safe-area-inset-bottom))}
body.compact #btnPda{width:42px;height:42px;font-size:11px;right:calc(14px + env(safe-area-inset-right));bottom:calc(130px + env(safe-area-inset-bottom))}
body.compact.coarse #carry{bottom:calc(10px + env(safe-area-inset-bottom));left:calc(50% - 60px);transform:none}
body.compact.coarse #toasts{bottom:calc(48px + env(safe-area-inset-bottom))}
body.compact .card{padding:14px;border-radius:12px}
body.compact .logo{width:min(210px,40vw);margin-bottom:6px}
body.compact .lead{font-size:16px;margin:6px 0 10px}
body.compact .ctrl{font-size:14px;margin:0 0 12px}
body.compact h2{font-size:22px}
body.compact button{font-size:16px;padding:8px 13px}
body.compact .rm b{font-size:17px}
body.compact .rm small{font-size:14px}
body.compact .row{padding:9px 0}
body.compact .sumrow{font-size:16px;padding:5px 0}
body.compact .sumrow.big{font-size:18px}
body.compact .lbody{padding:2px 12px 8px}
body.compact .lhead{padding:8px 12px}
body.compact .lfoot{padding:8px 12px}
body.compact .tabs button{font-size:15px;padding:6px 9px}
body.compact .denoms button{font-size:15px;padding:9px 2px}
body.compact .cashtop b{font-size:18px}
.pdacard{max-width:460px;background:#07150f;border:1px solid rgba(108,242,168,.28);font-family:var(--ui)}
.pdahead2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 10px}
.pdahead2 b{font-family:var(--display);font-weight:400;font-size:19px;color:#8ef0a8;line-height:1.15}
.pdahead2 button{padding:6px 11px;font-size:15px}
.pdarow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(108,242,168,.14);font-size:17px;color:#cfe8da}
.pdarow b.pdaprice{font-family:var(--display);font-weight:400;font-size:24px;color:#3dff7a}
.pdahead{margin:12px 0 4px;color:#6cf2a8;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pdasteps{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.pdasteps button{padding:8px 10px;font-size:16px;background:rgba(108,242,168,.14);color:#e8fff2}
.pdasteps button.ghost{background:transparent;border:1px solid rgba(108,242,168,.35)}
body.compact .pdacard{padding:12px}
body.compact .pdarow{font-size:14px;padding:4px 0}
body.compact .pdasteps button{padding:6px 8px;font-size:14px}
body.compact .pdahead2 b{font-size:16px}
@media (prefers-reduced-motion: reduce){ .toast{animation:none} .bar i{transition:none} #tip{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="touch">
  <div id="look"></div>
  <div id="joy"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button class="tbtn" id="btnMove" aria-label="Umbaumodus">Umbau</button>
  <button class="tbtn" id="btnPda" aria-label="Preisgerät">Preis</button>
  <button class="tbtn" id="btnTool" aria-label="Pfefferspray">Spray</button>
  <button class="tbtn" id="btnDrop" aria-label="Karton abstellen">Ablegen</button>
  <button class="tbtn" id="btnAct" aria-label="Aktion">Aktion</button>
</div>

<div id="hud">
  <div class="tl">
    <div class="tlcol">
      <div id="clock"><div id="hTime"></div><div id="hDate"></div><div id="hStatus"></div></div>
      <div class="meter" id="mHype"><span><i>Hype</i></span><div class="bar"><i id="hHype"></i></div></div>
    </div>
    <div class="tag"><div id="hLevel"></div><div id="hMoney"></div><div id="hXpWrap"><div class="xpbar"><i id="hXp"></i></div><small id="hXpTxt"></small></div><div id="hLoan"></div></div>
  </div>
  <div id="tip"></div>
  <div id="staff"></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="mode"></div>
  <div id="carry"></div>
  <div id="tool"></div>
  <div id="phone"></div>
  <div id="order"></div>
  <div id="toasts"></div>
</div>

<div class="ov show" id="start">
  <canvas id="startFx"></canvas>
  <div class="startInner">
    <img class="logo" id="logoImg" alt="">
    <div class="btns" id="startBtns"><button disabled>Lädt …</button></div>
    <div class="namebox" id="nameBox">
      <label for="shopInput">Wie soll dein Laden heißen?</label>
      <input id="shopInput" maxlength="22" autocomplete="off" spellcheck="false">
      <label for="sloganInput">Und dein Slogan?</label>
      <input id="sloganInput" maxlength="38" autocomplete="off" spellcheck="false">
      <div class="btns"><button id="nameGo">Laden aufschließen</button><button class="ghost" id="nameBack">Zurück</button></div>
    </div>
  </div>
</div>

<div class="ov" id="laptop"><div class="card">
  <div class="lhead"><b>Böllerladen OS</b><em id="lLevel"></em><span id="lMoney"></span></div>
  <div class="tabs" id="ltabs">
    <button data-tab="order">Bestellen</button><button data-tab="price">Preise &amp; Markt</button><button data-tab="liz">Sortiment</button><button data-tab="rez">Entwicklung</button><button data-tab="erf">Herausforderungen</button><button data-tab="up">Ausbau</button><button data-tab="einr">Einrichtung</button><button data-tab="markt">Marketing</button><button data-tab="deko">Deko</button><button data-tab="staff">Personal</button><button data-tab="bank">Bank</button><button data-tab="stats">Bericht</button><button data-tab="shop">Laden</button>
  </div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot lfoot-r"><button class="ghost" id="lclose">Laptop zuklappen</button><button id="lKorb">Warenkorb anzeigen</button></div>
</div></div>
<div class="ov" id="korbOv"><div class="card korbcard">
  <div class="lhead"><b>Warenkorb</b><em id="korbCount"></em><span id="korbSum"></span></div>
  <div class="lbody" id="korbBody"></div>
  <div class="lfoot lfoot-r" id="korbFoot"></div>
</div></div>

<div class="ov" id="cash"><div class="card">
  <h2>Bargeld</h2>
  <div class="cashtop">
    <div><small>Summe</small><b id="cTotal"></b></div>
    <div><small>Kunde gibt</small><b id="cGiven"></b></div>
    <div class="due"><small>Rückgeld fällig</small><b id="cDue"></b></div>
    <div><small>Du gibst zurück</small><b id="cBack"></b></div>
  </div>
  <div class="denoms" id="denoms"></div>
  <div class="btns"><button class="ghost" id="cReset">Zurücksetzen</button><button id="cDone">Rückgeld geben</button></div>
</div></div>

<div class="ov" id="summary"><div class="card">
  <h2 id="sTitle"></h2><p class="lead" id="sText"></p><div id="sRows"></div>
  <div class="btns" style="margin-top:16px"><button id="sBtn"></button></div>
</div></div>

<div class="ov" id="levelup"><div class="card">
  <h2 id="luTitle"></h2><p class="lead" id="luText"></p><div id="luList"></div>
  <div class="btns" style="margin-top:16px;justify-content:center"><button id="luBtn">Weiter</button></div>
</div></div>

<div class="ov" id="deal"><div class="card">
  <h2 id="dTitle"></h2>
  <p id="dLine"></p>
  <div id="dRows"></div>
  <div id="dRounds"></div>
  <div id="dHaggle">
    <button data-step="0.05">5 % mehr fordern</button>
    <button data-step="0.1">10 %</button>
    <button data-step="0.2">20 %</button>
  </div>
  <div class="btns"><button id="dAccept">Abschließen</button><button class="ghost" id="dDecline">Ablehnen</button></div>
</div></div>

<div class="ov" id="grav"><div class="card">
  <h2>Gravur</h2>
  <p class="lead" style="margin:4px auto 8px">Was soll auf die Rakete?</p>
  <input id="gravIn" maxlength="22" placeholder="Name oder Spruch" autocomplete="off" spellcheck="false">
  <div id="gravHint">Maximal 22 Zeichen</div>
  <div class="btns" style="justify-content:center"><button id="gravOk">Aufdrucken</button><button class="ghost" id="gravCancel">Abbrechen</button></div>
</div></div>

<div class="ov" id="pda"><div class="card pdacard">
  <div class="pdahead2"><b id="pdaTitle"></b><button class="ghost" id="pdaClose">Schließen</button></div>
  <div id="pdaBody"></div>
</div></div>

<div class="ov" id="pause"><div class="card" style="text-align:center">
  <h2>Pause</h2><p class="lead" style="margin:8px auto 16px">Klick, um weiterzuspielen.</p><button id="pBtn">Weiterspielen</button>
</div></div>

/* Der Laden hat dauerhaft geöffnet. S.day zählt einfach weiter,
   daraus wird ein Datum berechnet. Sonntag ist Ruhetag. */
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MSHORT=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MLEN=[31,28,31,30,31,30,31,31,30,31,30,31];
const WDAY=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WSHORT=['So','Mo','Di','Mi','Do','Fr','Sa'];
const START_DOY=273;            // 1. Oktober
function dateInfo(n){
  const t=START_DOY+(n|0), y=1+Math.floor(t/365); let doy=t%365, m=0;
  while(doy>=MLEN[m]){ doy-=MLEN[m]; m++; }
  return {y,m,d:doy+1,doy:t%365,wd:(t+5)%7};
}
function dateStr(n){ const i=dateInfo(n); return `${WDAY[i.wd]}, ${i.d}. ${MONTHS[i.m]}`; }
function dateShort(n){ const i=dateInfo(n); return `${WSHORT[i.wd]} ${i.d}.${i.m+1}.`; }
function isSunday(n){ return dateInfo(n).wd===0; }
/* Nachfrage übers Jahr: Silvester ist der Gipfel, dazwischen läuft es weiter */
function seasonInfo(n){
  const i=dateInfo(n), m=i.m, d=i.d;
  if(m===11&&d>=26) return [1.5+(d-26)*0.34,'Silvestergeschäft'];
  if(m===11&&d>=20) return [1.25,'Weihnachtswoche'];
  if(m===11) return [1.1,'Vorweihnachtszeit'];
  if(m===0&&d===1) return [1.35,'Neujahr, Restverkauf'];
  if(m===0&&d<=14) return [0.80,'Ruhige Januartage'];
  if(m===0||m===1) return [0.72,'Tiefste Nebensaison'];
  if(m===2) return [0.80,'Frühjahr, wenig los'];
  if(m===3&&d>=25) return [1.45,'Walpurgisnacht steht an'];
  if(m===4&&d<=2) return [1.3,'Erster Mai'];
  if(m===3||m===4) return [0.9,'Frühling'];
  if(m===5) return [1.0,'Sommeranfang, Feste'];
  if(m===6||m===7) return [1.15,'Sommerfeste und Hochzeiten'];
  if(m===8) return [0.88,'Spätsommer'];
  if(m===9&&d>=28) return [1.25,'Halloween'];
  if(m===9) return [0.92,'Oktober'];
  return [0.86,'November, ruhig'];
}
const WDMULT=[0.55,0.82,0.84,0.9,1.0,1.28,1.35];
function dayMult(n){ const i=dateInfo(n); return seasonInfo(n)[0]*WDMULT[i.wd]; }
function silvesterNah(n){ const i=dateInfo(n); return i.m===11&&i.d>=26; }

/* =========================================================
   Stellplaetze im Laden. Die Basisflaeche bleibt genau wie
   bisher, die Ausbaustufen bringen Wandreihen, Mittelgondeln
   und Eckregale dazu.
   art: wand (Standardregale), insel (Gondeln), ecke (Eckregale)
   ========================================================= */
function mkSlots(){
  const A=[];
  const add=(x,z,o)=>A.push(Object.assign({x:Math.round(x*100)/100,z:Math.round(z*100)/100},o||{}));
  const reihe=(x0,n,dx,z,o)=>{ for(let i=0;i<n;i++) add(x0+i*dx,z,o); };
  const spalte=(z0,n,dz,x,o)=>{ for(let i=0;i<n;i++) add(x,z0+i*dz,o); };
  /* --- Basis, unveraendert --- */
  reihe(-6.4,5,2.2,-5.5);
  reihe(-6.4,5,2.2,-1.2);

  [-11.0,-14.1].forEach(x=>add(x,2.75,0,2.84,'lager_gross'));

  [-7.6,-11.6,-15.6,-19.6,-23.6].forEach(z=>{
    add(-10.2,z,0,6.4,'lager_sued'); add(-17.6,z,0,6.4,'lager_sued'); });
  /* Halle West, 6,4 m - die grosse Halle an den drei Rampen */

}

/* Der rohe Marktwert, auf den die Erwartung noch zulaeuft */
function marktZiel(t){ return r2(P[t].market*miOf(t)*inflOf()); }
/* Positiv heisst: Einkauf ist gerade guenstiger als die Erwartung der Kunden */
function marktLuecke(t){ const e=meOf(t), m=miOf(t); return Math.round((e/m-1)*100); }
function costOf(t){ return r2(P[t].cost*miOf(t)*inflOf()); }
/* Veraenderung zum Vortag in Prozent */
function marktDelta(t){
  const h=(S&&S.mh&&S.mh[t])||[]; if(h.length<2) return 0;
  const a=h[h.length-2], b=h[h.length-1];
  return a>0?Math.round((b/a-1)*1000)/10:0;
}
/* Wie weit liegt der Preis ueber oder unter dem Normalniveau */
function marktNiveau(t){ return Math.round((meOf(t)-1)*100); }
function marktPhase(t){ const r=(S&&S.reg&&S.reg[t])?REGIME[S.reg[t].k]:null; return r||REGIME.ruhig; }
function marktSchock(t){ return S&&S.schock?S.schock[t]:null; }
function marktLabel(t){
  const n=marktNiveau(t);
  if(n<=-22) return ['ok','Sehr günstig eingekauft'];
  if(n<=-9)  return ['ok','Günstiger als sonst'];
  if(n<9)    return ['','Normales Niveau'];
  if(n<24)   return ['warn','Teurer als sonst'];
  return ['no','Deutlich überteuert'];
}
/* Das am staerksten aus dem Rahmen gefallene Produkt (r=1 teuer, -1 guenstig) */
function marktExtrem(r){
  let best=null, bv=0;
  ORDER.forEach(t=>{ if(P[t].noOrder||!isUnlocked(t)) return;
    const n=marktNiveau(t)*r; if(n>bv){ bv=n; best=t; } });
  return bv>=8?best:null;
}
/* Wo lohnt sich der Einkauf gerade am meisten */
function marktChance(){
  let best=null, bv=6;
  ORDER.forEach(t=>{ if(P[t].noOrder||!isUnlocked(t)) return;
    const l=marktLuecke(t); if(l>bv){ bv=l; best=t; } });
  return best;
}
/* Durchschnittliches Marktniveau ueber alle freigeschalteten Waren */
function marktSchnitt(){
  let n=0,s=0;
  ORDER.forEach(t=>{ if(P[t].noOrder) return; if(!isUnlocked(t)) return; n++; s+=miOf(t); });
  return n?s/n:1;
}

/* Ein Tag Marktbewegung. Gibt die Meldungen des Tages zurueck. */
function rollMarkt(){
  marktInit();
  const news=[];
  /* Inflation: meistens ein kleiner Schritt, selten ein groesserer */
  let inf=rand(0.0008,0.0028);
  if(Math.random()<0.05) inf+=rand(0.003,0.009);
  S.infl=r3(clamp(inflOf()*(1+inf),1,4));
  ORDER.forEach(t=>{
    const reg=S.reg[t];
    reg.t--;
    if(reg.t<=0) S.reg[t]=regimeNeu(t);
    const r=REGIME[S.reg[t].k], v=volaOf(t);
    /* laufender Schock haelt den Markt in Bewegung */
    const sch=S.schock[t];
    if(sch){ sch.t--; if(sch.t<=0) delete S.schock[t]; }
    let mi=miOf(t);
    mi+=(1-mi)*r.rev + gauss()*0.045*v*r.amp;
    /* Neuer Schock? Nur bei Waren, die ueberhaupt schwanken. */
    if(!sch&&v>=0.48&&Math.random()<0.012*v){
      const knapp=Math.random()<0.55;
      const f=knapp?1+rand(0.28,0.80):1-rand(0.18,0.40);
      mi*=f;
      S.schock[t]={k:knapp?'knapp':'schwemme',t:Math.round(rand(3,9))};
      S.reg[t]={k:'sturm',t:Math.round(rand(3,8))};
      news.push({t,knapp,text:knapp?pick(SCHOCK_KNAPP):pick(SCHOCK_SCHWEMME)});
    }
    S.mi[t]=r3(clamp(mi,MI_MIN,MI_MAX));
    /* Erwartung der Kunden laeuft traege nach */
    S.me[t]=r3(clamp(meOf(t)+(S.mi[t]-meOf(t))*0.26,MI_MIN,MI_MAX));
    const h=S.mh[t]; h.push(S.me[t]); if(h.length>16) h.shift();
  });
  S.mkt=r2(clamp(marktSchnitt(),0.7,1.5));
  S.news=news.slice(0,4);
  return S.news;
}

  raketen:['raketenklein','raketen','raketengold','furzrakete','blanko','gravur'],

function gruppeVon(t){
  for(const g in GRUPPE) if(GRUPPE[g].indexOf(t)>=0) return g;
  const p=P[t];
  if(p&&p.eigen) return p.gruppe||'eigene';
  return 'sonstiges';
}

/* --------------------------------------------------------
   Zaehler
   -------------------------------------------------------- */
function statInit(){
  S.stat=S.stat||{};
  S.erf=S.erf||{};                 /* id -> hoechste abgeholte Stufe */
  S.gesehen=Array.isArray(S.gesehen)?S.gesehen:[];
}
function stat(id){ return (S&&S.stat&&S.stat[id])||0; }
/* Ein Zaehler steigt. Wird eine Stufe erreicht, meldet sich das Spiel. */
function statAdd(id,n){
  if(!S||!S.stat) return;
  S.stat[id]=(S.stat[id]||0)+(n||1);
  erfolgPruefen(id);
}
/* Bestwert: nur nach oben */
function statRekord(id,wert){
  if(!S||!S.stat) return;
  if(wert>(S.stat[id]||0)){ S.stat[id]=wert; erfolgPruefen(id); }
}
/* Ein verkaufter Artikel zaehlt auf mehrere Zaehler ein */
function statVerkauf(t,n){
  n=n||1;
  /* gruppeVon liefert fuer eigene Ware bereits 'eigene', sonst
     wuerde der Zaehler doppelt laufen. */
  statAdd('v_'+gruppeVon(t),n);
}
/* Ein gesehenes Bruchbild wird fuer die eigene Entwicklung freigeschaltet */
function bruchGesehen(eff){
  if(!S||!Array.isArray(S.gesehen)||!eff) return;
  /* Nur was sich auch verbauen laesst, wird vermerkt. Die Furzwolke
     hat feste Farben und passt nicht in den Farbwaehler. */
  if(typeof BRUCH==='undefined'||!BRUCH[eff]) return;
  if(S.gesehen.indexOf(eff)>=0) return;
  S.gesehen.push(eff);
  S.stat.brucharten=S.gesehen.length;
  erfolgPruefen('brucharten');
}

/* --------------------------------------------------------
   Freischaltung und Fortschritt
   -------------------------------------------------------- */
function erfOffen(e){
  if(!e.req) return true;
  if(e.req.up&&!(S.up&&S.up[e.req.up])) return false;
  if(e.req.liz&&!hatLizenz(e.req.liz)) return false;
  return true;
}
function erfStufe(e){ return (S&&S.erf&&S.erf[e.id])||0; }
function erfStand(e){ return stat(e.id); }
function erfZiel(e){ const s=erfStufe(e); return s<e.stufen.length?e.stufen[s]:null; }
function erfFertig(e){ return erfStufe(e)>=e.stufen.length; }
function erfAnteil(e){
  const z=erfZiel(e); if(z===null) return 1;
  const s=erfStufe(e), vor=s>0?e.stufen[s-1]:0;
  return clamp((erfStand(e)-vor)/Math.max(1,z-vor),0,1);
}
/* Restposten statt Bargeld: manchmal gibt es ein Angebot statt Geld */
function erfBelohnen(e,stufe){
  const geld=e.lohn[stufe]||0;
  /* Jede dritte Stufe kommt als Warengutschrift herein - das fuehlt
     sich anders an und greift weniger in die Kasse ein. */
  if(stufe===1&&!e.geld){
    S.gutschrift=r2((S.gutschrift||0)+geld);
    toast(`${e.name}: ${eur(geld)} Warengutschrift beim Großhandel.`,'money');
  } else {
    S.money=r2(S.money+geld);
    DS.praemien=r2((DS.praemien||0)+geld);
    toast(`${e.name}: ${eur(geld)} Prämie.`,'money');
  }
  addXP(Math.round(geld/10)+25,'Herausforderung');
  sfx.level();
}
function erfolgPruefen(id){
  const e=ERFOLGE.find(x=>x.id===id);
  if(!e||!erfOffen(e)||erfFertig(e)) return;
  let s=erfStufe(e);
  while(s<e.stufen.length&&erfStand(e)>=e.stufen[s]){
    S.erf[e.id]=++s;
    erfBelohnen(e,s-1);
  }
}
/* Nach dem Laden einmal alles nachziehen, ohne Belohnungen auszuschuetten */
function erfNachziehen(){
  statInit();
  ERFOLGE.forEach(e=>{
    if(!erfOffen(e)) return;
    let s=erfStufe(e);
    while(s<e.stufen.length&&erfStand(e)>=e.stufen[s]) s++;
    S.erf[e.id]=s;
  });
}
function erfOffeneAnzahl(){ return ERFOLGE.filter(e=>erfOffen(e)&&!erfFertig(e)).length; }
function erfGeschafft(){ return ERFOLGE.reduce((a,e)=>a+erfStufe(e),0); }
function erfGesamt(){ return ERFOLGE.reduce((a,e)=>a+e.stufen.length,0); }

/* --------------------------------------------------------
   Die Formel. Sie muss stimmen, sonst bastelt sich jeder das
   perfekte Produkt: Der Verkaufswert folgt aus den Bestandteilen,
   und teuer aussehende Effekte haben teure Bestandteile.
   -------------------------------------------------------- */
function rezeptWow(r){
  const tr=traegerVon(r.traeger);
  const b=BRUCH[r.eff]||BRUCH.kugel;
  let w=b.wow*tr.kal*(0.85+Math.log2(1+tr.schuss)*0.24);
  /* Zwei verschiedene Farben wirken staerker als eine */
  if(r.A!==r.B) w*=1.06;
  const fa=farbVon(r.A), fb=farbVon(r.B);
  w*=1+(fa.auf+fb.auf)*0.5;
  /* Eine zweite Stufe ist der groesste einzelne Sprung */
  if(r.eff2){ const b2=BRUCH[r.eff2]||BRUCH.kugel; w*=1.18+b2.wow*0.14; }
  return w;
}
function rezeptKosten(r){
  const tr=traegerVon(r.traeger);
  const b=BRUCH[r.eff]||BRUCH.kugel;
  const fa=farbVon(r.A), fb=farbVon(r.B);
  let c=tr.basis*(0.72+b.klasse*0.19)*(1+(fa.auf+fb.auf)*0.62);
  if(r.eff2){ const b2=BRUCH[r.eff2]||BRUCH.kugel; c*=1.22+b2.klasse*0.06; }
  return r2(c);
}
/* Der Marktpreis ergibt sich aus dem Wow-Wert, nicht aus freier Eingabe */
function rezeptMarkt(r){
  const k=rezeptKosten(r), w=rezeptWow(r);
  return r2(k*(1.75+w*0.42));
}
function rezeptHype(r){ return Math.round(rezeptWow(r)*traegerVon(r.traeger).schuss*3.2+6); }
function rezeptDauer(r){ return traegerVon(r.traeger).zeit+(r.eff2?1:0); }
/* Einmalige Entwicklungskosten: der Deckel gegen Durchprobieren */
function rezeptEntwicklung(r){
  const tr=traegerVon(r.traeger);
  return Math.round((320+tr.basis*95)*(1+(BRUCH[r.eff]||BRUCH.kugel).klasse*0.22)*(r.eff2?1.45:1));
}
function rezeptGueltig(r){
  if(!r||!r.traeger||!r.eff) return false;
  if(!traegerOffen(traegerVon(r.traeger))) return false;
  if(!bruchOffen(r.eff)) return false;
  if(r.eff2&&!bruchOffen(r.eff2)) return false;
  return true;
}

  const tr=traegerVon(e.traeger);

  const b=BRUCH[e.eff]||BRUCH.kugel;
  return {

function eigenesEintragen(e){
  if(P[e.id]) return P[e.id];
  P[e.id]=rezeptProdukt(e);
  if(ORDER.indexOf(e.id)<0) ORDER.push(e.id);
  VOLA[e.id]=0.55;

}

function box(w,h,d,m,x,y,z,parent,shadow){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); if(HIQ&&shadow!==false){ o.castShadow=true; o.receiveShadow=true; } (parent||scene).add(o); return o; }
/* Abgeschrägte Kanten: fängt Licht wie ein echtes Möbelstück */
const _rbCache={};
function roundedBoxGeo(w,h,d,r,seg){
  seg=seg||(HIQ?3:2);
  r=Math.min(r,w/2-1e-4,h/2-1e-4,d/2-1e-4);
  const key=[w,h,d,r,seg].map(v=>Math.round(v*1e4)).join('_');
  if(_rbCache[key]) return _rbCache[key];
  const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg), pos=g.attributes.position;
  const ix=w/2-r, iy=h/2-r, iz=d/2-r;
  for(let i=0;i<pos.count;i++){
    const vx=pos.getX(i), vy=pos.getY(i), vz=pos.getZ(i);
    const cx=clamp(vx,-ix,ix), cy=clamp(vy,-iy,iy), cz=clamp(vz,-iz,iz);
    const dx=vx-cx, dy=vy-cy, dz=vz-cz, l=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(l>1e-6){ const k=r/l; pos.setXYZ(i,cx+dx*k,cy+dy*k,cz+dz*k); }
  }
  g.computeVertexNormals();
  if(Object.keys(_rbCache).length<600) _rbCache[key]=g;
  return g;
}
function rbox(w,h,d,r,m,x,y,z,parent,shadow){
  const o=new THREE.Mesh(roundedBoxGeo(w,h,d,r),m); o.position.set(x,y,z);
  if(HIQ&&shadow!==false){ o.castShadow=true; o.receiveShadow=true; }
  (parent||scene).add(o); return o;
}
/* Wie box(), aber mit gefasten Kanten, wo es sich lohnt.
   Texturierte und unsichtbare Flächen bleiben einfache Boxen. */
function bbox(w,h,d,m,x,y,z,parent,shadow){
  const mn=Math.min(w,h,d);
  if(!m||m.map||m===hitM||m.transparent||mn<0.012) return box(w,h,d,m,x,y,z,parent,shadow);
  return rbox(w,h,d,Math.min(0.02,mn*0.17),m,x,y,z,parent,shadow);
}

let postT=0;
/* Der Schattenwurf der Sonne deckt nur einen Ausschnitt ab. Solange
   der Laden zwei Raeume gross war, reichte ein fester Kasten um den
   Nullpunkt; auf ueber tausend Quadratmetern lag der halbe Laden
   ausserhalb - und was ausserhalb liegt, bekommt volle Sonne, auch
   unter dem Dach. Deshalb laeuft der Kasten jetzt mit dem Spieler mit,
   gerastert, damit die Schattenkanten nicht flimmern. */
let _sunX=1e9, _sunZ=1e9;
function sonneNachfuehren(){
  if(!sun.castShadow) return;
  const r=2, tx=Math.round(pl.x/r)*r, tz=Math.round(pl.z/r)*r;
  if(tx===_sunX&&tz===_sunZ) return;
  _sunX=tx; _sunZ=tz;
  sun.position.set(tx-18,30,tz+26);
  sun.target.position.set(tx,0,tz);
  sun.target.updateMatrixWorld();
  sun.shadow.camera.updateProjectionMatrix();
}
function renderFrame(dt){

    postT+=dt||0.016;

    quadMesh.material=matBright; matBright.uniforms.tDiffuse.value=rtScene.texture;
    renderer.setRenderTarget(rtA); renderer.render(quadScene,quadCam);
    quadMesh.material=matBlur;
    matBlur.uniforms.tDiffuse.value=rtA.texture; matBlur.uniforms.dir.value.set(1/bw,0);
    renderer.setRenderTarget(rtB); renderer.render(quadScene,quadCam);
    matBlur.uniforms.tDiffuse.value=rtB.texture; matBlur.uniforms.dir.value.set(0,1/bh);
    renderer.setRenderTarget(rtA); renderer.render(quadScene,quadCam);
    quadMesh.material=matComp;
    matComp.uniforms.tDiffuse.value=rtScene.texture;
    matComp.uniforms.tBloom.value=rtA.texture;

function burst(g,x,y,r,c,n){

function schild(x,y,z,w,h,mat,steelM){
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  const px=w/2-0.06;
  for(const sx of [-px,px]){
    const p2=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,y+h/2,10),steelM);
    p2.position.set(sx,(y+h/2)/2,0); if(HIQ) p2.castShadow=true; g.add(p2);

    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,6),steelM);
    cap.position.set(sx,y+h/2,0); g.add(cap);
  }

  bbox(w+0.05,h+0.05,0.025,std(0x4a515c,{metalness:0.5,roughness:0.5}),0,y,-0.016,g,false);

}

function stationSlot(st,i){

function placeOnStation(st){
  const c=S.carrying; if(!c) return;
  const want=stationOf(c.type);
  if(!want){ toast('Damit kann man nichts zünden.','bad'); return; }
  if(want!==st.id){ toast(`${P[c.type].short} gehört auf: ${STATION_POS[want].name}.`,'bad'); return; }
  if(st.items.length>=st.cap){ toast('Die Station ist voll. Erst zünden.','bad'); return; }
  const sl=stationSlot(st,st.items.length);
  if(c.type==='gravur'){
    const m=makeEngraved(c.text||''); m.position.set(sl.x,sl.y+0.06,sl.z); m.rotation.y=sl.ry; scene.add(m);
    st.items.push({type:c.type,q:1,mesh:m,text:c.text});
  } else {
    const h=pools[c.type].add(mx(sl.x,sl.y,sl.z,sl.ry));
    st.items.push({type:c.type,q:c.q||1,h});
  }
  c.count--; S.tut.build=true; sfx.pop();
  if(c.count<=0){ S.carrying=null; toast('Karton leer.'); }
  updateCarry(); drawPult();
}

function firePult(){
  const n=placedCount();
  if(!n){ toast('Erst Ware auf Tisch oder Röhren stellen.'); return; }
  const m=testfeldMitte(); aimAt(m.x,m.z,0.24);
  const all=[]; for(const k in stations) stations[k].items.forEach(it=>all.push(it));
  all.sort((a,b)=>P[a.type].hype-P[b.type].hype);
  let t=0, duds=0;
  all.forEach(it=>{
    const dudChance=clamp((1-(it.q||1))*0.65,0,0.45);
    const dud=Math.random()<dudChance;
    if(dud) duds++;
    later(t,()=>{ if(dud) fizzle(it.type); else igniteType(it.type); });
    t+=Math.max(0.6,Math.min(2.4,P[it.type].hype*0.09));
  });
  const own=all.filter(x=>x.text);
  if(own.length) later(0.9,()=>toast(`„${own[0].text}" steigt auf.`,'money'));
  later(t+0.3,()=>{ if(duds) toast(duds===1?'Ein Blindgänger war dabei.':`${duds} Blindgänger. Billige Ware rächt sich.`,'bad'); });
  clearStations(); S.tut.launch=true; sfx.pop();
}

function gitterMat(rx,ry2){
  const t=tex(256,256,(g,W,H)=>{
    g.clearRect(0,0,W,H);
    g.strokeStyle='#6f7783'; g.lineCap='round';
    /* senkrechte Einzelstaebe */
    g.lineWidth=7;
    for(let x=16;x<W;x+=51){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
    /* waagerechte Doppelstaebe */
    g.lineWidth=6;
    for(let y=22;y<H;y+=51){
      g.strokeStyle='#848c98'; g.beginPath(); g.moveTo(0,y-5); g.lineTo(W,y-5); g.stroke();
      g.strokeStyle='#5f6672'; g.beginPath(); g.moveTo(0,y+5); g.lineTo(W,y+5); g.stroke();
    }
    /* Lichtkante oben auf den Staeben */
    g.strokeStyle='rgba(255,255,255,.3)'; g.lineWidth=2;
    for(let x=16;x<W;x+=51){ g.beginPath(); g.moveTo(x-2,0); g.lineTo(x-2,H); g.stroke(); }
  });
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; t.repeat.set(rx,ry2);
  return new THREE.MeshStandardMaterial({map:t,transparent:true,alphaTest:0.35,side:THREE.DoubleSide,metalness:0.55,roughness:0.45});
}
/* Ein Zaunlauf von (x0,z0) nach (x1,z1) */
function zaunLauf(x0,z0,x1,z1,h){
  const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz), ry=Math.atan2(dx,dz);
  const post=std(0x59606b,{metalness:0.6,roughness:0.42});
  const kappe=std(0x3c424d,{metalness:0.5,roughness:0.5});
  /* Sockelschiene */
  const sock=bbox(0.12,0.16,len,std(0x9a9ea6,{roughness:0.95}),(x0+x1)/2,0.08,(z0+z1)/2,null,false);
  sock.rotation.y=ry;
  /* Matte */
  const m=gitterMat(len,h-0.16);
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(len,h-0.16),m);
  panel.position.set((x0+x1)/2,0.16+(h-0.16)/2,(z0+z1)/2);
  panel.rotation.y=ry+Math.PI/2;
  scene.add(panel);
  /* Pfosten alle 2,5 m */
  const n=Math.max(2,Math.round(len/2.5));
  for(let i=0;i<=n;i++){
    const t2=i/n, x=x0+dx*t2, z=z0+dz*t2;
    const p2=bbox(0.07,h+0.06,0.07,post,x,(h+0.06)/2,z,null,false); p2.rotation.y=ry;
    bbox(0.1,0.025,0.1,kappe,x,h+0.09,z,null,false);
    for(const y of [0.42,h-0.3]){
      const sch=bbox(0.1,0.05,0.05,kappe,x,y,z,null,false); sch.rotation.y=ry;
    }
  }
}

function strassenlampe(x,z,dir){

  /* Leuchtenkopf mit Wanne */
  const kopf=new THREE.Group(); kopf.position.set(0,5.63,0.9); kopf.rotation.x=0.06; g.add(kopf);
  const geh=rbox(0.3,0.11,0.82,0.04,std(0x3b414c,{metalness:0.55,roughness:0.4}),0,0.06,0,kopf);
  bbox(0.26,0.03,0.74,std(0x71787f,{metalness:0.6}),0,0.005,0,kopf,false);
  const lm=new THREE.MeshStandardMaterial({color:LIN(0x23262e),emissive:LIN(0xffe9c0),emissiveIntensity:0});
  lampMats.push(lm);
  const wanne=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.045,0.7),lm);

  bbox(0.24,0.02,0.6,std(0x4d535d,{metalness:0.6}),0,0.125,0.02,kopf,false);
  col(x-0.22,x+0.22,z-0.22,z+0.22);
  return g;
}

function drawFassade(g,W,H,o,lit){

function buildHaus(x,z,w,d,h,o){
  const g=new THREE.Group(); g.position.set(x,0,z);
  /* Die texturierte Front liegt auf +z. Die Zeile steht aber jenseits der
     Strasse, also muss sie sich zum Laden drehen. */
  g.rotation.y=Math.PI; scene.add(g);
  const q=COARSE?0.5:1, px=Math.round(clamp(w*46,192,512)*q), py=Math.round(clamp(h*46,256,640)*q);
  const m=new THREE.MeshStandardMaterial({color:LIN(0xffffff),roughness:0.94,

  houseMats.push(m);

  if(HIQ){ b.castShadow=true; b.receiveShadow=true; } g.add(b);
  // Attika und Gesims
  bbox(w+0.34,0.3,d+0.34,std(0x5f584e,{roughness:1}),0,h+0.14,0,g);
  bbox(w+0.42,0.16,d+0.42,std(0x7a7266,{roughness:1}),0,h-0.16,0,g);
  bbox(w+0.1,0.1,d+0.1,std(0xe8ecf2,{roughness:1}),0,h+0.34,0,g,false);   // Schnee auf der Attika
  // Schornsteine, Antennen, Satellitenschüsseln
  const nch=1+Math.floor(Math.random()*2);
  for(let i=0;i<nch;i++){ const cx=rand(-w*0.3,w*0.3), cz=rand(-d*0.25,d*0.25), ch=rand(0.7,1.4);
    bbox(0.5,ch,0.5,std(0x7a4a3c,{roughness:1}),cx,h+ch/2,cz,g);
    bbox(0.62,0.1,0.62,std(0x4a4640),cx,h+ch+0.05,cz,g,false);
    bbox(0.5,0.06,0.5,std(0xe8ecf2),cx,h+ch+0.12,cz,g,false); }
  if(Math.random()<0.6){ const px2=rand(-w*0.35,w*0.35);
    bbox(0.05,rand(0.8,1.6),0.05,std(0x3a3f48),px2,h+0.8,-d*0.2,g,false);
    const dish=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,6,0,Math.PI*2,0,Math.PI*0.42),std(0xd8d8d2));
    dish.position.set(px2+0.1,h+1.2,-d*0.2); dish.rotation.x=1.1; g.add(dish); }
  /* --- Plastische Fassade: Sockel, Fensterbaenke, Schaufensterfront,
     Regenrinne und Fallrohr. Nimmt der Front das Kulissenhafte. --- */
  const zf=d/2;
  const stein=std(0x6f6a62,{roughness:0.96});
  
  /* Sockel */
  bbox(w+0.12,0.55,d+0.12,stein,0,0.275,0,g);
  bbox(w+0.16,0.07,d+0.16,std(0x8a857c,{roughness:0.9}),0,0.58,0,g,false);
  /* Erdgeschoss als echte Schaufensterfront */
  {
    const gfH=h*0.3, rahmen=std(0x2f3540,{metalness:0.3,roughness:0.5});
    const scheibe=new THREE.MeshStandardMaterial({color:LIN(0x2a3646),roughness:0.12,metalness:0.25,transparent:true,opacity:0.72});
    const bw=w*0.78;
    bbox(bw+0.16,0.22,0.22,rahmen,0,gfH+0.05,zf+0.1,g,false);          // Sturz
    bbox(bw+0.16,0.16,0.22,rahmen,0,0.62,zf+0.1,g,false);              // Brueste
    const np=Math.max(2,Math.round(bw/1.5));
    for(let i=0;i<=np;i++) bbox(0.1,gfH-0.5,0.2,rahmen,-bw/2+i*(bw/np),0.68+(gfH-0.5)/2,zf+0.1,g,false);
    const sc=bbox(bw,gfH-0.56,0.05,scheibe,0,0.7+(gfH-0.56)/2,zf+0.06,g,false);
    /* Eingangstuer seitlich */
    bbox(0.95,gfH-0.1,0.12,rahmen,w*0.34,(gfH-0.1)/2,zf+0.12,g,false);
    bbox(0.72,gfH-0.34,0.06,scheibe,w*0.34,(gfH-0.34)/2+0.1,zf+0.16,g,false);
    /* Leuchtkasten mit Ladenname */
    if(o.shop){
      const sm=new THREE.MeshStandardMaterial({color:LIN(0xf2efe6),roughness:0.7,
        emissive:LIN(0xffffff),emissiveIntensity:0,
        map:tex(512,96,(c,W2,H2)=>{ c.fillStyle=o.shopSign||'#2b3a5e'; c.fillRect(0,0,W2,H2);
          c.fillStyle='#f6f3ea'; c.textAlign='center'; c.textBaseline='middle';
          fitFont(c,o.shopName||'LADEN',W2-40,58,BUN); c.fillText(o.shopName||'LADEN',W2/2,H2/2+3); }),
        emissiveMap:tex(512,96,(c,W2,H2)=>{ c.fillStyle='#000'; c.fillRect(0,0,W2,H2);
          c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
          fitFont(c,o.shopName||'LADEN',W2-40,58,BUN); c.fillText(o.shopName||'LADEN',W2/2,H2/2+3); })});
      houseMats.push(sm);
      bbox(bw*0.92,0.42,0.14,sm,0,gfH+0.36,zf+0.14,g,false);
      bbox(bw*0.96,0.06,0.2,std(0x3a3f48),0,gfH+0.6,zf+0.15,g,false);
    }
  }
  /* Fensterbaenke und Leibungen passend zum Texturraster */
  {
    const gfH=h*0.3, upH=h-gfH-0.9, cw=w/o.cols, rh=upH/o.rows;
    const bank=std(0xd8d4cc,{roughness:0.9});
    for(let r=0;r<o.rows;r++) for(let c=0;c<o.cols;c++){
      const ww=cw*0.46;
      const x=-w/2+cw*(c+0.5);
      const y=h-0.9-rh*r-rh*0.2-rh*0.58;
      bbox(ww+0.16,0.07,0.16,bank,x,y-0.04,zf+0.06,g,false);
      bbox(ww+0.16,0.04,0.1,std(0xe8ecf2),x,y+0.01,zf+0.08,g,false);
      for(const sx of [-1,1]) bbox(0.07,rh*0.58,0.09,std(0xdad5cb,{roughness:0.95}),x+sx*(ww/2+0.05),y+rh*0.29,zf+0.04,g,false);
    }
  }
  /* Regenrinne und Fallrohr */
  {
    const zn=std(0x8f959e,{metalness:0.45,roughness:0.55});
    bbox(w+0.3,0.12,0.16,zn,0,h-0.3,zf+0.2,g,false);
    const fx=w/2-0.2;
    bbox(0.11,h-0.4,0.11,zn,fx,(h-0.4)/2,zf+0.16,g,false);
    bbox(0.15,0.13,0.15,zn,fx,h-0.38,zf+0.16,g,false);
    bbox(0.15,0.13,0.15,zn,fx,0.25,zf+0.16,g,false);
  }
  // Balkone
  if(o.balkon){ for(let i=0;i<o.balkonN;i++){ const by=h*0.42+i*h*0.22, bx=rand(-w*0.25,w*0.25);
    bbox(1.9,0.12,0.85,std(0xb9b2a6,{roughness:1}),bx,by,d/2+0.42,g);
    bbox(1.9,0.06,0.85,std(0xe8ecf2),bx,by+0.09,d/2+0.42,g,false);
    for(let k=0;k<7;k++) bbox(0.04,0.5,0.04,std(0x45505e,{metalness:0.4}),bx-0.85+k*0.28,by+0.31,d/2+0.83,g,false);
    bbox(1.9,0.05,0.05,std(0x45505e,{metalness:0.4}),bx,by+0.56,d/2+0.83,g,false); } }
  // Markise über dem Laden
  if(o.shop&&Math.random()<0.7){
    const mt=tex(128,64,(c,W,H)=>{ for(let i=0;i<8;i++){ c.fillStyle=i%2?o.shopSign:'#f2efe6'; c.fillRect(i*W/8,0,W/8,H); } });
    const aw=new THREE.Mesh(new THREE.BoxGeometry(w*0.8,0.08,1.2),new THREE.MeshStandardMaterial({map:mt,roughness:0.9}));
    aw.position.set(0,h*0.3+0.5,d/2+0.6); aw.rotation.x=-0.22; if(HIQ) aw.castShadow=true; g.add(aw);
    bbox(w*0.8,0.1,0.5,std(0xe8ecf2),0,h*0.3+0.62,d/2+0.35,g,false);
  }
  return g;
}
/* =========================================================
   Autos am Bordstein.
   Die Masse sind echte Fahrzeugmasse, keine geschaetzten: eine
   Limousine ist 4,62 m lang und 1,45 m hoch, nicht 1,84 m, und der
   Radstand betraegt 2,76 m. Vorher stand da ein zu hoher Kasten mit
   zu kurzem Radstand - das liest sich sofort als Spielzeug.
   Entscheidend ist ausserdem das Rad: eine Felge ist innen offen und
   dunkel, mit hellen Speichen und hellem Horn davor. Eine massive
   helle Scheibe, wie sie hier vorher steckte, gibt es an keinem Auto.
   ========================================================= */
const AUTOFORM={
  /* L/B/H und Radstand nach gaengigen Fahrzeugen der Klasse.
     vu/hu sind die Ueberhaenge - der Kombi hat hinten deutlich mehr,
     der Kleinwagen vorn und hinten wenig. */
  limo : {L:4.62,B:1.80,H:1.45,rad:0.330,kabL:2.26,kabZ:-0.30,vu:0.86,hu:0.98,stufe:true },
  kombi: {L:4.76,B:1.81,H:1.49,rad:0.330,kabL:2.78,kabZ:-0.46,vu:0.88,hu:1.18,stufe:false},
  suv  : {L:4.58,B:1.87,H:1.68,rad:0.365,kabL:2.52,kabZ:-0.34,vu:0.90,hu:0.98,stufe:false},
  van  : {L:4.55,B:1.83,H:1.70,rad:0.330,kabL:2.70,kabZ:-0.22,vu:0.87,hu:0.96,stufe:false},
  klein: {L:4.05,B:1.74,H:1.46,rad:0.305,kabL:2.06,kabZ:-0.34,vu:0.72,hu:0.78,stufe:false}
};
let _lackM=null,_gummiM=null;
function autoMats(){
  if(!_lackM){
    /* Lack spiegelt, Gummi nicht - in einem Mesh ginge das nicht */
    _lackM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.34,metalness:0.22});
    _gummiM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.92,metalness:0.02});
  }
}
function makeAuto(col,form){
  form=AUTOFORM[form]?form:pick(['limo','kombi','suv','van','klein']);
  autoMats();
  const F=AUTOFORM[form];
  const L=F.L, B=F.B, rad=F.rad, kabL=F.kabL, kabZ=F.kabZ;
  const schwelle=rad*0.92;                  /* Unterkante Tuer        */
  const gurt=F.H*(F.stufe?0.655:0.640);     /* Unterkante Seitenfenster */
  const dach=F.H;                           /* Dachhaut               */
  const gh=dach-gurt;                       /* Hoehe der Fahrgastzelle */
  const vA= L/2-F.vu, hA=-(L/2-F.hu);       /* Radmitten */
  const RX=B/2-0.125;                       /* Rad buendig unter der Flanke */

  const lack=[], gummi=[];
  const dunkel=0x15171d, glas=0x1a2431, chrome=0xb9bec8, alu=0xa8aeb8;
  const SEG=HIQ?4:2;
  const RB=(w,h,d,r)=>roundedBoxGeo(w,h,d,r,SEG);
  const CY=(r1,r2,h,sg)=>new THREE.CylinderGeometry(r1,r2,h,sg||(HIQ?18:10));
  const P=(a,geo,x,y,z,rx,ry,rz,c)=>a.push({geo,m:tm(x,y,z,rx||0,ry||0,rz||0),color:c});
  const K=(geo,x,y,z,rx,ry,rz,c)=>P(lack,geo,x,y,z,rx,ry,rz,c);
  const G=(geo,x,y,z,rx,ry,rz,c)=>P(gummi,geo,x,y,z,rx,ry,rz,c);

  /* ---------- Karosserie ----------
     Drei uebereinanderliegende Volumen geben die Flanke: unten schmal
     (Schweller), in der Mitte am breitesten, zur Guertellinie wieder
     eingezogen. Das ist die Form, die ein Auto von vorn rund macht. */
  const kh=gurt-schwelle;                   /* Hoehe der Flanke */
  const mY2=schwelle+kh/2;
  /* Die Karosserie ist zwischen den Achsen am breitesten und laeuft
     davor und dahinter schmaler zu. Genau dort, vor der Vorderachse
     und hinter der Hinterachse, verjuengt sich auch ein echtes Auto -
     eine durchgehend gleich breite Box bleibt immer eine Kiste. */
  const mz0=hA-0.30, mz1=vA+0.30;
  K(RB(B,kh,mz1-mz0,0.30), 0, mY2, (mz0+mz1)/2, 0,0,0, col);
  /* Vorderwagen und Nase */
  { const z0=mz1-0.12, z1=L/2-0.02;
    K(RB(B-0.08,kh,z1-z0,0.26), 0, mY2, (z0+z1)/2, 0,0,0, col);
    K(RB(B-0.22,kh*0.90,0.30,0.20), 0, mY2-kh*0.03, z1-0.13, 0,0,0, col); }
  /* Hinterwagen und Heckabschluss */
  { const z1=mz0+0.12, z0=-(L/2-0.02);
    K(RB(B-0.07,kh,z1-z0,0.26), 0, mY2, (z0+z1)/2, 0,0,0, col);
    K(RB(B-0.19,kh*0.92,0.26,0.20), 0, mY2-kh*0.02, z0+0.11, 0,0,0, col); }
  /* flache Sicke unter den Fenstern, nur ein Zentimeter tief */
  K(RB(B+0.012,kh*0.16,L-0.90,0.03), 0, gurt-kh*0.30, 0, 0,0,0, col);
  /* Fuge zwischen Seitenteil und Klappe */
  K(RB(B-0.13,0.012,0.016,0.004), 0, gurt-0.035, mz0+0.10, 0,0,0, 0x0d0f14);
  /* Schweller bleibt matt und ist kaum schmaler als die Flanke */
  G(RB(B-0.015,0.11,L-1.45,0.04), 0, schwelle+0.02, 0, 0,0,0, 0x1b1e24);

  /* Motorhaube: vom Fuss der Frontscheibe bis zur Nase, leicht fallend */
  const hz0=kabZ+kabL/2, hz1=L/2-0.06, hL=hz1-hz0;
  K(RB(B-0.12,0.17,hL,0.13), 0, gurt-0.03, (hz0+hz1)/2, -0.055,0,0, col);
  /* Haubenfuge statt zweiter Platte: die lag ueber der Guertellinie
     und stand als heller Wulst ueber der Nase. */
  for(const s of [-1,1])
    K(RB(0.012,0.02,hL-0.18,0.005), s*(B/2-0.20), gurt+0.015-0.055*0, (hz0+hz1)/2+0.04, -0.055,0,0, 0x0d0f14);
  /* Heck: Kofferraumdeckel oder steile Klappe */
  const kz0=-(L/2-0.10), kz1=kabZ-kabL/2;
  if(F.stufe) K(RB(B-0.16,0.15,kz1-kz0,0.12), 0, gurt-0.03, (kz0+kz1)/2, 0.035,0,0, col);
  else        K(RB(B-0.16,gh*0.86,0.34,0.14), 0, gurt+gh*0.43, kz1-0.06, 0,0,0, col);

  /* ---------- Fahrgastzelle ----------
     Aufgebaut wie am echten Auto: rundum Glas, davor die Saeulen,
     darauf die Dachhaut. Vorher waren Front- und Heckscheibe schraege
     Platten, die vor der Zelle in der Luft standen - von der Seite ein
     schwarzer Keil ueber der Motorhaube. Jetzt schliessen sie die
     Zelle vorn und hinten bündig ab, und das Dach dazwischen ist
     genau so lang, wie die beiden Neigungen uebrig lassen. */
  const aF=0.60, aH=F.stufe?0.52:0.20;        /* Neigung Front / Heck */
  const wsZ=gh*Math.tan(aF), rwZ=gh*Math.tan(aH);
  const zF=kabZ+kabL/2, zH=kabZ-kabL/2;       /* Fuss der Scheiben */
  const dachL=Math.max(0.42,kabL-wsZ-rwZ);
  const dachZ=zF-wsZ-dachL/2;
  const mY=(gurt+dach)/2;
  /* Seitenfenster als durchgehendes Glasband */
  { const gl0=zH+rwZ*0.30, gl1=zF-wsZ*0.72;
    for(const s of [-1,1])

    G(CY(rad,rad,0.205),                 x, rad, z, 0,0,Math.PI/2, 0x16181c);

    K(new THREE.TorusGeometry(rad*0.615,0.026,6,HIQ?18:10),

  for(const s of [-1,1]){

    K(RB(0.09,0.08,0.04,0.015),s*(B/2-0.42), lampY+0.06, -L/2-0.005,0,0,0, 0xe8b060);
    K(RB(0.08,0.07,0.04,0.015),s*(B/2-0.13), lampY+0.06, -L/2-0.005,0,0,0, 0xf2f2ee);
    /* Spiegel am Fuss der A-Saeule */
    K(RB(0.07,0.04,0.07,0.02), s*(B/2-0.02), gurt+gh*0.20, kabZ+kabL/2-0.10, 0,0,0, col);
    K(RB(0.17,0.10,0.07,0.03), s*(B/2+0.07), gurt+gh*0.22, kabZ+kabL/2-0.14, 0,0,0.10, col);
    K(RB(0.13,0.075,0.02,0.008),s*(B/2+0.11),gurt+gh*0.22, kabZ+kabL/2-0.14, 0,0,0.10, 0x4e545e);
    /* Tuergriffe und Fugen */
    for(const dz of [kabZ+kabL*0.20, kabZ-kabL*0.24])

    K(RB(0.01,kh*0.62,0.016,0.004), s*(B/2+0.006), schwelle+kh*0.52, kabZ-kabL*0.30, 0,0,0, 0x0d0f14);
  }
  /* Kennzeichen */
  for(const sz of [1,-1]) K(RB(0.50,0.11,0.025,0.01), 0, schwelle+0.20, sz*(L/2+0.02), 0,0,0, 0xf2f2ee);

  K(RB(0.012,0.16,0.16,0.015), B/2+0.006, gurt-kh*0.30, hA-0.22, 0,0,0, 0x0d0f14);
  for(const s of [-1,1])
    K(RB(0.38,0.018,0.018,0.007), s*0.28, gurt+0.03, kabZ+kabL/2+0.12, 0,0,s*0.22, 0x1b1e25);
  G(CY(0.04,0.045,0.13,10), 0.40, schwelle-0.02, -L/2-0.02, Math.PI/2,0,0, 0x9aa1ac);

}
function makeBaum(){
  /* Echter Winterbaum: Wurzelanlauf, sich verjuengender Stamm mit
     Neigung, drei Astordnungen mit abnehmendem Radius und Laenge,
     feine Zweige an den Enden, Schnee auf den Oberseiten. */
  const parts=[];
  const RINDE=[0x4a3a2c,0x53422f,0x5c4a35,0x463728], SCHNEE=0xe8ecf2;
  const tiefe=HIQ?3:2, SEG=HIQ?8:5;
  let aeste=0;
  /* Ein Segment von p in Richtung (dir) mit Laenge l und Radien r0/r1 */
  const seg=(p,dir,l,r0,r1,col)=>{
    const e={x:p.x+dir.x*l,y:p.y+dir.y*l,z:p.z+dir.z*l};
    const m={x:(p.x+e.x)/2,y:(p.y+e.y)/2,z:(p.z+e.z)/2};
    const len=Math.hypot(dir.x,dir.y,dir.z)*l;
    /* Ausrichtung: der Zylinder zeigt in +y und wird um x und z
       gekippt. Bei der Eulerfolge XYZ gilt R = Rz*Rx, angewandt auf
       (0,1,0) ergibt das (-cos(rx)*sin(rz), cos(rx)*cos(rz), sin(rx)).
       Beide Winkel hatten hier das falsche Vorzeichen: die Segmente
       zeigten spiegelverkehrt, waehrend die Kinderaeste am richtig
       gerechneten Endpunkt ansetzten - daher die Aeste, die frei im
       Himmel hingen. */
    const rz=-Math.atan2(dir.x,dir.y), rx=Math.atan2(dir.z,Math.hypot(dir.x,dir.y));
    parts.push({geo:new THREE.CylinderGeometry(r1,r0,len,Math.max(4,SEG-(r0<0.05?3:0))),
      m:tm(m.x,m.y,m.z,rx,0,rz),color:col});
    /* Knoten an der Gabelung, damit keine Kante klafft */
    if(r1>0.03) parts.push({geo:new THREE.SphereGeometry(r1*1.12,6,4),m:tm(e.x,e.y,e.z),color:col});
    return e;
  };
  const norm=v=>{ const n=Math.hypot(v.x,v.y,v.z)||1; return {x:v.x/n,y:v.y/n,z:v.z/n}; };
  const ast=(p,dir,l,r,d)=>{
    aeste++;
    const col=pick(RINDE);
    /* Leichter Bogen: der Ast wird in zwei Teilen gesetzt */
    const d1=norm({x:dir.x,y:dir.y,z:dir.z});
    const e1=seg(p,d1,l*0.55,r,r*0.74,col);
    const droop=d>0?-0.12:-0.03;
    const d2=norm({x:d1.x*1.12+rand(-0.12,0.12),y:d1.y+droop,z:d1.z*1.12+rand(-0.12,0.12)});
    const e2=seg(e1,d2,l*0.45,r*0.74,r*0.5,col);
    /* Schneeauflage auf der Oberseite des Astes */
    if(r>0.035) parts.push({geo:new THREE.CylinderGeometry(r*0.42,r*0.62,l*0.5,4),
      m:tm((p.x+e1.x)/2,(p.y+e1.y)/2+r*0.7,(p.z+e1.z)/2,
           Math.atan2(d1.z,Math.hypot(d1.x,d1.y)),0,-Math.atan2(d1.x,d1.y)),color:SCHNEE});
    if(d<=0){
      /* Feine Endzweige */
      for(let k=0;k<3;k++){
        const dz=norm({x:d2.x+rand(-0.55,0.55),y:d2.y+rand(-0.1,0.35),z:d2.z+rand(-0.55,0.55)});
        seg(e2,dz,l*rand(0.2,0.36),r*0.5,r*0.16,col);
      }
      return;
    }
    const n=2+(Math.random()<0.45?1:0);
    for(let k=0;k<n;k++){
      const dz=norm({x:d2.x+rand(-0.75,0.75),y:d2.y+rand(0.05,0.45),z:d2.z+rand(-0.75,0.75)});
      ast(e2,dz,l*rand(0.52,0.68),r*rand(0.46,0.6),d-1);
    }
  };
  /* Wurzelanlauf */
  for(let i=0;i<7;i++){ const a=i/7*Math.PI*2+rand(-0.18,0.18);
    parts.push({geo:new THREE.CylinderGeometry(0.045,0.15,0.62,6),
      m:tm(Math.cos(a)*0.17,0.24,Math.sin(a)*0.17,0.42*Math.sin(a+Math.PI/2),0,-0.42*Math.cos(a+Math.PI/2)),color:RINDE[3]}); }
  /* Stamm in vier Abschnitten, jeder etwas schlanker und leicht versetzt */
  let p={x:0,y:0,z:0}, r=0.23;
  const gabeln=[];
  for(let i=0;i<4;i++){
    const h=rand(0.7,0.95), nr=r*rand(0.76,0.85);
    const d=norm({x:rand(-0.09,0.09),y:1,z:rand(-0.09,0.09)});
    p=seg(p,d,h,r,nr,RINDE[i%2]);
    r=nr;
    if(i>=1) gabeln.push({p:{x:p.x,y:p.y,z:p.z},r});
  }
  /* Krone: Hauptaeste aus den oberen Gabelungen */
  const n=HIQ?6:4;
  for(let i=0;i<n;i++){
    const gsel=gabeln[Math.min(gabeln.length-1,Math.floor(i/n*gabeln.length))];
    const a=i/n*Math.PI*2+rand(-0.4,0.4), auf=rand(0.55,1.05);
    ast(gsel.p,norm({x:Math.cos(a),y:auf,z:Math.sin(a)}),rand(1.0,1.5),gsel.r*rand(0.5,0.68),tiefe-1);
  }
  /* Spitze */
  ast(p,norm({x:rand(-0.15,0.15),y:1,z:rand(-0.15,0.15)}),rand(0.8,1.1),r*0.8,tiefe-1);
  const m=new THREE.Mesh(merge(parts),vcMat); if(HIQ) m.castShadow=true; return m;
}

function nachbarFassade(x0,x1,zid,unterzeile){
  const zf=6.1, H=WH+0.6;
  const g=new THREE.Group(); scene.add(g);
  /* Backsteinwand mit Verband, Fugen und Ausblühungen */
  const zieg=tex(512,512,(c,W,Hh)=>{
    c.fillStyle='#6a5348'; c.fillRect(0,0,W,Hh);
    const rows=16, bh=Hh/rows;
    for(let r=0;r<rows;r++){ const off=(r%2)*40;
      for(let x=-80;x<W;x+=80){
        c.fillStyle=pick(['#8a4f3c','#7e4735','#93573f','#74402f','#8a5a44','#6d4132']);
        c.fillRect(x+off+3,r*bh+3,74,bh-6);
        c.fillStyle='rgba(255,255,255,.06)'; c.fillRect(x+off+3,r*bh+3,74,2);
        c.fillStyle='rgba(0,0,0,.16)'; c.fillRect(x+off+3,r*bh+bh-5,74,2);
      } }
    for(let i=0;i<9;i++){ const x=Math.random()*W;
      const gr=c.createLinearGradient(x,0,x,Hh); gr.addColorStop(0,'rgba(230,226,214,.20)'); gr.addColorStop(1,'rgba(230,226,214,0)');
      c.fillStyle=gr; c.fillRect(x,rand(0,Hh*0.4),rand(20,70),Hh); }
    for(let i=0;i<2200;i++){ c.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`; c.fillRect(Math.random()*W,Math.random()*Hh,2,2); }
  });
  /* UV in Metern: dadurch passt der Verband ueber alle Wandstuecke hinweg */
  zieg.wrapS=zieg.wrapT=THREE.RepeatWrapping; zieg.repeat.set(1/1.6,1/1.6); zieg.anisotropy=8;
  const zm=new THREE.MeshStandardMaterial({map:zieg,roughness:0.95});

     sind sie zugemauert; nach dem Kauf sitzen dort Schaufenster.
     Die Achsen werden ueber die Laenge verteilt: die erste als hohes

  const OEFF=[]; const n=Math.max(2,Math.floor((w-0.8)/2.6));

  const F=(a,b,y0,y1)=>{ if(b>a+0.01) wall(a,b,zf-0.3,zf+0.1,y0,y1,'-z',shopWall,zm); };
  let px=x0;
  for(const [a,b,y0,y1] of OEFF){
    F(px,a,0,H); F(a,b,y1,H); if(y0>0) F(a,b,0,y0); px=b;
  }

  /* Attika, Gesims und Sockel */
  bbox(w+0.2,0.28,0.56,std(0x5f584e,{roughness:1}),cx,H+0.12,zf-0.1,g);
  bbox(w+0.1,0.1,0.5,std(0xe8ecf2,{roughness:1}),cx,H+0.3,zf-0.1,g,false);

  /* ---------- Zustand „steht zum Verkauf“ ---------- */

  const brett=std(0x6d5a44,{roughness:0.95});
  const zugemauert=std(0x5a4a3e,{roughness:0.95});
  OEFF.forEach(([a,b,y0,y1],i)=>{
    const bw=b-a, bh=y1-y0, bxc=(a+b)/2, byc=(y0+y1)/2;

    const n=Math.max(3,Math.round(bh/0.55));
    for(let k=0;k<n;k++) bbox(bw+0.14,0.16,0.06,brett,bxc,y0+0.22+k*(bh-0.4)/(n-1),zf+0.13,gs,false);
    /* zwei schraege Bretter ueber Kreuz */
    for(const sgn of [1,-1]){ const d=bbox(Math.hypot(bw,bh)+0.1,0.14,0.05,brett,bxc,byc,zf+0.15,gs,false);
      d.rotation.z=sgn*Math.atan2(bh,bw); }
  });
  /* Bauschild: Verkaufsflaeche wird verkauft */
  const schildT=tex(1024,512,(c,W,Hh)=>{
    c.fillStyle='#f4f2ea'; c.fillRect(0,0,W,Hh);
    c.fillStyle='#1b2340'; c.fillRect(0,0,W,96);
    c.fillStyle='#ffd23f'; c.textAlign='center'; c.textBaseline='middle';

    c.strokeStyle='#1b2340'; c.lineWidth=10; c.strokeRect(5,5,W-10,Hh-10);

const TOR={x:-19.95,z:-2,w:3.26,h:3.0,ph:0.6,n:5,R:0.42};

function panelPose(s){
  const {x,h,R}=TOR, arc=R*Math.PI/2;
  if(s<=h) return {x,y:s,rz:0};
  if(s<=h+arc){ const a=(s-h)/R; return {x:x+R-R*Math.cos(a),y:h+R*Math.sin(a),rz:a}; }
  return {x:x+R+(s-h-arc),y:h+R,rz:Math.PI/2};
}
function doorSet(t){
  if(!door) return;
  door.t=clamp(t,0,TOR.h);
  door.panels.forEach((pn,i)=>{
    const po=panelPose(door.t+i*TOR.ph+TOR.ph/2);
    pn.position.set(po.x,po.y,TOR.z); pn.rotation.z=po.rz;
